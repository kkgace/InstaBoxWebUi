# 构建并发布预构建镜像到 ghcr.io
#
# 触发：push 到 main（源码/Dockerfile 变更）、打 v* 标签、手动 dispatch
# 产物：ghcr.io/kkgace/instaboxwebui:latest（main）/ :v1.2.3（tag）/ :sha-xxxx（每次提交）
# 平台：linux/amd64 + linux/arm64
#
# 注意：私有仓库推送的镜像默认也是私有的，docker pull 前需先
#   docker login ghcr.io -u <用户名>（密码用具有 read:packages 的 PAT）
# 仓库开源后在 GitHub → Packages → instaboxwebui → Package settings →
#   Change visibility → Public，即可匿名拉取。

name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # kkgace/InstaBoxWebUi → ghcr.io/kkgace/instaboxwebui（自动小写）

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
