    UpdateOrgRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    DeleteOrgRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, description: "The workspace's name, exactly: the confirmation." }
    UpdateOrgBillingRequest:
      type: object
      description: Give at least one of the fields.
      properties:
        spendCapUSD: { type: number, minimum: -1, description: "The cap on this month's usage beyond the allowance; 0: nothing beyond it; -1: no cap." }
        usageAlertPercent: { type: integer, minimum: 0, maximum: 100, description: "The usage alert's share of what the month includes; 0: off." }
        overageAlert: { type: boolean, description: Whether to email when usage goes beyond what the month includes. }
    Error:
      type: object
      required: [ code, message, requestId, retryable, operationId ]
      properties:
        code:
          type: string
          description: Machine-readable code. HTTP status per code is fixed.
          enum:
            - unauthenticated # 401, a bad refresh token, ticket or other non-API credential
            - missing_key # 401, no credential sent
            - malformed_key # 401, not an API key (ibk_ + 52 of a-z2-7) or access token (iba_...)
            - invalid_key # 401, a well-formed API key or access token that does not exist
            - expired_key # 401, the API key or access token expired
            - revoked_key # 401, the API key or access token was revoked (signed out, or its user disabled)
            - session_expired # 401, the dashboard session cookie is no longer valid
            - missing_scope # 403, the API key lacks the route's scope (requiredScopes)
            - permission_denied # 403
            - not_found # 404
            - bad_request # 400; 405, a write to a read-only admin route; 408, a file transfer ran past its time limit; 413, the support service refused feedback as too large
            - feature_disabled # 400, a route this server has not turned on yet (server.json features)
            - unknown_field # 400, a sandbox create/fork/restore/start/stop/suspend/resume/wake/PATCH body key that is no field of its request schema (the message suggests the closest)
            - operation_conflict # 409
            - idempotency_conflict # 409
            - machine_not_running # 409
            - restore_unavailable # 409, POST /v1/machines/{id}/restore: the sandbox's host runs a node-agent that cannot restore in place; nothing changed
            - delete_confirmation_required # 409, a DELETE's X-Confirm-Delete is not the sandbox's or snapshot's ID or name, or is missing where required
            - fork_unavailable # 409, POST /v1/machines/{id}/fork cannot fork this sandbox natively (suspended, no host, or its host cannot; retryable with reason source_host_unavailable/source_host_full when its host is under maintenance or full); nothing created
            - machine_cooldown # 409, retryable: the sandbox rests until cooldownUntil (Retry-After): it reached its maximum runtime, or an automatic abuse check paused and locked it (reason abuse_*)
            - max_run_disabled # 409, waking a sandbox whose maxRunMinutes is 0; 400, a PATCH with apply "restart" that leaves maxRunMinutes 0
            - desktop_not_running # 409, GET /v1/machines/{id}/vnc before the desktop started
            - disk_too_small # 409, a /data shrink to a size its data does not fit; nothing changed
            - grow_needs_stop # 409, a running sandbox's disk cannot grow online now; stop it and send the size again
            - resize_restart_off # 400, PATCH /v1/machines/{id} apply "restart" on a server that does not take it yet
            - private_ports_unavailable # 503, retryable: the public-port proxy still runs a release without private ports
            - quota_exceeded # 429
            - no_capacity # 503; 409, an admin drain with nowhere to move the sandboxes
            - host_unavailable # 503; 502, the sandbox's guest or an access backend did not answer (the process list, legacy access)
            - metrics_unavailable # 503, admin metrics routes
            - internal # 500; 502, an upstream (sign-in, GitHub, email) failed; 503, a service this server needs is not configured or not ready
            - authorization_pending # 400, device flow
            - slow_down # 400, device flow
            - expired_token # 400, device flow
            - access_denied # 400, device flow
            - invalid_grant # 400, /v1/auth/cli/token
            - invite_required # 403, the account must redeem an invite code first (docs/invites.md)
            - invite_invalid # 400, the code is unknown, expired, revoked or used up
            - invite_email_mismatch # 403, a workspace invite was emailed to another address than the account's
            - api_key_expired # 401, older servers: now expired_key
            - api_key_revoked # 401, older servers: now revoked_key
            - insufficient_scope # 403, older servers: now missing_scope
            - orca_unsupported # 409, the machine's template has no Orca runtime
            - runtime_not_ready # 409, retryable: the Orca runtime is not reachable yet
            - spec_not_allowed # 400, the request names a machine size the plan does not offer; 403, the machine is larger than the org's plan offers, or an idle time (autoSuspendAfterSeconds) the plan does not offer (the free sandbox's fixed 1800, or 0 without always on); 409, a restore whose snapshot does not fit the sandbox (another host pool, a disk size it cannot take)
            - template_not_allowed # 403, the org's plan creates sandboxes from other templates only (free: agent-browser, android, omarchy or ci), or the snapshot holds a machine of an internal-test template this account may not create from; a create from a snapshot of an ordinary template is not limited
            - template_limit # 403, an internal-test template has reached its configured number of machines (in total or per account)
            - kernel_unavailable # 503, retryable: the template pins a guest kernel that no usable host has; it is never booted on another kernel
            - template_unavailable # 503, retryable: no usable host holds any version of the template right now (a template rollout before a host has the new image); nothing was created
            - invalid_guest_user # 400, a create's guestUser is not a valid or allowed Linux user name
            - vault_unavailable # 503, Secret encryption or delivery is unavailable
            - vault_retired # reserved; Vault writes and delivery remain supported
            - credit_exhausted # 402, the account's free sandbox used its monthly hours
            - spend_limit_reached # 402, a paid org reached its spend cap (or its allowance while past due)
            - subscription_required # 402, the workspace's plan ended; it cannot be used until it subscribes again
            - payment_method_required # 402, a free workspace has no card on file; add one before its sandboxes run
            - early_allowance_ended # 402, the early free-sandbox allowance ended (2026-12-01) and the org already runs as many free sandboxes as the standard limit allows; pause the running one, delete some, or upgrade
            - rate_limited # 429, retryable: the org made its plan's sandbox starts for the last minute (Retry-After)
            - concurrency_limit # 429, the org's plan allows no more sandboxes running at once
            - payment_failed # 402, the charge a plan change needed did not succeed; the plan is unchanged
            - missing_parent # 404, a file write's directory does not exist (parents=true creates it)
            - not_a_file # 409, a file write or download names a directory or a non-regular file
            - no_space # 507, the sandbox's disk filled during a file write
            - too_large # 413, a file upload is over 5 GiB
            - data_disk_not_browsable # 400, snapshot files names a path on /data, the data disk, which it does not read
            - support_unavailable # 503, this server relays no feedback or reads no tickets, or the support service did not answer; 504, it did not confirm in time and may have recorded it
            - host_oom # reserved; only a stopped sandbox's lastError, never an HTTP response: the host ran out of memory and its OOM killer killed the sandbox's VMM
            - vmm_crashed # reserved; only a stopped sandbox's lastError: the VMM was killed or exited with no host OOM kill and no shutdown in the guest
            - guest_reboot_loop # reserved; only a stopped sandbox's lastError: the guest kept exiting or restarting soon after it booted, so the host left it stopped
        message: { type: string }
        requestId: { type: string }
        retryable:
          type: boolean
          description: True if the same request may succeed later.
        operationId:
          type: [ string, "null" ]
          description: For `operation_conflict`, the active operation.
        reason:
          type: string
          description: >-
            The same as `code` for credential errors (401 `missing_key`, `malformed_key`, `invalid_key`, `expired_key`, `revoked_key`, `session_expired`; 403 `missing_scope`). For 409 `machine_cooldown`, the automatic abuse check whose pause locks the sandbox: `abuse_egress_blocklist` (it tried to connect to a blocked destination on the egress blocklist, not a DNS lookup), `abuse_network_flows` (scanning or attack traffic), `abuse_cpu` (mining); absent for a max-run cooldown. For a retryable 409 `fork_unavailable`, why the source's host cannot take the fork: `source_host_unavailable` (it takes no new sandboxes) or `source_host_full` (no room now). Absent on other errors and from older servers.
          enum: [ missing_key, malformed_key, invalid_key, expired_key, revoked_key, session_expired, missing_scope, abuse_egress_blocklist, abuse_network_flows, abuse_cpu, source_host_unavailable, source_host_full ]
        hint:
          type: string
          description: The next step that fixes the error (credential errors). Absent otherwise.
        docs:
          type: string
          format: uri
          description: A URL documenting the error (credential errors). Absent otherwise.
        docs_url:
          type: string
          format: uri
          description: >-
            The code's entry on the errors page, on every error response: https://instabox.sh/docs/errors#<code> with underscores as dashes (e.g. #credit-exhausted): its HTTP status, whether to retry and what to do. Snake case, unlike the other fields. Absent from a failed operation's `error` and from older servers.
        requiredScopes:
          type: array
          items: { type: string }
          description: For `missing_scope`, the scopes the route accepts; the key needs one of them.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: >-
            Seconds to wait before trying again: a retryable `no_capacity` (60, as a 503 or on a failed operation's `error`), `rate_limited`, `machine_cooldown` and agent sign-up `quota_exceeded`. An error response also sends it as the `Retry-After` header; a failed operation's `error` has only this field. Absent otherwise and from older servers.
        at:
          type: string
          format: date-time
          description: >-
            When it happened, for a stop the platform found (a sandbox's `lastError` with code `host_oom`, `vmm_crashed` or `guest_reboot_loop`; `hint` says what to do). The next successful start clears the error. Absent otherwise and from older servers.

    DeviceStart:
      type: object
      required: [ deviceCode, userCode, verificationUri, interval, expiresIn ]
      properties:
        deviceCode: { type: string }
        userCode: { type: string }
        verificationUri: { type: string, format: uri }
        verificationUriComplete: { type: string, format: uri, description: "`verificationUri` with the user code filled in, when the device sign-in offers one (WorkOS's does, GitHub's does not). Clients open it and still show the code to compare." }
        interval: { type: integer, description: Seconds between polls. }
        expiresIn: { type: integer, description: Seconds until the codes expire. }
        provider: { type: string, enum: [ github, workos ], description: "The device sign-in the flow uses: `github` (GitHub's device flow) or `workos` (WorkOS CLI Auth, GitHub or Google). Absent from servers before it." }
    DeviceStartRequest:
      type: object
      properties:
        invite: { type: string, maxLength: 64, description: "An invite code (`K7R2QX`; older `482913` and `ibi_...` codes work too) for an account that is not activated yet; spaces around it, spaces or dashes inside a 6-character code and case do not matter." }
        provider: { type: string, enum: [ github, google, workos ], description: "Optional. Absent or `github`: the server's default device sign-in. `workos`: WorkOS's, wherever WorkOS is configured (docs/workos.md), else `400`. `google`: WorkOS's where WorkOS is the default, else `400` (its dark launch admits administrators only). Servers before it ignore the field, so a client asking for `google` or `workos` checks the reply's `provider` is `workos` before showing the code." }
    AgentRegisterRequest:
      type: object
      properties:
        name: { type: string, maxLength: 64, description: "The key's name, shown to the person who claims and on the API keys page (default `agent`)." }
        email: { type: string, maxLength: 320, description: "Who is expected to claim, shown to them as a hint. Nothing is sent to it." }
        scopes: { type: array, items: { $ref: "#/components/schemas/APIKeyScope" }, description: "Default `machines:read machines:write machines:delete images:read`. The person may approve fewer." }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, default: 0, description: "The key's requested life in days, 1-365. 0 or absent: a key that does not expire. The person may shorten it." }
    AgentRegistration:
      type: object
      required: [ claimToken, userCode, verificationUri, verificationUriComplete, interval, expiresIn, expiresAt, name, scopes ]
      properties:
        claimToken: { type: string, description: "`ibg_...`, the agent's secret for `POST /v1/auth/agent/token`. Shown to no one." }
        userCode: { type: string, description: "What the person enters on the claim page, `XXXX-XXXX`." }
        verificationUri: { type: string, format: uri, description: The dashboard's claim page. }
        verificationUriComplete: { type: string, format: uri, description: The claim page with the code filled in. Show the code anyway. }
        interval: { type: integer, description: Seconds between polls. }
        expiresIn: { type: integer, description: Seconds the code can be claimed for. }
        expiresAt: { type: string, format: date-time }
        name: { type: string, description: "The key's name, after the default." }
        scopes: { type: array, items: { $ref: "#/components/schemas/APIKeyScope" }, description: "The scopes asked for, after the default." }
    AgentTokenRequest:
      type: object
      required: [ claimToken ]
      properties:
        claimToken: { type: string }
        ack:
          type: boolean
          description: Acknowledge the delivered key once it is stored; the server erases its sealed copy and later polls answer `expired_token`.
    AgentClaimed:
      type: object
      required: [ apiKey, key, userId, login ]
      properties:
        apiKey: { $ref: "#/components/schemas/APIKey" }
        key: { type: string, pattern: "^ibk_[a-z2-7]{52}$", description: "The secret, shown only in this reply and to polls repeated within the 10-minute delivery window." }
        userId: { type: integer, format: int64, description: The account the key belongs to. }
        login: { type: string, description: That account's login. }
    AgentClaimPreview:
      type: object
      required: [ name, scopes, expiresInDays, createdAt, expiresAt, clientIp ]
      properties:
        name: { type: string }
        email: { type: string, description: "Who the agent expects to claim, if it said." }
        scopes: { type: array, items: { $ref: "#/components/schemas/APIKeyScope" } }
        expiresInDays: { type: integer, description: "The key life asked for; 0: never expires." }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Until when the code can be claimed. }
        clientIp: { type: string, description: Where the agent registered from. }
    AgentClaimRequest:
      type: object
      required: [ code, decision ]
      properties:
        code: { type: string, maxLength: 32, description: "The user code the agent printed (`XXXX-XXXX`)." }
        decision: { type: string, enum: [ approve, deny ] }
        userId: { type: integer, format: int64, description: "Optional: must be the session's account." }
        scopes: { type: array, items: { $ref: "#/components/schemas/APIKeyScope" }, description: "Grants only these of the scopes the agent asked for: a non-empty subset of them (a scope it did not ask for is `400`)." }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, description: "Shortens the requested expiry; a finite request cannot be lengthened or made `0` (never), which is `400`." }
    AgentClaimResult:
      type: object
      required: [ state, name ]
      properties:
        state: { type: string, enum: [ claimed, denied ], description: "`claimed`: the agent's next poll gets its key." }
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/APIKeyScope" }, description: The scopes approved. }
        expiresInDays: { type: integer, description: "The key life approved; 0: never." }
    DeviceTokenRequest:
      type: object
      required: [ deviceCode ]
      properties:
        deviceCode: { type: string }
    CLITokenRequest:
      type: object
      required: [ code, codeVerifier, redirectUri ]
      properties:
        code: { type: string, description: "One-time code (`ibc_...`) from the redirect URI." }
        codeVerifier: { type: string, minLength: 43, maxLength: 128 }
        redirectUri: { type: string, description: The exact `redirect_uri` sent to `/auth/cli/start`. }
    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken: { type: string }
    Tokens:
      type: object
      required: [ accessToken, accessExpiresAt, refreshToken, refreshExpiresAt ]
      properties:
        accessToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
    Me:
      type: object
      required: [ userId, login ]
      properties:
        userId: { type: integer, format: int64, description: Instabox user ID. }
        login: { type: string, description: GitHub login at last sign-in (display only). }
        name: { type: string }
        email: { type: string, description: "The account's email, which an org invite must be sent to for it to join." }
        avatarUrl: { type: string, format: uri }
        admin: { type: boolean, description: "The user is an admin and may use the admin-only endpoints (`/v1/admin`)." }
        machineMetrics: { type: boolean, description: "Clients show this account per-sandbox metrics (the dashboard's Metrics tab, `instabox metrics`): admins always, every account once the server sets `machineMetricsForAll`. Absent: hidden. `GET /v1/machines/{id}/metrics` answers either way." }
        orgId: { type: string, description: "Set for a workspace API key: its workspace. The user is then the workspace's owner, whom the key acts as." }
        adminUrl:
          type: string
          format: uri
          description: >-
            Admins only: the origin of the admin console when it has its own (the server's `adminUrl`). Absent, the console is `/admin/` on the dashboard's origin.
        billingEnabled: { type: boolean, description: "Paid plans can be subscribed: the server has Stripe configured. False: the dashboard offers no plan actions and the billing routes answer 503." }
        webhooksEnabled: { type: boolean, description: "This server offers org webhooks (docs/webhooks.md). False: the dashboard hides them, the CLI says they are off and the webhook routes answer 404." }
        emailInvites: { type: boolean, description: "This server emails workspace invites (server.json `email`). Absent: creating or resending an invite answers 503." }
        paidActivation: { type: boolean, description: "An account the invite gate holds back may buy a workspace (`POST /v1/orgs`) instead, and is activated once its plan takes effect (docs/invites.md). Absent: only an invite code lets it in." }
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanOffer" }
          description: The paid plans an org can go on (Pro, Builder, Team) as this server sells them, for plan pickers.
        csrfToken:
          type: string
          description: Browser sessions only. Send it as `X-Instabox-CSRF` on every request that is not GET or HEAD.
        allowedSpecs:
          type: array
          items: { $ref: "#/components/schemas/MachineSpec" }
          description: >-
            The sizes your new sandboxes may have in your personal org (no `rootDiskGiB`: the template's). The first is the server's `limits.machineSpec` (4 vCPUs and 8 GiB memory by default), what a create naming no size gets; the others are your plan's (Pro: 2/4, 4/8, 8/16; Builder: 2/4 up to 16/32; Team and Enterprise: 2/4 up to 32/64) and sizes an admin granted you, picked by naming their `vcpus` and `memMiB` on create. Any other size is refused with `spec_not_allowed`, admins included.
        org:
          allOf: [ { $ref: "#/components/schemas/OrgRef" } ]
          description: "The org `allowedSpecs`, `idleChoicesSeconds` and `alwaysOnAllowed` describe: your personal org, or a workspace key's workspace. Absent from older servers."
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/OrgRef" }
          description: "Your other orgs, each with its own plan and limits (`GET /v1/usage?org=ID`, `GET /v1/orgs/{id}`). Omitted when there are none, and for a workspace API key, which reaches only its own org."
        inviteRequired:
          type: boolean
          description: This server gates new accounts behind an invite code (docs/invites.md).
        activated:
          type: boolean
          description: >-
            This account passed the invite gate (admins always have). When `inviteRequired` and not `activated`, every route but this one, `POST /v1/invites/redeem` and `POST /v1/auth/logout` answers `403 invite_required`.
        manualLifecycle:
          type: boolean
          description: >-
            An admin let this account manage its sandboxes' lifecycle (docs/idle-suspend.md): the `autoSuspendAfterSeconds` it sends applies (0: off). Otherwise every sandbox pauses after `fixedAutoSuspendSeconds` idle, whatever a request says.
        fixedAutoSuspendSeconds:
          type: integer
          description: >-
            The idle auto-suspend every sandbox of this account gets on a server that offers no choice; absent when the account chooses (`manualLifecycle`, or `idleChoicesSeconds`).
        idleChoicesSeconds:
          type: array
          items: { type: integer }
          description: >-
            The idle times offered (300 to 1800, 5 to 30 minutes; docs/pricing.md): a request may send any whole minute from the first to the last. 0 (off) is never listed: `alwaysOnAllowed` says whether it is a choice too. Absent with `manualLifecycle`.
        alwaysOnAllowed:
          type: boolean
          description: >-
            Whether 0 (off) is a choice too, on `org`'s plan (the personal org's for a sign-in session). A sandbox in another org follows that org's plan: see its `workspaces` entry's `alwaysOnAllowed`.
        diskResize:
          type: string
          enum: [ allow, deny ]
          description: >-
            An admin's override of disk growth (`PATCH /v1/machines/{id}` `persistentDiskGiB`, `rootDiskGiB`): `allow` grows free sandboxes' disks too, `deny` none. Absent: paid sandboxes grow, free ones are fixed.
        resizeRestart:
          type: boolean
          description: "This server takes `PATCH /v1/machines/{id}` `apply: \"restart\"` (one stop, resize, start operation). Absent: it answers `400 resize_restart_off`; resize with your own stop, `PATCH`, start."
        directSecretRefs:
          type: boolean
          description: "This site takes direct Secret file references and renamed variables (`directSecrets`) and exec `secretEnvs`. Absent: they are refused with 400 (same-name references work); clients should not send them, since a control host from before them would ignore or misread them."
        termsVersion:
          type: string
          description: >-
            The version of the rules of the road (the Terms of Service's acceptable use) this account last agreed to (`PUT /v1/me/terms`). Absent: none.
        waitlist:
          type: object
          required: [ referralUrl ]
          description: >-
            The account's place in the line invite codes go out from and its referral link (docs/invites.md, "Referrals"). Absent: not in line (activated, the gate off, or a live code claimed for its email).
          properties:
            position:
              type: integer
              minimum: 1
              description: Absent when this server could not rank the line just now.
            referralUrl: { type: string, format: uri }
    RedeemInviteRequest:
      type: object
      required: [ code ]
      properties:
        code: { type: string, maxLength: 64, description: "An invite code (`K7R2QX`; older `482913` and `ibi_...` codes work too); spaces around it, spaces or dashes inside a 6-character code (`K7R 2QX`) and case do not matter." }
    AcceptTermsRequest:
      type: object
      required: [ version ]
      properties:
        version: { type: string, maxLength: 64, description: "The dashboard's version of the rules it showed." }
    FeedbackReport:
      type: object
      required: [ type, component, title, detail ]
      properties:
        type: { type: string, enum: [ bug, feature-request, friction, other ] }
        component: { type: string, enum: [ cli, api, sandbox, dashboard, skills, docs, other ] }
        severity: { type: string, enum: [ blocker, major, minor ], default: minor }
        title: { type: string }
        detail: { type: string }
        area: { type: string }
        command: { type: string }
        error: { type: string }
        expected: { type: string }
        workaround: { type: string }
        doc_ref: { type: string }
        sandbox: { type: string }
        client_version: { type: string }
        os: { type: string }
    FeedbackResult:
      type: object
      required: [ id, status ]
      properties:
        id: { type: string }
        status: { type: string }
        ticket:
          type: object
          properties:
            id: { type: string }
            url: { type: string, description: The ticket in the dashboard. }
    DiscordStatus:
      type: object
      required: [ configured, link ]
      properties:
        configured: { type: boolean, description: This server links Discord accounts. }
        link:
          description: The linked Discord account; null when none is linked.
          oneOf: [ { $ref: "#/components/schemas/DiscordLink" }, { type: "null" } ]
    DiscordLink:
      type: object
      required: [ discordId, username, linkedAt ]
      properties:
        discordId: { type: string, pattern: "^[0-9]{17,20}$", description: The Discord user ID. }
        username: { type: string, description: The Discord username when it was linked. }
        linkedAt: { type: string, format: date-time }
    Activation:
      type: object
      required: [ activated, activatedAt, admin ]
      properties:
        activated: { type: boolean }
        activatedAt: { type: [ string, "null" ], format: date-time, description: When the account was activated. }
        admin: { type: boolean, description: The account is an administrator now (an admin code grants the role). }

    MachineSpec:
      type: object
      description: A sandbox's size.
      required: [ vcpus, memMiB, persistentDiskGiB ]
      properties:
        vcpus: { type: integer }
        memMiB: { type: integer, description: Memory in MiB. }
        persistentDiskGiB: { type: integer, description: "Disk (`/data`) size in GiB." }
        rootDiskGiB: { type: integer, description: "System disk size in GiB, set by the template (only admins change it); absent: the template's." }
    PlanOffer:
      type: object
      description: A paid plan as this server sells it (server.json `plans`).
      required: [ tier, monthlyFeeUSD, maxMachines, maxRunning, maxVCPUs, maxDiskGiB ]
      properties:
        tier: { type: string, enum: [ pro, builder, team ] }
        monthlyFeeUSD: { type: number, description: "The monthly fee, also the usage it includes each month." }
        maxMachines: { type: integer, description: "Sandboxes the org may have on this plan, every one billed; 0: no limit." }
        maxRunning: { type: integer, description: "Paid sandboxes running at once; 0: no limit." }
        maxVCPUs: { type: integer, description: The largest sandbox size's vCPUs. }
        maxDiskGiB: { type: integer, description: "How far a sandbox's disk (`/data`) may grow on this plan, in GiB (free 20, fixed: it neither grows nor shrinks; pro 200; builder 500; team and enterprise 1024); a disk already past it is kept. 0: no limit." }
    Template:
      type: object
      required: [ id, version, digest, arch, defaultSpec ]
      description: A template version a sandbox can start from. Versions never change.
      properties:
        id: { type: string, examples: [ herdr ] }
        version: { type: string, examples: [ "2026-10-02.1" ] }
        digest: { type: string, description: "sha256:<rootfs sha>" }
        description: { type: string }
        arch: { type: string, examples: [ x86_64 ] }
        runtime:
          type: object
          additionalProperties: { type: string }
          description: Software baked into the template, e.g. {"herdr":"0.9.3"}.
        defaultSpec: { $ref: "#/components/schemas/MachineSpec" }
        capabilities:
          type: array
          items: { type: string, enum: [ identity-reset, root-grow, orca, activity ] }
          description: >-
            `identity-reset`: its sandboxes can be snapshotted. `root-grow`: an admin can grow its sandboxes' sizes. `orca`: its sandboxes run an Orca runtime (`POST /v1/machines/{id}/orca-connections`). `activity`: it ships activity probes for its agents, so pausing when idle (`autoSuspendAfterSeconds`) sees them working; without it, terminal and CPU activity alone count.
        kernel:
          type: string
          description: >-
            The guest kernel this version runs, `sha256:<hex>`: every sandbox created from it is pinned to that kernel for its whole life (cold boots, snapshots, restores and moves never use another) and is placed only on hosts that have it. Absent: the host's default kernel (every template before this field).
        pool:
          type: string
          description: >-
            The host pool every sandbox of this version runs in (e.g. `mac` for macOS); its `defaultSpec` is then the only size such a sandbox gets. Absent: the default placement and the server's sandbox size.
        restricted:
          type: boolean
          description: >-
            An internal test: only the accounts the operator listed, and admins, see it in this list or can create from it (a create by anyone else answers as for an unknown template). Sandboxes that exist keep working for their owners.
        hidden:
          type: boolean
          description: >-
            This template is no longer offered for new sandboxes: a create naming it is refused. It is still listed so that sandboxes and snapshots built on it keep showing its size and capabilities.
        staged:
          type: boolean
          description: >-
            A new version on its way to the hosts: a create may name it with `templateVersion`. A create without one gets it only once no host holds the current latest version any more; the operator's promote makes it the latest.
        creatable:
          type: boolean
          description: >-
            Whether a create may name this template (`POST /v1/machines` `templateId`): false for a `hidden` one, which is refused with `400`. The org's plan may still refuse a creatable one (`403 template_not_allowed`; the free plan creates from agent-browser, android, omarchy or ci only). Absent on servers older than this field: use `!hidden`.
        latest:
          type: boolean
          description: >-
            This is the version a create naming this `templateId` without a `templateVersion` gets: set on one creatable version per id. Absent on servers older than this field: the last listed version of the id, when it is creatable (a hidden one: none).
        default:
          type: boolean
          description: >-
            This is the version a create naming neither `templateId` nor `snapshotId` gets (the `latest` agent-browser). Absent on servers older than this field.
        preboot:
          type: boolean
          description: >-
            New sandboxes of this template version start faster: they come from an already booted copy, one per `prebootSpecs` entry (absent: its `defaultSpec`). Otherwise, or when no such copy is ready, the sandbox boots as usual.
        prebootSpecs:
          type: array
          items: { $ref: "#/components/schemas/MachineSpec" }
          description: >-
            The sizes `preboot` applies to. Absent: `defaultSpec` only.
    Stats:
      type: object
      required: [ runningMachines, at ]
      properties:
        runningMachines: { type: integer, minimum: 0 }
        at: { type: string, format: date-time }
    TemplateList:
      type: object
      required: [ templates ]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/Template" }
    TemplateRef:
      type: object
      required: [ id, version, digest ]
      properties:
        id: { type: string }
        version: { type: string }
        digest: { type: string }
        kernel: { type: string, description: "The guest kernel the sandbox is pinned to, `sha256:<hex>`; absent: the host's default." }
    Storage:
      type: object
      description: The sandbox's storage (`/data`, where HOME lives).
      required: [ sizeGiB, mountPath, persistent, synced ]
      properties:
        sizeGiB: { type: integer }
        mountPath: { type: string, examples: [ /data ] }
        persistent: { type: boolean }
        synced:
          type: boolean
          description: >-
            False while the latest state of a stopped or paused sandbox is still being saved: for a few seconds after a stop or pause, or longer if saving fails (it is retried). A snapshot waits until it is true.
        snapshotSeq:
          type: integer
          format: int64
          description: Sequence number of the sandbox's latest saved state; absent before the first stop or pause.
    Runtime:
      type: object
      required: [ ready ]
      properties:
        ready:
          type: boolean
          description: True only when the sandbox is running, reports all checks passing and, as checked when it boots or resumes, accepts exec, file and SSH connections.
        processesPreserved:
          type: boolean
          description: Set after a start or resume. False means the paused programs could not be brought back and the sandbox booted fresh (files are kept).
    MachineState:
      type: string
      enum: [ creating, starting, running, stopping, stopped, suspending, suspended, resuming, deleting, deleted, error ]
    Machine:
      type: object
      description: A sandbox.
      required: [ id, name, desiredState, state, revision, operationId, template, spec, storage, runtime, autoSuspendAfterSeconds, maxRunMinutes, runStartedAt, cooldownUntil, metadata, vault, guestUser, orgId, createdAt, updatedAt ]
      properties:
        id: { type: string }
        name: { type: string }
        desiredState: { $ref: "#/components/schemas/MachineState" }
        state: { $ref: "#/components/schemas/MachineState" }
        revision: { type: integer, format: int64, description: Increases with each accepted change. }
        operationId:
          type: [ string, "null" ]
          description: The active operation, if any.
        template: { $ref: "#/components/schemas/TemplateRef" }
        snapshot: { $ref: "#/components/schemas/SnapshotRef" }
        image:
          allOf: [ { $ref: "#/components/schemas/SnapshotRef" } ]
          deprecated: true
          description: "Deprecated: `snapshot`, under its old name (same value)."
        spec: { $ref: "#/components/schemas/MachineSpec" }
        storage: { $ref: "#/components/schemas/Storage" }
        runtime: { $ref: "#/components/schemas/Runtime" }
        lastError: { $ref: "#/components/schemas/Error" }
        archiveAt:
          type: [ string, "null" ]
          format: date-time
          description: >-
            When the sandbox is stopped if it is running (set at creation with `archiveSeconds`): its files are kept and a start brings it back. Resuming does not clear it; a sandbox that is not running when it passes only has it cleared. Absent: none.
        deleteAt:
          type: [ string, "null" ]
          format: date-time
          description: >-
            When the sandbox is deleted, whatever its state (set at creation with `deleteAfterSeconds`). The delete is an ordinary `delete` operation (`trigger: delete_at`), queued at `deleteAt` (within about a second) once no other operation is in progress. Absent: never.
        autoSuspendAfterSeconds:
          type: [ integer, "null" ]
          description: >-
            The running sandbox is paused once it has been idle this many seconds (no agent working, no terminal input or output, little CPU); null: off. Pause, resume, stop and start keep it.
        maxRunMinutes: { $ref: "#/components/schemas/MaxRunMinutes" }
        runStartedAt:
          type: [ string, "null" ]
          format: date-time
          description: Start of the current continuous run, conservatively initialized on a first error observation too; resets only after confirmed sleep.
        readyAt:
          type: string
          format: date-time
          readOnly: true
          description: >-
            When the running sandbox last became ready (`runtime.ready` turned true: SSH, exec and files work). For a new sandbox, `readyAt` minus `createdAt` is its create time; after a start or resume it is that start's. Absent while the sandbox is not ready, and on a sandbox that was already ready before the field existed (until its next start or resume).
        cooldownUntil:
          type: [ string, "null" ]
          format: date-time
          description: >-
            All wake paths are refused until this deadline, including admin actions: after a max-run suspension, or the 24-hour lock of an automatic abuse check's pause (cooldownReason).
        cooldownReason:
          type: string
          enum: [ abuse_egress_blocklist, abuse_network_flows, abuse_cpu ]
          description: >-
            While cooldownUntil has not passed, the automatic abuse check whose pause locks the sandbox, the same as a wake's 409 `machine_cooldown` Error.reason: `abuse_egress_blocklist` (it tried to connect to a blocked destination on the egress blocklist, not a DNS lookup), `abuse_network_flows` (scanning or attack traffic), `abuse_cpu` (mining). Absent for a max-run cooldown, and once the lock ends.
        abuseLock:
          $ref: "#/components/schemas/MachineAbuseLock"
          description: >-
            With cooldownReason: what the owner is told about the pause behind the lock. Absent when cooldownReason is.
        autoSuspendedAt:
          type: string
          format: date-time
          description: >-
            When the sandbox was queued to pause automatically; a successful automatic resume or its next explicit operation clears it. Absent: none.
        metadata: { $ref: "#/components/schemas/Metadata" }
        envNames:
          type: array
          items: { type: string }
          description: >-
            The names of the sandbox's create-time `env`, sorted. Absent when it has none. The values are never shown: read them in the sandbox.
        vault:
          type: boolean
          description: >-
            Whether legacy Vault delivery is enabled. Independent of org Secret selections and delivery status at the sandbox's /secrets endpoint.
        guestUser:
          type: string
          readOnly: true
          examples: [ alice ]
          description: >-
            The Linux user in the sandbox that SSH sessions, exec and the terminal log in as, fixed at create: the `guestUser` the create named, else `user` (a create from a snapshot: the snapshot's user). `dev` on sandboxes from templates without the `guest-user` capability, and on every sandbox created before the field.
        orgId:
          type: string
          readOnly: true
          description: The org the sandbox counts against (docs/orgs.md).
        free:
          type: boolean
          readOnly: true
          description: >-
            A free-tier org's sandbox (docs/pricing.md): never billed, pauses after 30 idle minutes (another `autoSuspendAfterSeconds` is refused with 403). On a paid plan every sandbox is billed.
        earlyAllowanceEnded:
          type: boolean
          readOnly: true
          description: >-
            Set on a stopped or paused free sandbox that cannot be started because its org's early free-sandbox allowance ended and as many free sandboxes as the standard limit allows are running: a start is refused (`402 early_allowance_ended`) until one is paused or deleted. Absent otherwise.
        oomKills:
          type: integer
          format: int64
          readOnly: true
          description: >-
            Processes the sandbox's kernel OOM killer killed since the sandbox was created (out of memory, or a memory cgroup's limit). Read from the sandbox about once a minute while it runs, and after an exec that exits non-zero; 0 on sandboxes whose host or guest agent predates the reading (absent from older servers).
        lastOom: { $ref: "#/components/schemas/OOMKill", description: "The newest OOM kill (absent until one is seen, or when the kernel log no longer held it)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OOMKill:
      type: object
      description: A process the sandbox's kernel OOM killer killed.
      required: [ at, pid, process, rssBytes, anonRssBytes, cgroup ]
      properties:
        at: { type: string, format: date-time, description: "When it was killed (to about a second)." }
        pid: { type: integer }
        process: { type: string, description: "The killed process's name: its comm (at most 15 bytes from the kernel), capped at 64 bytes." }
        uid: { type: integer, description: "The killed process's user ID, when the kernel logged it." }
        rssBytes: { type: integer, format: int64, description: "Its resident memory when it was killed (anonymous, file and shared)." }
        anonRssBytes: { type: integer, format: int64, description: "The anonymous part of rssBytes." }
        cgroup: { type: boolean, description: "A memory cgroup's limit killed it (a container, a unit's MemoryMax), not the sandbox running out of memory." }
    OOMClaimRequest:
      type: object
      additionalProperties: false
      required: [ cgroup, bootId ]
      properties:
        cgroup: { type: string, maxLength: 512, description: "A background job's cgroup in the sandbox: a session scope such as /user.slice/user-1000.slice/session-3.scope." }
        bootId: { type: string, maxLength: 64, description: "The sandbox boot the job ran in (/proc/sys/kernel/random/boot_id): only that boot's kills are returned, since session scope names repeat after a restart." }
    OOMClaim:
      type: object
      properties:
        oomKill: { $ref: "#/components/schemas/OOMKill", description: "The newest OOM kill whose victim was in the cgroup (absent: none named)." }
    Metadata:
      type: object
      description: >-
        String labels. At most 32 keys of 1-64 characters `[A-Za-z0-9_.-]`, values of at most 512 characters, 8 KiB as JSON.
      additionalProperties: { type: string }
    AutoSuspendAfterSeconds:
      type: integer
      description: >-
        Absent: 1800 (30 minutes). The plan decides, and a value is honoured or refused, never silently replaced: a paid sandbox takes 300-1800 (5 to 30 minutes) in whole minutes, as sent, and 0 (off) where the plan allows always on (else `403 spec_not_allowed`); below 300 (1-299), above 1800, negative or not a multiple of 60 is `400 bad_request`. The free sandbox is fixed at 1800: any other value is `403 spec_not_allowed`, a plan limit (older servers: `403 permission_denied`). A refused create makes no sandbox. The reply's `autoSuspendAfterSeconds` shows the effective value. Separately, an account an admin gave manual lifecycle (`GET /v1/me` `manualLifecycle`) sends 120-86400 idle seconds, or 0 never (docs/idle-suspend.md).
    MaxRunMinutes:
      type: integer
      minimum: -1
      maximum: 2147483647
      description: >-
        Maximum continuous runtime in minutes. -1 is unlimited; 0 sleeps immediately. Independent of idle auto-pause; whichever condition is reached first pauses the sandbox. Free machines default to 480 and only an admin session can change them. With dynamic runtime enabled, new free runs start at 120 minutes. Five minutes before the current deadline, the service reviews the preceding 30 complete minutes: five or more distinct work minutes add 120 minutes to that deadline; one to four add 30; none leave it unchanged. Missing activity coverage falls back to an absolute 480-minute cap for this run. Continuous runtime never exceeds 480 minutes. Lease renewals and wake requests do not count as work. The response reports the current effective limit from runStartedAt; it can change during the run. Paid machines default to -1 and their users can change this setting. Max-run suspension starts a cooldown, returning 409 machine_cooldown with Retry-After on every wake path. By default it is 5 to 20 minutes (5 plus a random 0 to 15) on a paid plan and for the first such pause in a row on the free plan. Back-to-back pauses on the free plan rest longer (60 to 75, then 120 to 135 minutes): "Longer cooldowns on the free plan" at https://instabox.sh/docs/machines/auto-pause#longer-cooldowns-on-the-free-plan. Once cooldown ends, 0 still refuses wake with 409 max_run_disabled until changed.
    MachineList:
      type: object
      required: [ machines, nextCursor ]
      properties:
        machines:
          type: array
          items: { $ref: "#/components/schemas/Machine" }
        nextCursor:
          type: [ string, "null" ]
          description: Pass as `cursor` for the next page; null on the last page.
    CreateMachineRequest:
      type: object
      additionalProperties: false
      description: Every field is optional; a body key that is none of these is refused with `400 unknown_field` (keys match case-insensitively). The lifetime timeout retired on 2026-10-20 is refused too; `timeoutSeconds`, `onTimeout` or `timeout` with any value but null is `400 unknown_field`, and the message names `deleteAfterSeconds`, `maxRunMinutes` and `autoSuspendAfterSeconds` instead (to a `User-Agent` of `instabox-cli/<version>`, whose builds before that date sent them, it says the CLI is out of date, how to install the current one, and names the flags `--delete-after`, `--max-run-minutes` and `--auto-suspend`). At most one of `templateId` and `snapshotId`; with neither, the sandbox starts from agent-browser, the CLI's and dashboard's default. Leave the size fields out for the default size, or name the `vcpus` and `memMiB` of another of your sizes (the org's plan's or one an admin granted the org; `GET /v1/orgs` `allowedSpecs`).
      properties:
        name: { type: string, description: "1-63 lowercase letters, digits or `-`, starting with a letter or digit; unique among the org's sandboxes. Absent or empty: `box-` and 8 random hex digits (the operation's `machineId` and the sandbox carry it)." }
        templateId: { type: string, examples: [ agent-browser ], description: "The template to create from (`GET /v1/templates`, one with `creatable` true), optionally with a version as `id@version` (e.g. `agent-browser@2026-10-15.4`, the same as `templateVersion`). Absent (and no `snapshotId` or `templateVersion`): agent-browser. An unknown or retired one is refused with `400 bad_request` whose message lists the templates your plan can create from. The free plan creates from agent-browser, android, omarchy or ci only; another template is refused with `403 template_not_allowed`. A create from a snapshot is not limited." }
        templateVersion: { type: string, description: "Default: the version `GET /v1/templates` marks `latest`. `templateId` may name it instead, as `id@version` (e.g. `agent-browser@2026-10-15.4`); both at once must agree. A version the template does not have is `400 bad_request` whose message lists its versions, newest first, the `latest` (or `default`) one tagged." }
        snapshotId: { type: string, description: "Create from this snapshot of yours: its system files and storage (empty storage for a system-files-only snapshot)." }
        imageId: { type: string, deprecated: true, description: "Deprecated: `snapshotId` under its old name (both: they must be equal). The reply carries a `Deprecation` header." }
        vcpus: { type: integer, minimum: 1, description: "Absent: the default size (4 vCPUs, 8 GiB memory; `limits.machineSpec`). Else one of the org's sizes (`GET /v1/orgs` `allowedSpecs`: the default, its plan's others and any size an admin granted the org; on api.instabox.sh free 4/8192 only, Pro 2/4096, 4/8192, 8/16384, Builder 2/4096 up to 16/32768, Team and Enterprise 2/4096 up to 32/65536); name memMiB too when two of them have this many vCPUs. Anything else is refused with `400 spec_not_allowed`; 0 or a negative (no size) with `400 bad_request`." }
        memMiB: { type: integer, minimum: 1, description: "Like vcpus: the memory (MiB) of one of your sizes, such as 8192 with vcpus 4; 0 or a negative is `400 bad_request`." }
        persistentDiskGiB: { type: integer, minimum: 1, description: "Storage (`/data`) size in GiB. The disks come with the size: storage gets the size's (20 GiB on api.instabox.sh), or a snapshot's storage size when that is larger. Absent or exactly that size: accepted; any other is `400 spec_not_allowed` whose message names the size's storage next to what was asked; 0 or a negative is `400 bad_request`. To get more storage, grow it later with `PATCH /v1/machines/{id}`: a running sandbox's storage grows live, and a shrink applies while it is stopped, at its next boot. The SDKs' `diskGiB` (TypeScript) and `persistent_disk_gib` (Python) are this field; `diskGiB` in a REST body is `400 unknown_field`." }
        rootDiskGiB: { type: integer, minimum: 1, description: "System files size in GiB. Like persistentDiskGiB: system files get the template's size (or the snapshot's); naming any other is `400 spec_not_allowed` (the message names the size's root disk), 0 or a negative `400 bad_request`; grow it later with `PATCH /v1/machines/{id}`." }
        desiredState:
          type: string
          enum: [ running, stopped ]
          description: "Default: running."
        metadata: { $ref: "#/components/schemas/Metadata" }
        archiveSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: >-
            Sets `archiveAt` to now plus this many seconds: the sandbox is stopped then if it is running. 0 or absent: none.
        deleteAfterSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          description: >-
            Sets `deleteAt` to now plus this many seconds (60-86400, else 400): the sandbox is then deleted, whatever its state, so it cannot outlive a client that died (`instabox run` sets it). 0 or absent: never. A server without this field ignores it.
        maxRunMinutes: { $ref: "#/components/schemas/MaxRunMinutes" }
        autoSuspendAfterSeconds: { $ref: "#/components/schemas/AutoSuspendAfterSeconds" }
        vault:
          type: boolean
          description: "False disables legacy Vault delivery. Org Secret selections are independent."
        secrets:
          $ref: "#/components/schemas/SecretSelection"
          description: "Proxy Secrets from this org. All includes current and future proxy Secrets; [] selects none. Omit both secrets and envSecrets to retain only existing Vault delivery. When envSecrets alone is supplied, proxy selection defaults to all; directSecrets alone selects no proxy Secrets. Null is rejected."
        envSecrets:
          type: array
          items: { $ref: "#/components/schemas/SecretName" }
          default: []
          description: "Explicit env Secret names from this org; omitted or [] selects none. No all mode; null is rejected. Real values enter the sandbox. Shorthand for directSecrets entries with env = the Secret's name; not sent together with directSecrets."
        directSecrets:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DirectSecret" }
          description: "Direct (delivery env) Secrets from this org, each as a variable and/or a home file. Real values enter the sandbox; prefer proxy Secrets for HTTPS API keys. A fork that sends none of secrets, envSecrets and directSecrets copies its source's selection."
        env:
          type: object
          maxProperties: 128
          description: >-
            Environment variables for the whole sandbox: every login shell exports them (exec, SSH, the terminal and what they start), from the first command on and again after each start and resume. Names match `^[A-Za-z_][A-Za-z0-9_]{0,127}$`; `BASH_ENV`, `ENV`, `HOME`, `HOSTNAME`, `IFS`, `LOGNAME`, `OLDPWD`, `PATH`, `PWD`, `SHELL`, `SHLVL`, `USER`, bash's readonly `BASHOPTS`, `BASH_VERSINFO`, `EUID`, `PPID`, `SHELLOPTS` and `UID`, the session's `TERM`, `XDG_RUNTIME_DIR` and `DBUS_SESSION_BUS_ADDRESS`, the trust roots `SSL_CERT_FILE`, `SSL_CERT_DIR`, `REQUESTS_CA_BUNDLE`, `CURL_CA_BUNDLE` and `NODE_EXTRA_CA_CERTS`, and names starting `INSTABOX_` or `SSH_` are reserved (set them per exec); values have no NUL bytes; names and values at most 32 KiB together. Not on macOS or Windows templates (400). Fixed at create: a fork takes its source's, a create from a snapshot only its own. An exec's `envs`, a Vault item and an env Secret of the same name win. Not Secrets: anything in the sandbox can read the values, and the sandbox shows only the names (`envNames`). The values are stored encrypted at rest; a site without the Secret master key refuses env (400 bad_request).
          additionalProperties: { type: string }
        pool:
          type: string
          description: >-
            Admins only: the host pool to place the sandbox in and no other (docs/hybrid-pools.md), "default" included. With snapshotId it must be the snapshot's pool. Absent: the user's pool assignment, else the server's placement.createPools.
        guestUser:
          type: string
          pattern: "^[a-z_][a-z0-9_-]{0,31}$"
          maxLength: 32
          examples: [ alice ]
          description: >-
            The sandbox's Linux user (`Machine.guestUser`), so `ssh <sandbox>` over your own network (Tailscale) logs in as the same name as on your computer. Lowercase letters, digits, `_` and `-`, starting with a letter or `_`, at most 32 characters; reserved names (`root`, `instabox`, the Debian base system's users and groups such as `sudo`, `systemd-*`) are refused with `400 invalid_guest_user`. Clients send the local username normalized (`DOMAIN\alice` and `alice@corp.example` become `alice`, lowercase, spaces become `_`) and nothing when that is not a valid name. Absent: `user`; with `snapshotId`, the snapshot's user. Ignored (the sandbox gets `dev`) for templates without the `guest-user` capability. Fixed at create.
        failFast:
          type: boolean
          default: false
          description: >-
            When no host has room for the sandbox right now, refuse the create at once with `503 no_capacity` (`retryable`; nothing is created, there is no operation and the `Idempotency-Key` is not kept) instead of answering 202 with an operation that then fails with `no_capacity`. Every other check and the rest of the create are unchanged; a host that had room can still fill up before the operation places the sandbox. The check does not ask for a host with the secret proxy, which a create with `secrets` or `envSecrets` needs: if only hosts without it have room, the create is accepted and its operation fails with `no_capacity`. A create from a snapshot that no host can start now is refused too, instead of being created stopped. A server without this field ignores it, or, if it already refuses unknown body keys, answers `400 unknown_field`.
        orgId:
          type: string
          description: >-
            The org the sandbox counts against and is shared with (`GET /v1/orgs`); you must be a member. Absent: your personal org, or with `snapshotId` the snapshot's org (a sandbox from a snapshot lives in the snapshot's org; another is `400 bad_request`). Secret selections always resolve within this org. The org's sandbox limit and, on the free tier, its monthly included usage apply (`429 quota_exceeded`, `402 credit_exhausted`).
    UpdateMachineRequest:
      type: object
      additionalProperties: false
      description: A body key that is none of these is refused with `400 unknown_field` (keys match case-insensitively). The retired lifetime timeout (`timeoutSeconds`, `onTimeout` or `timeout`, any value but null) is `400 unknown_field` naming `maxRunMinutes` and `autoSuspendAfterSeconds` instead (to an `instabox-cli/<version>` `User-Agent`, that the CLI is out of date and the commands `instabox max-run`, `auto-suspend` and `rm`), and nothing changes.
      properties:
        maxRunMinutes: { $ref: "#/components/schemas/MaxRunMinutes" }
        name: { type: string, description: "New name, unique among the org's live sandboxes; 1-63 of a-z, 0-9, '-', starting with a letter or digit. Absent: unchanged." }
        rootDiskGiB: { type: integer, minimum: 0, maximum: 1024, description: "Admins only: new root filesystem size in GiB (the template sizes it). From anyone else it is `400 spec_not_allowed`; grow the disk with `persistentDiskGiB`." }
        vcpus: { type: integer, minimum: 0, maximum: 32, description: "New vCPUs of a stopped paid sandbox: with `memMiB`, one of the workspace's `allowedSpecs` (alone: the one size with that many vCPUs); 0 or absent: unchanged. Applied at its next start (see the operation). Running is `409 operation_conflict` (stop it first), and so is paused (resume it, then stop it); another size, or the free sandbox, is `400 spec_not_allowed`." }
        memMiB: { type: integer, minimum: 0, maximum: 131072, description: "New memory (MiB) of a stopped paid sandbox, as `vcpus`; 0 or absent: unchanged." }
        persistentDiskGiB: { type: integer, minimum: 0, maximum: 1024, description: "New disk (`/data`) size in GiB, 1-1024, up to the plan's `maxDiskGiB`; 0 or absent: unchanged. Grow: a running box grows online (no restart, processes keep running); if it can't (rare: the box is unreachable or its host is older), `409 grow_needs_stop` (stop it and send the size again); a stopped box grows at its next start. Shrink: only while stopped (else `409 operation_conflict`), and only when the used data plus 10% (at least 1 GiB) fits; else `409 disk_too_small`, with the smallest size that fits in the message, and the box unchanged. Past 1024 is `400 bad_request`, and so is growing on a template without the `root-grow` capability (a shrink needs none); a free box's disk is fixed (`400 spec_not_allowed`, running or stopped). The Python SDK's `machines.resize(m, disk_gib)` sends this field." }
        metadata:
          type: [ object, "null" ]
          additionalProperties: { type: string }
          description: "Replaces the metadata (same limits as `Metadata`); {} clears it; null or absent: unchanged."
        autoSuspendAfterSeconds:
          type: integer
          description: "The plan's rule (`AutoSuspendAfterSeconds`): a paid sandbox takes 300-1800 in whole minutes, as sent, or 0 (off) where the plan allows always on; below 300, above 1800 or not a multiple of 60 is `400 bad_request`; the free sandbox takes only 1800 (else `403 spec_not_allowed`), and 0 without always on is `403 spec_not_allowed` too. A refused value leaves the setting unchanged; the reply shows the effective value. API keys follow the owner's policy. Separately, with manual lifecycle (`GET /v1/me`) or an admin sign-in session: 120-86400, or 0 (off). Absent: unchanged."
        vault:
          type: boolean
          description: "False disables legacy Vault delivery; true cannot re-enable the legacy flag; absent is unchanged. Org Secret selections are independent."
        apply:
          type: string
          enum: [ restart ]
          description: "`restart`: a running or paused sandbox whose change needs a stop is stopped, resized and started again by one `resize` operation (`202`); see the operation. Absent: such a change is `409`. Anything else is `400 bad_request`."
    SnapshotRef:
      type: object
      required: [ id ]
      properties:
        id: { type: string }
    ForkMachineRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, description: "The new sandbox's name (as in CreateMachineRequest). Absent: `<source>-fork-` and 4 random hex digits." }
        vcpus: { type: integer, description: "With `memMiB`, one of the org's sizes. Absent: the source's size." }
        memMiB: { type: integer }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: "Labels added to the source's (a key here replaces the source's), at most 31 keys here and 32 in all (`instabox-fork-of` is set to the source's ID). Absent: the source's labels."
        deleteAfterSeconds: { type: integer, description: "As in CreateMachineRequest (60-86400). Absent or 0: the source's delete deadline, the same instant (none if the source has none); a source due within 60 seconds is then refused with 400." }
        autoSuspendAfterSeconds: { type: integer, description: "As in CreateMachineRequest. Absent: the source's (0, off, when it has none), checked against the plan as a create's." }
        maxRunMinutes: { type: integer, description: "As in CreateMachineRequest. Absent: the source's (the plan default when it has none), checked as a create's." }
        secrets:
          $ref: "#/components/schemas/SecretSelection"
          description: "The fork's own proxy selection, as in CreateMachineRequest. Absent together with envSecrets and directSecrets: the source's selection is copied."
        envSecrets:
          type: array
          items: { $ref: "#/components/schemas/SecretName" }
          description: As in CreateMachineRequest.
        directSecrets:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DirectSecret" }
          description: As in CreateMachineRequest; alone, it selects no proxy Secrets.
    CreateSnapshotRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, description: "Unique among the caller's snapshots; 1-63 of a-z, 0-9, '-', starting with a letter or digit." }
        description: { type: string }
        rootOnly: { type: boolean, default: false, description: "Save the system files only, not the storage (`/data`)." }
        forFork: { type: boolean, default: false, description: "Saved to fork its source (`instabox fork`, when the native fork cannot run). For a free source, the server records its max-run window as activity extended it, and a sandbox the same user creates from this snapshot in the next 30 minutes starts with that window, as a native fork does. Names no window." }
    Snapshot:
      type: object
      description: >-
        A saved copy of a sandbox (software and files). New sandboxes can be created from it. It belongs to its source sandbox's org: every member of the org sees, uses and deletes it.
      required: [ id, name, orgId, sourceMachineId, sourceSnapshotSeq, template, rootSizeBytes, createdAt, status ]
      properties:
        id: { type: string, description: "`sn_...` (`im_...` for older snapshots)." }
        name: { type: string, description: Unique among the org's live snapshots. }
        orgId: { type: string, description: The org the snapshot belongs to (its source sandbox's). }
        description: { type: string }
        sourceMachineId: { type: string }
        sourceSnapshotSeq: { type: integer, format: int64, description: "The source sandbox's saved state (`storage.snapshotSeq`) this snapshot was taken from; 0 for a live snapshot of a sandbox that was never stopped." }
        status:
          type: string
          enum: [ pending, ready, failed ]
          description: >-
            `ready` can be used. A snapshot of a running sandbox is `pending` while it uploads (its sizes are the sandbox's until then), then `ready` or `failed`.
        error: { type: string, description: Why a `failed` snapshot failed. }
        template: { $ref: "#/components/schemas/TemplateRef" }
        rootSizeBytes: { type: integer, format: int64, description: "The logical size of the system disk a sandbox created from it gets (its provisioned capacity), not the bytes stored: a snapshot is saved sparse and compressed." }
        dataSizeBytes: { type: integer, format: int64, description: "The logical size of the storage disk (`/data`) a sandbox created from it gets, not the bytes stored (the saved data is sparse and compressed); absent for system-files-only snapshots. Sandboxes created from it get at least this much storage." }
        exclusiveBytes:
          type: integer
          format: int64
          deprecated: true
          description: No longer computed; servers leave it out. (Was the stored bytes only this snapshot references.)
        createdAt: { type: string, format: date-time }
        defaultSpec:
          allOf: [ { $ref: "#/components/schemas/MachineSpec" } ]
          description: >-
            The size a sandbox created from this snapshot gets when the create names none: the caller's plan default for vCPUs and memory (`limits.machineSpec`, 4 vCPU / 8 GiB on api.instabox.sh), not the source sandbox's size, so a snapshot of a 2/4 box creates a 4/8 one unless the create passes `vcpus` and `memMiB`; plus the storage (`/data`) and system disk sizes the snapshot was saved with, which a created sandbox gets at least. Absent when its template is unknown.
        guestUser:
          type: string
          description: >-
            The source sandbox's Linux user (`Machine.guestUser`), which a sandbox created from this snapshot keeps unless the create names another. `dev` for snapshots of sandboxes from older templates.
        visibility:
          type: string
          enum: [ private, community, official ]
          description: >-
            Who can create from the snapshot (docs/community-templates.md): `private` (the default, its org's members), `community` (every signed-in account) or `official` (listed next to the built-in templates). Absent on older servers: treat as private. Handlers do not set community or official yet.
        publishedAt:
          type: string
          format: date-time
          description: When the visibility became community or official.
        publisherLogin:
          type: string
          description: Who shared or published it.
    DeprecatedImage:
      deprecated: true
      description: A snapshot as the deprecated /v1/images routes return it.
      allOf:
        - $ref: "#/components/schemas/Snapshot"
        - type: object
          required: [ official, owned, preinstalled ]
          properties:
            official: { type: boolean, const: false }
            owned: { type: boolean, const: true }
            preinstalled: { type: array, maxItems: 0, items: { type: object } }
    DeprecatedImageList:
      deprecated: true
      type: object
      required: [ images ]
      properties:
        images:
          type: array
          items: { $ref: "#/components/schemas/DeprecatedImage" }
    Files:
      type: object
      required: [ path, type, size, mode, modTime ]
      properties:
        path: { type: string, description: "The path read, with symbolic links resolved." }
        type: { type: string, enum: [ dir, file, other ] }
        size: { type: integer, format: int64, description: Bytes; 0 for a directory. }
        mode: { type: string, description: "As ls -l, for example drwxr-xr-x." }
        modTime: { type: string, format: date-time }
        entries:
          type: array
          description: A directory's entries, directories first, then by name.
          items: { $ref: "#/components/schemas/FileEntry" }
        content: { type: string, description: A text file's content (UTF-8). }
        binary: { type: boolean, description: The file is not UTF-8 text; content is empty. }
        truncated: { type: boolean, description: "The directory has more entries, or the file more bytes, than returned." }
    FileWritten:
      type: object
      required: [ path, size, sha256, mode, created ]
      properties:
        path: { type: string, description: "The file written, with symbolic links resolved." }
        size: { type: integer, format: int64, description: Bytes written. }
        sha256: { type: string, description: Hex SHA-256 of the bytes the server received and wrote. }
        mode: { type: string, description: "Octal permissions, for example 0644." }
        created: { type: boolean, description: The file is new (201); false when it replaced one (200). }
    CreateUploadURLRequest:
      type: object
      required: [ path ]
      properties:
        path: { type: string, description: Absolute path of the file to write. }
        mode: { type: string, description: "Octal permissions, for example 0755 (default an existing file's, else 0644)." }
        parents: { type: boolean, description: Create missing parent directories. }
        expiresInSeconds: { type: integer, minimum: 1, maximum: 3600, description: "Lifetime; default 900." }
    UploadURL:
      type: object
      required: [ url, method, path, expiresAt, maxBytes ]
      properties:
        url: { type: string, description: PUT the file's raw bytes here; it carries its own credential. }
        method: { type: string, enum: [ PUT ] }
        path: { type: string }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, format: int64, description: The largest body the URL takes (5 GiB). }
    FileEntry:
      type: object
      required: [ name, type, size, mode, modTime ]
      properties:
        name: { type: string }
        type: { type: string, enum: [ dir, file, symlink, other ] }
        size: { type: integer, format: int64, description: Bytes; 0 for a directory. }
        mode: { type: string }
        modTime: { type: string, format: date-time }
        target: { type: string, description: "A symbolic link's target, as stored." }
    SnapshotList:
      type: object
      required: [ snapshots ]
      properties:
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
    Usage:
      type: object
      required: [ computedAt, logicalBytes, storedBytes, exclusiveBytes, machines, snapshots, images, limits ]
      properties:
        computedAt:
          type: [ string, "null" ]
          format: date-time
          description: "When the byte figures were last computed or confirmed. A usage run every 10 minutes confirms unchanged orgs and recomputes changed ones (each at most every 30 minutes), so usually under an hour old. An org that stores nothing reads 0 as of now; null only while stored data waits for its first run."
        logicalBytes: { type: integer, format: int64, description: Full size of your sandboxes and snapshots. }
        storedBytes: { type: integer, format: int64, description: "What they take up once compressed, with shared data counted once and the templates' own content (an unchanged root filesystem) not counted: what you wrote on the root filesystem counts. Paused sandboxes' saved memory does not count." }
        allocatedDiskGiB: { type: integer, description: "The `/data` of all your live sandboxes, in GiB: what `limits.maxStoredGiB` is checked against. Absent from older servers." }
        exclusiveBytes: { type: integer, format: int64, deprecated: true, description: "No longer computed: always 0. (Was the part of storedBytes no other org shares.)" }
        machines: { type: integer, description: "Your sandboxes, in any state." }
        snapshots: { type: integer, description: Your snapshots. }
        images: { type: integer, deprecated: true, description: "Deprecated: `snapshots` (same value)." }
        limits: { $ref: "#/components/schemas/UsageLimits" }
        storage:
          allOf: [ { $ref: "#/components/schemas/UsageStorage" } ]
          description: "storedBytes by sandbox. Absent before your first measurement, and from older servers."
        cost:
          allOf: [ { $ref: "#/components/schemas/OrgUsage" } ]
          description: "This calendar month's (UTC) cost in USD as the hourly rating priced it (`costUSD`, with `runtimeUSD`, `storageUSD` and `egressUSD`), up to `ratedUntil`; the allowance (`allowanceUSD`, `creditRemainingUSD`, `overageUSD`) and the credit balance (`creditsUSD`, `creditsExpireAt`). The same figures as `usage` on `GET /v1/orgs/{id}`. A free sandbox is never billed, so a free month is `0`. Absent from older servers."
        org:
          allOf: [ { $ref: "#/components/schemas/OrgRef" } ]
          description: "The org these figures and limits describe: your personal org by default, a workspace key's workspace, or the one named with `org`. Absent from older servers."
    OrgRef:
      type: object
      required: [ id, name, tier, kind ]
      properties:
        id: { type: string, description: Org ID (org_...). }
        name: { type: string }
        tier: { type: string, enum: [ free, pro, builder, team, enterprise ], description: "The org's plan." }
        kind: { type: string, enum: [ personal, workspace ] }
        alwaysOnAllowed:
          type: boolean
          description: "Set on `GET /v1/me` (`org`, `workspaces`): this org's plan lets its sandboxes take `autoSuspendAfterSeconds` 0 (off). Absent on a plan that does not, elsewhere, and from older servers."
    MachineLogs:
      type: object
      required: [ machineId, state, console, cursor, operations ]
      properties:
        machineId: { type: string }
        state: { type: string, description: "The sandbox's state, as on Machine." }
        console: { type: string, description: "Console output: the last `tail` lines, or with `after`, the output written since that cursor. Empty when there is none or with `consoleUnavailable`." }
        cursor: { type: integer, format: int64, description: "Where `console` ends; pass it as `after` to read only newer output." }
        consoleReset: { type: boolean, description: "`after` was past the end of the log because it was rotated and the kept previous 8 MiB no longer reach back to the cursor, so `console` starts again at the beginning of the current log and output in between is missing. A rotation the kept copy covers carries on without it. Absent when false." }
        consoleTruncated: { type: boolean, description: "There is older console output than `console`: the log goes back further than `tail` lines, or than the bytes read for them (256 per line, at least 64 KiB, at most 1 MiB), so long lines give fewer than `tail`. Absent when false and with `after`." }
        consoleUnavailable: { type: string, description: "Why there is no console output, e.g. the sandbox's disks are in storage or its host is not answering. Absent when the console was read." }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" }, description: "The last 20 operations, oldest first." }
    MachineMetrics:
      type: object
      required: [ metrics ]
      properties:
        metrics: { type: array, items: { $ref: "#/components/schemas/MachineMetric" }, description: Oldest first. }
        disk: { $ref: "#/components/schemas/MachineDisk", description: "The running sandbox's filesystem use, read inside it (the last read, refreshed in the background at most once a minute and at most 10 minutes old; the route never reads it itself, so the first call after a while may not have it); absent while it is not running or not read yet." }
    MachineDisk:
      type: object
      required: [ measuredAt, filesystems ]
      properties:
        measuredAt: { type: string, format: date-time }
        filesystems: { type: array, items: { $ref: "#/components/schemas/MachineFilesystem" }, description: "`/data`, then `/` (`/` alone where `/data` is not a filesystem of its own)." }
        warning: { $ref: "#/components/schemas/DiskWarning", description: "Set when a filesystem is at least 90% full (bytes or inodes)." }
    MachineFilesystem:
      type: object
      required: [ mount, sizeBytes, usedBytes, availableBytes, usedPct, inodesUsedPct, level ]
      properties:
        mount: { type: string, description: "`/data` (the disk) or `/` (the root filesystem)." }
        sizeBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        availableBytes: { type: integer, format: int64, description: "What the sandbox's user can still write." }
        usedPct: { type: number, description: "Used over used + available, 0-100 (df's Use%): writes fail with ENOSPC at 100." }
        inodesUsedPct: { type: number, description: "Inodes used, 0-100 (many small files)." }
        level: { type: string, enum: [ ok, high, critical, full ], description: "`ok` below 80%, `high` from 80%, `critical` from 90%, `full` at 100% (bytes or inodes)." }
    DiskWarning:
      type: object
      required: [ mount, usedPct, level, message ]
      properties:
        mount: { type: string, description: "The fullest filesystem (empty when it could not be read after a command ran out of space)." }
        usedPct: { type: number }
        level: { type: string, enum: [ ok, high, critical, full ] }
        noSpace: { type: boolean, description: "The command failed with No space left on device (or Disk quota exceeded)." }
        message: { type: string, description: "What is full and how to free or add space (delete files, `instabox resize <box> --disk N` for /data: a running sandbox's disk grows live)." }
    MachineMetric:
      type: object
      required: [ timestamp, cpuUsedPct, cpuCount, memUsed, memTotal, diskTotal ]
      description: "One sample, measured on the host. Bytes throughout."
      properties:
        timestamp: { type: string, format: date-time }
        cpuUsedPct: { type: number, description: "CPU time used over the sandbox's vCPUs, 0-100." }
        cpuCount: { type: integer, description: vCPUs. }
        memUsed: { type: integer, format: int64, description: "Guest memory touched (it drops only when memory is reclaimed)." }
        memTotal: { type: integer, format: int64, description: Memory size. }
        diskUsed: { type: integer, format: int64, description: "`/data`'s used bytes, on the latest sample of a running sandbox only (read inside it: the last read, refreshed in the background at most once a minute and at most 10 minutes old); absent otherwise. `disk` on the response has both filesystems." }
        diskTotal: { type: integer, format: int64, description: "Disk (`/data`) size; the root filesystem is not counted." }
        netInBytesPerSec: { type: number, description: "Network traffic to the sandbox, bytes per second over 90 s. Leaves out SSH and public port traffic. Absent where the host does not report it yet." }
        netOutBytesPerSec: { type: number, description: "Network traffic from the sandbox (egress), bytes per second over 90 s. Leaves out SSH and public port traffic. Absent where the host does not report it yet." }
        diskReadBytesPerSec: { type: number, description: "Storage reads, bytes per second over 90 s. Absent where the host does not report them yet." }
        diskWriteBytesPerSec: { type: number, description: "Storage writes, bytes per second over 90 s. Absent where the host does not report them yet." }
    MachineUsage:
      type: object
      required: [ from, to, runningSeconds, vcpuSeconds, memGiBSeconds, diskGiBSeconds, egressBytes ]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        runningSeconds: { type: integer, format: int64, description: Seconds the sandbox was running in the window. }
        vcpuSeconds: { type: integer, format: int64, description: vCPUs times running seconds. }
        memGiBSeconds: { type: number, description: Memory GiB times running seconds. }
        diskGiBSeconds: { type: integer, format: int64, description: "Disk (`/data`) size, current size, times the seconds the sandbox existed in the window." }
        egressBytes: { type: integer, format: int64, description: "Bytes the sandbox sent to the public internet, by whole hour: every hour from the one `from` falls in up to `to`. Billed or not (the plan's free egress and free sandboxes included)." }
    OrgMachineUsageList:
      type: object
      required: [ from, to, total, machines ]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total: { type: integer, description: "Sandboxes in the list, all pages." }
        machines: { type: array, items: { $ref: "#/components/schemas/OrgMachineUsage" } }
    OrgMachineUsage:
      type: object
      required: [ id, name, free, runningSeconds, vcpuSeconds, memGiBSeconds, computeUSD ]
      properties:
        id: { type: string }
        name: { type: string }
        free: { type: boolean, description: A free sandbox; its compute is not billed. }
        deletedAt: { type: string, format: date-time, description: When the sandbox was deleted; absent for a live one. }
        runningSeconds: { type: integer, format: int64, description: Seconds the sandbox was running in the window. }
        vcpuSeconds: { type: integer, format: int64, description: vCPUs times running seconds. }
        memGiBSeconds: { type: number, description: Memory GiB times running seconds. }
        computeUSD: { type: number, description: "vCPU and memory at list prices, before the plan's allowance; 0 for a free sandbox." }
    UsageStorage:
      type: object
      required: [ machines, deletedMachineSnapshots, deletedMachineSnapshotBytes ]
      description: "storedBytes by sandbox, from the same measurement. Data that several of your sandboxes and snapshots share is split evenly between them, so the figures sum to storedBytes."
      properties:
        machines: { type: array, items: { $ref: "#/components/schemas/UsageMachineStorage" }, description: Your sandboxes. }
        deletedMachineSnapshots: { type: integer, description: Snapshots whose sandbox is deleted. }
        deletedMachineSnapshotBytes: { type: integer, format: int64, description: Their share of storedBytes. }
    UsageMachineStorage:
      type: object
      required: [ id, name, state, sizeBytes, diskBytes, snapshots, snapshotBytes ]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
        sizeBytes: { type: integer, format: int64, description: Size of its storage (`/data`). }
        diskBytes: { type: integer, format: int64, description: "Its saved disks' share of storedBytes: `/data` and what was written on the root filesystem (0 until its disks are first saved, on stop, pause or snapshot)." }
        snapshots: { type: integer, description: Its snapshots. }
        snapshotBytes: { type: integer, format: int64, description: Their share. }
    UsageLimits:
      type: object
      required: [ maxMachines, maxSnapshots, maxStoredGiB, maxImages ]
      description: Your limits. An admin may change maxMachines per user.
      properties:
        maxMachines: { type: integer, description: "Sandboxes in any state, checked on create (default 1). 0 with maxMachines in `unlimited`: no limit (a paid plan without one); 0 otherwise: none allowed. There are no vCPU or memory quotas." }
        machineSpec:
          allOf: [ { $ref: "#/components/schemas/MachineSpec" } ]
          description: "The default size, what a create naming no size gets (4 vCPUs, 8 GiB memory by default; no rootDiskGiB: the template's). Absent from servers before fixed sizes."
        machineSpecs:
          type: array
          items: { $ref: "#/components/schemas/MachineSpec" }
          description: "Every size your new sandboxes may have in your personal org, as `GET /v1/me` `allowedSpecs`: machineSpec first, then its plan's others (Pro: 2/4, 4/8, 8/16; Builder: 2/4 up to 16/32; Team and Enterprise: 2/4 up to 32/64) and any size an admin granted it. Pick one by naming its vcpus and memMiB on create."
        maxSnapshots: { type: integer, description: "Saved snapshots. 0: no limit (listed in `unlimited`)." }
        maxStoredGiB: { type: integer, description: "Stored data limit (default 200), checked against allocatedDiskGiB when you create a sandbox or snapshot. 0: no limit (listed in `unlimited`)." }
        maxImages: { type: integer, deprecated: true, description: "Deprecated: `maxSnapshots` (same value)." }
        liveSnapshots: { type: boolean, description: "Snapshots of running sandboxes are allowed (some may still be refused until the server is fully updated). Absent: they are not." }
        vault:
          allOf: [ { $ref: "#/components/schemas/VaultLimits" } ]
          description: "Vault limits per user; also used for org Secret quotas when orgSecrets is true."
        orgSecrets: { type: boolean, description: "Org Secret APIs are available alongside the per-user Vault. Absent or false: use Vault." }
        unlimited:
          type: [ array, "null" ]
          items: { type: string, enum: [ maxMachines, maxSnapshots, maxImages, maxStoredGiB ] }
          description: "The count limits above that do not apply. Each is still sent as 0 for older clients, but means no limit, not none allowed; a 0 not listed is a real 0 (a free org's maxMachines 0: no free sandboxes). Always an array from current servers (empty when every limit applies); absent or null from older ones, whose 0 is ambiguous. A 0 in a limit means unlimited when the limit's name is in this list."
    SecretName:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
      description: >-
        A unique environment variable name within an org. The names a sandbox's env reserves are reserved (shell variables such as PATH, HOME, BASH_ENV, ENV and IFS, session and trust-store variables, and INSTABOX_ and SSH_ prefixes). A Secret saved under a name before it was reserved is not delivered: the machine's guest status names it.
    SecretDelivery:
      type: string
      enum: [ proxy, env ]
      description: >-
        Proxy supplies an opaque sandbox-specific placeholder for substitution in ordinary HTTPS headers on allowed hosts (port 443). Env supplies the real value, including credentials needed by native database clients. Unsupported traffic never falls back from proxy to env.
    SecretHosts:
      type: array
      maxItems: 32
      items: { type: string, maxLength: 253 }
      description: >-
        Exact ASCII DNS hostnames, normalized to lowercase without a trailing dot, or a standalone `*` for every public HTTPS destination. Omitted or empty for proxy delivery means `["*"]`. No scheme, port, path, partial wildcard, IP literal, or local hostname. Destination checks also reject private and restricted resolved addresses. This scopes credential use, not all sandbox network access.
    SecretValue:
      type: string
      writeOnly: true
      description: >-
        UTF-8 text without NUL, at most 65536 bytes. Empty values are valid. Proxy values must also be valid HTTP header values without CR or LF.
    Secret:
      type: object
      required: [ id, orgId, name, delivery, hosts, version, size, createdAt, updatedAt ]
      description: Org Secret metadata. Values, ciphertext and placeholders are never returned.
      properties:
        id: { type: string, description: "Stable identity retained by replacements; deletion and recreation makes a new ID." }
        orgId: { type: string }
        name: { $ref: "#/components/schemas/SecretName" }
        delivery: { $ref: "#/components/schemas/SecretDelivery" }
        hosts: { $ref: "#/components/schemas/SecretHosts" }
        version: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 0, description: Raw value size in bytes. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SecretList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    PutSecretRequest:
      type: object
      required: [ value, delivery ]
      properties:
        value: { $ref: "#/components/schemas/SecretValue" }
        delivery: { $ref: "#/components/schemas/SecretDelivery" }
        hosts: { $ref: "#/components/schemas/SecretHosts" }
      allOf:
        - if: { properties: { delivery: { const: env } } }
          then:
            properties: { hosts: { maxItems: 0 } }
    WebhookEventType:
      type: string
      enum: [ sandbox.created, sandbox.started, sandbox.stopped, sandbox.suspended, sandbox.error, sandbox.deleted, snapshot.created, snapshot.failed, snapshot.deleted ]
    Export:
      type: object
      required: [ id, orgId, name, fileName, status, bytes, createdAt ]
      description: >-
        A `.tar.gz` of a sandbox's or a snapshot's `/data` disk (home and workspace), built from the disk's saved copy while its workspace is paused or disabled. Exactly one of `machineId` and `snapshotId` is set.
      properties:
        id: { type: string, description: "`exp_...`" }
        orgId: { type: string }
        machineId: { type: string }
        snapshotId: { type: string }
        name: { type: string, description: The sandbox's or snapshot's name when the export was asked for. }
        fileName: { type: string, description: "The archive's download name: `<name>-data-<date>.tar.gz`." }
        status:
          type: string
          enum: [ queued, building, ready, failed, expired ]
          description: "`ready`: download it. `failed`: `error` says why; ask again. `expired`: deleted; ask again while the workspace is paused or disabled."
        error: { type: string }
        bytes: { type: integer, format: int64, description: "The archive's size, once ready." }
        sha256: { type: string, description: "The archive's SHA-256 (hex), once ready; also its download ETag." }
        savedAt: { type: string, format: date-time, description: "When the disk was saved: the sandbox's last stop or pause, or the snapshot." }
        requestedBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: When a ready archive is deleted, 7 days after it was built and never after the workspace's data.
    CreateExportRequest:
      type: object
      description: One of `machineId` and `snapshotId`.
      properties:
        machineId: { type: string }
        snapshotId: { type: string }
    ExportSource:
      type: object
      required: [ kind, id, name, dataSizeBytes ]
      properties:
        kind: { type: string, enum: [ machine, snapshot ] }
        id: { type: string }
        name: { type: string }
        dataSizeBytes: { type: integer, format: int64, description: The size of its `/data` disk. }
        export: { $ref: "#/components/schemas/Export" }
    ExportList:
      type: object
      required: [ exportable, sources ]
      properties:
        exportable: { type: boolean, description: "True while the workspace is paused for a failed payment or disabled: exports can be asked for." }
        purgeAt: { type: string, format: date-time, description: When the workspace's sandboxes and snapshots are deleted. }
        sources:
          type: array
          description: The sandboxes and snapshots the caller may export, each with its newest export that has not expired.
          items: { $ref: "#/components/schemas/ExportSource" }
    Webhook:
      type: object
      required: [ id, orgId, url, description, events, enabled, createdAt, updatedAt ]
      description: An org's webhook endpoint.
      properties:
        id: { type: string }
        orgId: { type: string }
        url: { type: string, format: uri }
        description: { type: string, maxLength: 200 }
        events:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean }
        disabledReason: { type: string, enum: [ failing ], description: "Why the server disabled it: every attempt failed for 5 days. Absent when an admin did, or it is enabled." }
        failingSince: { type: string, format: date-time, description: The first failed attempt since the last success. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        secret: { type: string, description: "The signing secret (`whsec_` + base64 key), only in the responses of create and rotate." }
    WebhookList:
      type: object
      required: [ items, eventTypes, maxEndpoints ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Webhook" }
        eventTypes:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        maxEndpoints: { type: integer, description: How many endpoints the org may have (default 10). }
    CreateWebhookRequest:
      type: object
      required: [ url, events ]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean, default: true }
    UpdateWebhookRequest:
      type: object
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WebhookEventType" }
        enabled: { type: boolean }
    WebhookEvent:
      type: object
      required: [ id, type, createdAt, orgId, data ]
      description: |
        The body of every webhook request. Requests are signed per Standard
        Webhooks: `webhook-id` (the event ID: deduplicate on it),
        `webhook-timestamp` (Unix seconds) and `webhook-signature`
        (`v1,<base64 HMAC-SHA256 of "<id>.<timestamp>.<body>">`, space
        separated when two secrets sign).
      properties:
        id: { type: string }
        type: { type: string, description: "A WebhookEventType, or webhook.test." }
        createdAt: { type: string, format: date-time }
        orgId: { type: string }
        data:
          type: object
          description: |
            sandbox.*: `sandbox` {id, name, metadata}, `previousState`, `state`,
            `reason` (user, idle, archive, wake, admin, system, ...),
            `operationId`, and on sandbox.error `error`. snapshot.*: `snapshot`
            {id, name, description, sourceSandboxId, status}, and on
            snapshot.failed `error`.
    WebhookAttempt:
      type: object
      required: [ attempt, at, durationMs ]
      properties:
        attempt: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        status: { type: integer, description: The response status; absent when there was no response. }
        durationMs: { type: integer }
        error: { type: string }
        response: { type: string, description: The first KiB of the response body. }
    WebhookDelivery:
      type: object
      required: [ id, eventId, eventType, state, attempts, createdAt, retryable, payload, attemptLog ]
      properties:
        id: { type: string }
        eventId: { type: string }
        eventType: { type: string }
        state: { type: string, enum: [ pending, succeeded, failed ] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time, description: Pending only. }
        lastAttemptAt: { type: string, format: date-time }
        lastStatus: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        retryable:
          type: boolean
          description: >-
            Whether POST .../retry would queue this delivery now: false while it is pending, and once its event is too old to retry (409 operation_conflict otherwise).
        payload: { $ref: "#/components/schemas/WebhookEvent" }
        attemptLog:
          type: array
          items: { $ref: "#/components/schemas/WebhookAttempt" }
    WebhookDeliveryList:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        nextCursor: { type: [ string, "null" ] }
    ImportSecretsRequest:
      type: object
      required: [ values, delivery ]
      properties:
        values:
          type: object
          minProperties: 1
          propertyNames: { $ref: "#/components/schemas/SecretName" }
          additionalProperties: { $ref: "#/components/schemas/SecretValue" }
          description: Names and values to replace atomically; omitted names stay unchanged. Null values are rejected.
        delivery: { $ref: "#/components/schemas/SecretDelivery" }
        hosts: { $ref: "#/components/schemas/SecretHosts" }
      allOf:
        - if: { properties: { delivery: { const: env } } }
          then:
            properties: { hosts: { maxItems: 0 } }
    SecretSelection:
      description: >-
        Proxy selection only. All includes current and future proxy Secrets in the sandbox's org. Explicit names resolve to stable IDs. An empty array selects none. Deleting and recreating a name does not restore an explicit grant. Null is rejected.
      oneOf:
        - { type: string, const: all }
        - type: array
          items: { $ref: "#/components/schemas/SecretName" }
    UpdateMachineSecretsRequest:
      type: object
      properties:
        secrets: { $ref: "#/components/schemas/SecretSelection" }
        envSecrets:
          type: array
          items: { $ref: "#/components/schemas/SecretName" }
          description: Explicit env names; [] clears. Omission keeps the prior list. Null and all are rejected.
        directSecrets:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DirectSecret" }
          description: Replaces the direct references in full; [] clears. Not sent together with envSecrets. Null is rejected.
    DirectSecret:
      type: object
      required: [ secret ]
      description: >-
        A reference to a direct (delivery env) Secret: its real value as the variable `env` (exported by login shells), as a file at `file` (home-relative; the value stays on tmpfs at /run/instabox/secrets/files and the home path is a symlink to it), or both. Names and paths only; values are never returned.
      properties:
        secret: { $ref: "#/components/schemas/SecretName" }
        env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$", description: "Not reserved (PATH, HOME, BASH_ENV, IFS, CA variables, ...) and no INSTABOX_ or SSH_ prefix." }
        file: { type: string, maxLength: 255, description: "Clean path relative to the home directory, without .. components." }
    MachineSecrets:
      type: object
      required: [ secrets, envSecrets, directSecrets, items, version ]
      properties:
        secrets: { $ref: "#/components/schemas/SecretSelection" }
        envSecrets:
          type: array
          items: { $ref: "#/components/schemas/SecretName" }
          description: Direct references that are exactly the same-name shorthand ({secret X, env X}, no file). Renamed and file references appear only in directSecrets.
        directSecrets:
          type: array
          items: { $ref: "#/components/schemas/DirectSecret" }
          description: Direct references (names and paths, never values), envSecrets included.
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
          description: Effective selected Secrets, including proxy all. Metadata only.
        version: { type: integer, description: Version of this sandbox's selection configuration. }
        proxy: { $ref: "#/components/schemas/SecretProxyStatus" }
        guest: { $ref: "#/components/schemas/SecretGuestStatus" }
        usage:
          type: array
          items: { $ref: "#/components/schemas/SecretUsage" }
          description: >-
            Present when the server records proxied request counts: one entry per selected proxy Secret.
    SecretUsage:
      type: object
      required: [ name, requests, denied ]
      description: >-
        This sandbox's HTTPS requests carrying the Secret's placeholder. requests had the real value injected; denied went to a host outside the Secret's hosts and were refused. Lags by up to a policy renewal and covers only hosts the proxy intercepts.
      properties:
        name: { $ref: "#/components/schemas/SecretName" }
        requests: { type: integer }
        denied: { type: integer }
        lastUsedAt: { type: string, format: date-time, description: Last request with the value injected; denied requests do not move it. }
    SecretProxyStatus:
      type: object
      required: [ state, revision, appliedRevision ]
      description: >-
        Last node acknowledgement, not continuous health. Policies expire within 60 seconds unless renewed. Revocation is pending until applied or the previous lease expires. Already admitted streams may finish.
      properties:
        state: { type: string, enum: [ inactive, pending, applied, expired ] }
        revision: { type: integer, description: Desired org policy revision. }
        appliedRevision: { type: integer, description: Last revision acknowledged by the node. }
        expiresAt: { type: string, format: date-time }
    SecretGuestStatus:
      type: object
      required: [ state, revision, appliedRevision, items ]
      description: >-
        Managed environment and public CA installation. This does not prove existing processes reloaded values. Removing env access cannot remove values already copied into process memory, files, or snapshots.
      properties:
        state: { type: string, enum: [ inactive, pending, applied, error ] }
        revision: { type: integer, description: Desired policy revision. }
        appliedRevision: { type: integer, description: Revision of the last installation attempt; check state for success. }
        appliedAt: { type: string, format: date-time }
        error: { type: string, description: "Fixed delivery error, never arbitrary guest output or credential values." }
        items:
          type: array
          items: { $ref: "#/components/schemas/SecretGuestItem" }
          description: Metadata from the last successful installation.
    SecretGuestItem:
      type: object
      required: [ id, name, delivery, version ]
      properties:
        id: { type: string }
        name: { $ref: "#/components/schemas/SecretName" }
        delivery: { $ref: "#/components/schemas/SecretDelivery" }
        version: { type: integer }
        env: { type: string, description: "A direct Secret's variable name." }
        file: { type: string, description: "A direct Secret's home-relative file path." }
    LegacyVaultExport:
      type: object
      required: [ item, value ]
      description: Explicit original-owner recovery of a retained legacy item. Save privately; contains a real value.
      properties:
        item: { $ref: "#/components/schemas/VaultItem" }
        value: { type: string }
    VaultLimits:
      type: object
      required: [ maxItems, maxBytes ]
      properties:
        maxItems: { type: integer, description: "Secrets per org (server default 100)." }
        maxBytes: { type: integer, description: "Raw bytes of all Secret values per org (server default 262144)." }
    VaultItem:
      type: object
      required: [ id, name, kind, selector, size, machines, createdAt, updatedAt ]
      description: Per-user Vault metadata (docs/vault.md). Values are absent from lists.
      properties:
        id: { type: string, description: "`vi_…`" }
        name: { type: string, description: "Unique per user. An env item's name is the variable's name." }
        kind:
          type: string
          enum: [ env, file ]
          description: "The item's sandbox delivery kind."
        path: { type: string, description: "File items: the target, relative to the home directory." }
        selector:
          type: object
          additionalProperties: { type: string }
          description: "Historical labels; these do not control org Secret selection."
        size: { type: integer, description: "The value's size in bytes." }
        machines: { type: integer, description: "The caller's live machines the item applies to (selector matches, Vault not off)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        migrationState: { type: string, enum: [ migrated, retained ] }
        migrationReason: { type: string, description: "Reason an item was retained for recovery." }
    VaultItemList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VaultItem" }
    PutVaultItemRequest:
      type: object
      required: [ kind, value ]
      properties:
        kind: { type: string, enum: [ env, file ] }
        path: { type: string, maxLength: 255, description: "File items only: the target, relative to the home directory." }
        value: { type: string, minLength: 1, maxLength: 65536, description: "UTF-8 text without NUL bytes, 1 byte to 64 KiB, stored as given." }
        selector:
          type: object
          additionalProperties: { type: string }
          description: "Absent or {}: the item applies to every machine."
    UpdateVaultItemRequest:
      type: object
      required: [ selector ]
      properties:
        selector:
          type: object
          additionalProperties: { type: string }
          description: "The new selector; {} clears it."
    MachineVault:
      type: object
      required: [ enabled, items, applied ]
      properties:
        enabled: { type: boolean, description: "The machine takes the Vault." }
        items:
          type: array
          description: The items that apply with the machine's current metadata (none when enabled is false).
          items: { $ref: "#/components/schemas/MachineVaultItem" }
        applied:
          oneOf: [ { $ref: "#/components/schemas/VaultApplied" }, { type: "null" } ]
          description: "The last write into the machine; null: none yet."
    MachineVaultItem:
      type: object
      required: [ name, kind ]
      properties:
        name: { type: string }
        kind: { type: string, enum: [ env, file ] }
        path: { type: string }
    VaultApplied:
      type: object
      required: [ at, env, files ]
      description: One write of the Vault into a machine.
      properties:
        at: { type: string, format: date-time }
        env: { type: array, items: { type: string }, description: The variables exported. }
        files:
          type: array
          description: The files written (or, when the write failed, those of the last write, kept for the next reconciliation).
          items: { $ref: "#/components/schemas/VaultFile" }
        removed: { type: array, items: { type: string }, description: Files of an earlier write removed because they no longer apply. }
        kept:
          type: array
          description: Files that no longer apply but were left (changed in the machine since, or not writable).
          items: { $ref: "#/components/schemas/VaultKept" }
        error: { type: string, description: "Why the write failed, when it did." }
    VaultFile:
      type: object
      required: [ path, sha256 ]
      properties:
        path: { type: string }
        sha256: { type: string, description: Hex sha256 of the content written. }
    VaultKept:
      type: object
      required: [ path, reason ]
      properties:
        path: { type: string }
        reason: { type: string }
    ResumeMachineRequest:
      type: object
      additionalProperties: false
      description: A body key that is none of these is refused with `400 unknown_field` (keys match case-insensitively); an empty body or `{}` is valid.
      properties:
        vault: { type: boolean, description: "False disables legacy Vault delivery without changing org Secret selections." }
    StartMachineRequest:
      type: object
      additionalProperties: false
      description: A body key that is none of these is refused with `400 unknown_field` (keys match case-insensitively) and nothing is started; an empty body or `{}` is valid.
      properties:
        host: { type: string, description: "Admin only: place the sandbox on this host. While `storage.synced` is false the sandbox can only start on its current host; another host gets `409 operation_conflict`." }
        vault: { type: boolean, description: "False disables legacy Vault delivery without changing org Secret selections." }
        vcpus: { type: integer, minimum: 1, maximum: 32, description: "Start a stopped paid sandbox at another of the workspace's `allowedSpecs`, as `PATCH` `vcpus`/`memMiB` then `start` would: with `memMiB`, one of them (alone: the one size with that many vCPUs). Absent: its current size. The size is stored before the start and the boot asks for it; read it from the sandbox's `spec` (the start Operation carries no request body). Its current size changes nothing; a running sandbox at another size is `409 operation_conflict` (stop it first), and so is a paused one (resume it, then stop it), as is a sandbox whose start is already active (naming it: only the same size, or none, joins that start); another size, or the free sandbox, is `400 spec_not_allowed`; 0 or a negative is `400 bad_request`." }
        memMiB: { type: integer, minimum: 512, maximum: 131072, description: "New memory (MiB) of the stopped sandbox, as `vcpus`; absent: its current size." }
    SuspendMachineRequest:
      type: object
      additionalProperties: false
      description: The optional body of `POST /v1/machines/{id}/suspend`, which takes no fields; any key is refused with `400 unknown_field`.
    WakeMachineRequest:
      type: object
      additionalProperties: false
      description: The optional body of `POST /v1/machines/{id}/wake`, which takes no fields; any key is refused with `400 unknown_field`.
    StopMachineRequest:
      type: object
      additionalProperties: false
      description: A body key that is none of these is refused with `400 unknown_field` (keys match case-insensitively) and nothing is stopped; an empty body or `{}` is valid.
      properties:
        timeoutSeconds: { type: integer, description: How long to wait for a clean shutdown before the sandbox is forced off. }
    RestoreMachineRequest:
      type: object
      additionalProperties: false
      properties:
        snapshotId: { type: string, description: "The snapshot whose disks the sandbox gets (`sn_...`, or an older `im_...` ID). Absent: the snapshot the sandbox was created from; a sandbox created from a template needs it (`400`)." }
        desiredState:
          type: string
          enum: [ running, stopped ]
          description: "`running` (default) boots the restored disks; `stopped` leaves the sandbox stopped with them."
        timeoutSeconds: { type: integer, description: "For a running sandbox: how long to wait for a clean shutdown before it is forced off (0-600; 0: the server default), as for stop." }
    Operation:
      type: object
      description: "The progress of a change to a sandbox (`suspend` is pause; `restore` puts its disks back to a snapshot's; `move`, admin only, copies it to another host pool). It does not return the request it was queued with (a start's `vcpus`/`memMiB` show in the sandbox's `spec`)."
      required: [ id, machineId, type, state, error, createdAt, updatedAt ]
      properties:
        id: { type: string }
        machineId: { type: string }
        type:
          type: string
          enum: [ create, start, stop, suspend, resume, delete, restore, resize, move ]
        state:
          type: string
          enum: [ queued, running, succeeded, failed ]
          description: "`succeeded` and `failed` are terminal."
        phase:
          type: string
          description: Free text progress, e.g. scheduling, booting, waiting_ready, snapshotting.
        forkInherited:
          type: boolean
          description: "On the answer to `POST /v1/machines/{id}/fork`: the control host that took it keeps the source's delete deadline, idle auto-suspend, max run and metadata, and takes `autoSuspendAfterSeconds` and `maxRunMinutes`. Absent: a host from before that (during a rolling control deploy), which gave the fork its defaults with only the request's `metadata` and `deleteAfterSeconds`; set the idle auto-suspend and max run with `PATCH /v1/machines/{id}`."
        trigger:
          type: string
          enum: [ idle, max_run, memory_pressure, timeout, archive, delete_at, drain, request, wake, user_delete, user_disable, admin, admin_delete, credit, spend_cap, downgrade, subscription_ended, payment_method, members, early_allowance_ended, abuse_pool, abuse_cpu, abuse_scan, abuse_proxy ]
          description: >-
            Set when instabox started the operation itself: `idle` (paused when idle), `max_run` (maximum continuous runtime), `memory_pressure` (paused, its processes kept, because the host it ran on was running out of memory; the next use wakes it, as after `idle`), `request` (wake on use), `wake` (POST /v1/machines/{id}/wake), `timeout`, `archive`, `delete_at` (the sandbox's `deleteAt` passed), `drain` (maintenance by an admin), `user_delete` (an admin deleted the owner), `user_disable` (an admin disabled the owner), `admin` (an admin stopped or paused the sandbox), `admin_delete` (an admin deleted the sandbox), `credit` (its free-tier org used up the month's included usage), `spend_cap`, `downgrade`, `subscription_ended`, `payment_method` (its free workspace has no card on file), `members` (its free workspace has more members than the free plan allows), `early_allowance_ended` (paused because the account's early free-sandbox allowance ended and it has more free sandboxes than the free plan runs), `abuse_pool` (paused because the sandbox tried to connect to a blocked destination on the egress blocklist, such as a crypto-mining pool; a DNS lookup of a listed domain never suspends) or `abuse_cpu` (paused by the CPU abuse detector: a restricted account's sandbox ran flat out for an hour with no memory use, no public port, nobody using it and a connection to a mining port) or `abuse_scan` (paused by the flow detector: a restricted account's sandbox swept one port across many hosts, scanned many ports of one host or brute-forced a login port). Absent: a client request.
        error:
          oneOf:
            - { $ref: "#/components/schemas/Error" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        machine:
          allOf:
            - { $ref: "#/components/schemas/Machine" }
          description: >-
            The sandbox as it is when `GET /v1/operations/{id}` is read. Included when the operation `succeeded`, the sandbox still exists, and the caller may read sandboxes (`machines:read` for API keys). Later operations can change it; it is not a record of the state at completion. Absent otherwise, and from older servers.

    HostTrust:
      type: object
      required: [ type, publicKey, principals ]
      properties:
        type: { type: string, enum: [ ca ] }
        publicKey: { type: string, description: "SSH host certificate authority's public key, in authorized_keys format." }
        principals:
          type: array
          items: { type: string }
    ConnectionInfo:
      type: object
      required: [ machineId, transport, host, port, username, hostTrust, capabilities ]
      properties:
        machineId: { type: string }
        transport: { type: string, enum: [ ssh ] }
        host: { type: string }
        port: { type: integer }
        moshHost: { type: string, description: "Optional separate Mosh gateway host; defaults to host when absent." }
        moshPort: { type: integer, minimum: 1, maximum: 65535, description: "SSH port for Mosh session bootstrap; defaults to port when absent. The UDP relay port is negotiated during bootstrap." }
        username: { type: string, description: The sandbox ID. }
        hostTrust: { $ref: "#/components/schemas/HostTrust" }
        capabilities:
          type: array
          items: { type: string, enum: [ pty, exec, port-forwarding, mosh ] }
          description: "`mosh`: mosh works (a session that runs `mosh-server new` gets a relay UDP port in its `MOSH CONNECT` line)."
    CreateConnectionRequest:
      type: object
      required: [ publicKey ]
      properties:
        publicKey: { type: string, description: Client public key in authorized_keys format. }
        ttlSeconds: { type: integer, minimum: 1, maximum: 86400, description: "Default 3600, max 86400." }
    DesktopRequest:
      type: object
      properties:
        action: { type: string, enum: [ status, install, start, takeover, handback ], default: status }
        width: { type: integer, description: "Screen width in pixels for start, 800-2560 (default 1280)." }
        height: { type: integer, description: "Screen height in pixels for start, 600-1600 (default 800)." }
    Desktop:
      type: object
      required: [ installed, installing, running, failed, agentPausable ]
      properties:
        kind: { type: string, enum: [ x11, wayland, vm ], description: "The desktop the sandbox has. `vm` (a Windows or Mac sandbox): its VM's own screen, always running and controlled by every viewer (`controller` `human`, `yours`); `install`, `start`, `takeover` and `handback` change nothing. `x11` (absent from servers before this field): Xvnc and Xfce, installed on first use, driven by the computer-use MCP. `wayland` (the omarchy template): a compositor that starts at boot and is in the image: `install` changes nothing, `start` only brings the session and its VNC server up and sizes the display, and there is no computer-use MCP (`agentPausable` is false); watch and use it through VNC." }
        installed: { type: boolean }
        installing: { type: boolean }
        running: { type: boolean, description: "The VNC server answers: GET /v1/machines/{id}/vnc connects." }
        failed: { type: boolean, description: "The last install failed; log holds its last lines." }
        log: { type: string }
        controller:
          type: string
          enum: [ agent, human ]
          description: "Who drives the desktop: `agent` (the default; viewers watch) or `human` (a viewer took over, and the computer-use MCP refuses input until they hand back or 30 s pass without a call from them)."
        yours: { type: boolean, description: "The caller (its sign-in session or API key) is the viewer in control. Absent when false." }
        controlError: { type: string, description: "The control file in the sandbox could not be written (its runtime directory is missing or not writable): takeover and handback cannot take effect. The reason, from the sandbox." }
        agentPausable: { type: boolean, description: "The sandbox's computer-use MCP honors the control (its wrapper runs the server through the proxy). False on a sandbox made before the proxy existed: a takeover would not pause its agent, so clients should offer watching only." }
        actions:
          type: array
          description: "The computer-use MCP's last tool calls (at most 20, oldest first), as its proxy logged them."
          items: { $ref: "#/components/schemas/DesktopAction" }
        hint: { type: string, description: "Only on a `start` that started nothing because the desktop is not installed (`start` never installs), is still installing, or failed to install: what to send next. Absent otherwise." }
    DesktopAction:
      type: object
      required: [ time, tool ]
      properties:
        time: { type: string, format: date-time }
        tool: { type: string, description: "The MCP tool called (click, type_text, get_app_state, ...)." }
        args: { type: object, additionalProperties: true, description: "Its arguments, strings shortened to 80 characters." }
        refused: { type: boolean, description: "Refused because a human controlled the desktop; it never reached the tool." }
    DesktopStreamRequest:
      type: object
      properties:
        viewOnly: { type: boolean, default: true, description: "The link only shows the desktop; the server drops the viewer's input." }
        ttlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 3600, description: "How long the link opens the desktop." }
    DesktopStream:
      type: object
      required: [ url, expiresAt ]
      properties:
        url: { type: string, description: "The dashboard's full-screen viewer, `<dashboard>/desktop/{id}#token=...`; open it or embed it in an iframe." }
        expiresAt: { type: string, format: date-time }
    ExecRequest:
      type: object
      description: >-
        Set exactly one of `cmd` (a shell string) and `argv` (a program and its arguments, run without a shell); both, neither or an empty `argv` is `400 bad_request`. An empty `cmd` counts as no `cmd`, so `{"cmd": "", "argv": [...]}` runs the `argv`.
      oneOf:
        - required: [ cmd ]
          properties: { cmd: { minLength: 1 } }
          not: { required: [ argv ] }
        - required: [ argv ]
          properties: { cmd: { maxLength: 0 } }
      properties:
        cmd: { type: string, maxLength: 65536, description: "Shell command, run with `bash -lc`. At most 64 KiB, no NUL bytes. Set this or `argv`; an empty `cmd` is no `cmd`." }
        argv:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            The program and its arguments, run with no shell: each element reaches the program exactly as sent (no expansion of `$`, `*` or `~`, no word splitting, quotes or redirections; `""` is an empty argument). `argv[0]` must not be empty and is looked up on the login profile's `PATH`; the login profile, `envs` and `cwd` apply as for `cmd`. A program that is not found exits 127, one that cannot run 126. At most 64 KiB counting each element's length plus one, no NUL bytes. The command sent to the sandbox (`envs`, `cwd` and `argv`, quoted for the shell: about 9 bytes per element plus its text) must also stay under 128 KiB, so many short elements can be `400 bad_request` below the 64 KiB cap; send bulk data on `stdin`. Set this or `cmd`.
        cwd: { type: string, maxLength: 4096, description: "Working directory (default HOME, `/data/home`)." }
        envs:
          type: object
          maxProperties: 256
          description: "Environment variables exported before the command (after the login profile). Names match `^[A-Za-z_][A-Za-z0-9_]*$`."
          additionalProperties: { type: string }
        secretEnvs:
          type: object
          maxProperties: 64
          description: "Direct (delivery env) Secrets of the sandbox's org exported for this command only: variable name -> Secret name. Resolved at exec time, never stored or written into the sandbox; each use is audited by name. A name may not also be in `envs`; reserved variables are refused. A proxy or missing Secret is 400. Only where `GET /v1/me` has `directSecretRefs`; elsewhere 400 (a control host from before secretEnvs would run the command without them)."
          additionalProperties: { $ref: "#/components/schemas/SecretName" }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 600, description: "Default 60, max 600." }
        stdin:
          type: string
          description: >-
            Text fed to the command, then EOF. It is a JSON string, so the command reads its UTF-8 bytes: NUL, CR and LF arrive unchanged (escaped as `\u0000`, `\r`, `\n`). At most 1 MiB (1048576 bytes) of UTF-8, counted in bytes, not characters (`é` is 2): more is `400 bad_request` `stdin is longer than 1048576 bytes`. The schema sets no `maxLength` here, because `maxLength` counts characters. JSON cannot carry bytes that are not UTF-8; any in the request body reach the command as U+FFFD (`ef bf bd`), with no error. For binary input, send it base64-encoded and decode it in the command (`base64 -d | ...`; up to 768 KiB of binary fits), or write the file first with `PUT /v1/machines/{id}/files` and redirect it in (`cmd < file`). The CLI's `exec --stdin` does that upload itself for input past 1 MiB or not UTF-8, up to 5 GiB.
        noHistory: { type: boolean, description: "Leave the command out of the sandbox's history (`GET /v1/machines/{id}/history`): for a client's own housekeeping commands, such as the CLI's job polls. Does not go with `historyCommand`." }
        historyCommand: { type: string, description: "How the command appears in the sandbox's history instead of `cmd` or `argv`, for a wrapper that runs something else (the CLI's `exec --background`). Cut at 4096 bytes like them; no NUL bytes." }
    ExecResult:
      type: object
      required: [ stdout, stderr, exitCode, timedOut, truncated ]
      properties:
        stdout: { type: string, description: "First 1 MiB of standard output." }
        stderr: { type: string, description: "First 1 MiB of standard error." }
        exitCode: { type: integer, description: "Exit status; 128+N if killed by standard signal N, otherwise 255 with `signal` set; 124 if timed out." }
        signal: { type: string, description: "The signal that killed the command, as the sandbox named it (absent otherwise)." }
        timedOut: { type: boolean, description: "The command ran past `timeoutSeconds` and was killed." }
        truncated: { type: boolean, description: "stdout or stderr was longer than 1 MiB and was cut." }
        diskWarning: { $ref: "#/components/schemas/DiskWarning", description: "Set when the command failed with No space left on device (read again right after it), or a filesystem was at least 90% full when last read (read in the background after an exec or metrics call, at most once a minute)." }
        invalidUtf8: { type: boolean, description: "stdout or stderr had bytes that are not UTF-8 (binary output), replaced with U+FFFD, so the output is not what the command wrote. Absent when false; also set on a streamed exec's exit event." }
        oomKilled: { type: boolean, description: "The command exited non-zero and the sandbox's kernel OOM killer killed one of its own processes (the command or a child: its SSH session's cgroup; never another command's process, and each kill is reported once). `oomKill` says which, when the sandbox named it. Checked only for exit code 137, a signal, or stderr saying a process was killed. False when none was seen, the exec's session scope could not be read, or the sandbox's host or guest agent cannot report kills; a kill whose kernel log record was lost is still true when the session scope's oom_kill count shows it (`oomKill` absent). Absent from older servers. Also set on a streamed exec's exit event." }
        oomKill: { $ref: "#/components/schemas/OOMKill", description: "The OOM kill behind `oomKilled` (the newest, when several)." }
    ExecHistoryEntry:
      type: object
      description: >-
        One command of a sandbox's history: an exec request that reached the sandbox, whoever sent it, as the server recorded it. `stdout` and `stderr` are set only by `GET /v1/machines/{id}/history/{execId}`.
      required: [ id, machineId, userId, command, startedAt, endedAt, durationMs, status, exitCode, timedOut, streamed, truncated, outputTruncated, stdoutBytes, stderrBytes ]
      properties:
        id: { type: string, description: "Command ID (`ex_…`)." }
        machineId: { type: string }
        userId: { type: integer, format: int64, description: The account that ran it. }
        command: { type: string, description: "The request's `cmd`, its `argv` quoted for a shell, or its `historyCommand`; cut at 4096 bytes." }
        cwd: { type: string, description: "The request's `cwd` (absent: HOME)." }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        status:
          type: string
          enum: [ exited, timed_out, lost, cancelled, unreachable ]
          description: >-
            How the command ended: `exited` (exit code reported; `signal` set if a signal killed it), `timed_out` (killed after `timeoutSeconds`), `lost` (the connection to the sandbox ended before the exit status; it may have run), `cancelled` (the client closed the request; the command was killed) or `unreachable` (the sandbox could not be reached; nothing ran).
        exitCode: { type: integer, description: "The `ExecResult`'s exit code; -1 for `lost`, `cancelled` and `unreachable`." }
        signal: { type: string, description: "The signal that killed the command, as the sandbox named it (absent otherwise)." }
        timedOut: { type: boolean }
        streamed: { type: boolean, description: "The client streamed the output (`Accept: text/event-stream`)." }
        truncated: { type: boolean, description: "The exec's result had its output cut at 1 MiB per stream (never for a streamed exec)." }
        outputTruncated: { type: boolean, description: "The stored output is cut: the history keeps the first 64 KiB of each stream." }
        stdoutBytes: { type: integer, description: Size of the stored stdout. }
        stderrBytes: { type: integer, description: Size of the stored stderr. }
        stdout: { type: string, description: "The stored stdout (`GET /v1/machines/{id}/history/{execId}` only)." }
        stderr: { type: string, description: "The stored stderr (`GET /v1/machines/{id}/history/{execId}` only)." }
    ExecHistory:
      type: object
      required: [ commands ]
      properties:
        commands:
          type: array
          items: { $ref: "#/components/schemas/ExecHistoryEntry" }
          description: Newest first.
        nextCursor: { type: string, description: "The `cursor` of the next (older) page; absent on the last page." }
    Process:
      type: object
      required: [ pid, ppid, user, cpuPercent, memPercent, elapsedSeconds, command ]
      description: One process, as `ps -e -ww -o pid=,ppid=,user:64=,pcpu=,pmem=,etimes=,args=` reports it.
      properties:
        pid: { type: integer }
        ppid: { type: integer }
        user: { type: string }
        cpuPercent: { type: number }
        memPercent: { type: number }
        elapsedSeconds: { type: integer, format: int64 }
        command: { type: string, description: The full command line. }
    ProcessList:
      type: object
      required: [ machineId, state, live, capturedAt, trigger, truncated, processes ]
      properties:
        machineId: { type: string }
        state: { type: string, description: The sandbox's state now. }
        live: { type: boolean, description: "The list was read from the running sandbox for this request; false: the list the server stored last, for a stopped or paused sandbox." }
        capturedAt: { type: string, format: date-time, description: When the list was read. }
        trigger: { type: string, enum: [ request, stop, suspend ], description: "What read it: a client's request, or the server just before a stop or a pause." }
        truncated: { type: boolean, description: The listing was cut; processes are missing. }
        processes:
          type: array
          items: { $ref: "#/components/schemas/Process" }
          description: "Without `all`, kernel threads and the listing's own processes are left out."
    Connection:
      type: object
      required: [ id, machineId, transport, host, port, username, certificate, expiresAt, hostTrust ]
      properties:
        id: { type: string, description: "Connection ID (`cn_…`), also the certificate key ID." }
        machineId: { type: string }
        transport: { type: string, enum: [ ssh ] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        certificate: { type: string, description: User certificate in authorized_keys format. }
        expiresAt: { type: string, format: date-time }
        hostTrust: { $ref: "#/components/schemas/HostTrust" }
    CreateSSHTokenRequest:
      type: object
      properties:
        name: { type: string, description: "Optional display name; whitespace is trimmed, at most 100 UTF-8 bytes. Existing callers may omit it." }
        ttlSeconds: { type: integer, minimum: 1, maximum: 2592000, description: "Default 604800 (7 days), max 2592000 (30 days)." }
        noExpiry: { type: boolean, description: "A token that works until it is revoked: the reply has no `expiresAt`. Does not go with `ttlSeconds`." }
    SSHTokenInfo:
      type: object
      required: [ id, name, createdAt ]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "Absent: the token does not expire." }
        revokedAt: { type: string, format: date-time }
        host: { type: string, description: "With `port`, `token`, `command` and `moshCommand`: set only in a sign-in session, for a valid token the caller made, when the server kept it (a vault key is configured)." }
        port: { type: integer }
        token: { type: string }
        command: { type: string }
        moshCommand: { type: string }
    SSHTokenList:
      type: object
      required: [ tokens ]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/SSHTokenInfo" }
    SSHToken:
      type: object
      required: [ id, name, machineId, host, port, token, command, hostKeyFingerprint ]
      properties:
        name: { type: string }
        id: { type: string, description: "Connection ID (`cn_…`) of the token's grant." }
        machineId: { type: string }
        host: { type: string }
        port: { type: integer }
        token: { type: string, description: "`ibssh_` and 26 lowercase base32 characters (128 bits): the SSH user name. Shown only here." }
        command: { type: string, description: "`ssh -p <port> <token>@<host>` (without `-p` on port 22)." }
        moshCommand: { type: string, description: "The same login with mosh: `mosh --ssh=\"ssh -p <port>\" <token>@<host>` (`mosh <token>@<host>` on port 22). Absent when mosh is not available." }
        expiresAt: { type: string, format: date-time, description: "Absent: the token does not expire (`noExpiry`)." }
        hostKeyFingerprint: { type: string, description: "SHA256 fingerprint of the SSH server's host key, which ssh asks to confirm on the first connection." }
    SSHTokensRevoked:
      type: object
      required: [ revoked ]
      properties:
        revoked: { type: integer, description: Tokens that were still valid. }

    CreateOrcaConnectionRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [ runtime, mobile ]
          description: "Orca device scope of the assertion: `runtime` (default, full access) or `mobile` (Orca's mobile method allowlist, push registration)."
    OrcaConnection:
      type: object
      required: [ machineId, endpoint, assertion, serverPublicKey, scope, expiresAt ]
      properties:
        machineId: { type: string }
        endpoint: { type: string, description: "`wss://<server>/v1/tunnels/ibt_…`; single use." }
        assertion: { type: string, description: Compact JWS (EdDSA) for the runtime's `e2ee_auth`. }
        serverPublicKey: { type: string, description: The runtime's NaCl box public key (base64). }
        scope: { type: string, enum: [ runtime, mobile ] }
        expiresAt: { type: string, format: date-time, description: When the endpoint's ticket expires. }
    OrcaKey:
      type: object
      required: [ kid, kty, crv, x ]
      properties:
        kid: { type: string }
        kty: { type: string, enum: [ OKP ] }
        crv: { type: string, enum: [ Ed25519 ] }
        x: { type: string, description: base64url public key. }
    OrcaKeys:
      type: object
      required: [ issuer, keys ]
      properties:
        issuer: { type: string, description: The `iss` of assertions (the server's public URL). }
        keys:
          type: array
          items: { $ref: "#/components/schemas/OrcaKey" }

    Session:
      type: object
      required: [ id, kind, createdAt, lastUsedAt, expiresAt, current ]
      properties:
        id: { type: string, description: "Revoke handle (`ss_…`)." }
        kind: { type: string, enum: [ cli, browser ] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: "Last browser use, or the last token refresh of a CLI session." }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean, description: The session making this request. }
    SessionList:
      type: object
      required: [ sessions ]
      properties:
        sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
    MachineAbuseLock:
      type: object
      description: >-
        The owner's account of the abuse check's pause behind a sandbox's cooldownReason: when, what the sandbox did in a sentence (explanation) and in detail (what, with the exact address of a blocked destination, the address and port of a brute force, the swept port or scanned host and the count of a scan, the CPU share and, when the check confirmed it, the mining program and its pool), and how to appeal.
      required: [ at, explanation, what, appeal ]
      properties:
        at: { type: string, format: date-time, description: When the sandbox was paused. }
        explanation: { type: string, description: 'One plain sentence on what the sandbox did ("was reaching known abuse addresses ...").' }
        what: { type: string, description: 'The finding with its exact address and counts ("connected to blocked 47.91.89.3", "30 connections to 198.51.100.7:22 (brute force)", "swept port 22 across 500 destinations").' }
        dst: { type: string, description: "The blocked destination, the brute-forced or scanned address." }
        port: { type: integer, description: "A brute force's destination port, or the swept port. A blocked destination's port is not recorded (the node keeps the address alone)." }
        kind: { type: string, description: "A network-flows finding's kind: sweep, scan, brute or fanout." }
        count: { type: integer, description: "A network-flows finding's destinations, ports or connections." }
        coreShare: { type: number, description: "The CPU check's mean share of the sandbox's vCPUs." }
        process: { type: string, description: "The mining program the CPU check found running, when it confirmed one." }
        pool: { type: string, description: That program's pool. }
        appeal: { type: string, description: How to contest the pause. }
    APIKey:
      type: object
      required: [ id, name, prefix, scopes, createdAt, lastUsedAt, expiresAt ]
      properties:
        id: { type: string, pattern: "^w?key_[a-z2-7]{26}$", description: "`key_...` a personal org's, `wkey_...` a workspace's." }
        name: { type: string }
        prefix: { type: string, description: "First 8 characters after `ibk_`, for recognizing the key." }
        scopes:
          type: array
          description: "`APIKeyScope`s, or a workspace key's `workspace:admin`."
          items: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [ string, "null" ], format: date-time, description: Updated at most once a minute. }
        expiresAt: { type: [ string, "null" ], format: date-time }
        orgId: { type: string, description: "The key's org." }
        createdBy: { type: integer, format: int64, description: "The key's maker." }
        createdByLogin: { type: string, description: "The maker's login." }
    APIKeyScope:
      type: string
      enum: [ machines:read, machines:write, machines:delete, images:read, images:write, images:delete ]
    APIKeyList:
      type: object
      required: [ keys ]
      properties:
        keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    CreateAPIKeyRequest:
      type: object
      required: [ name, scopes ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scopes: { type: array, minItems: 1, items: { $ref: "#/components/schemas/APIKeyScope" } }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, default: 0, description: "Days until the key expires, 1-365. 0 or absent: it does not expire." }
    CreateWorkspaceAPIKeyRequest:
      type: object
      required: [ name ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scopes:
          type: array
          minItems: 1
          description: "`APIKeyScope`s, or in a workspace `workspace:admin` (also what absent means there). A personal org's key needs some."
          items: { type: string }
        expiresInDays: { type: integer, minimum: 0, maximum: 365, default: 0, description: "Days until the key expires, 1-365. 0 or absent: it does not expire." }
    CreatedAPIKey:
      type: object
      required: [ apiKey, key ]
      properties:
        apiKey: { $ref: "#/components/schemas/APIKey" }
        key: { type: string, pattern: "^ibk_[a-z2-7]{52}$", description: "The secret, shown only in this reply and to polls repeated within the 10-minute delivery window." }
