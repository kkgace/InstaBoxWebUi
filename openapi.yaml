        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ secrets ]
      operationId: pushMachineSecrets
      summary: Refresh managed Secret delivery in a running sandbox.
      description: |
        API keys require `machines:write`. Takes no body or Idempotency-Key.
