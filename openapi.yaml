  /v1/machines/{id}/files:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: getMachineFiles
      summary: Read a file or directory of a running sandbox.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Lists a directory or returns a file of a running sandbox you own, read live the same way exec runs commands, as root (sudo; as the dev user if sudo needs a password). The response is the Files shape: a directory lists its entries (directories first, then by name, at most 5000); a regular file returns its content as text (at most 256 KiB) unless it is binary. Symbolic links in the path are followed. A sandbox paused for idleness is resumed first; other non-running sandboxes return 409 `machine_not_running`. A path that does not exist is 404. It counts toward the per-user limit of requests at once (free plan 32; Pro 64; Builder, Team and Enterprise 256). API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      parameters:
        - name: path
          in: query
          description: Absolute path, at most 4096 bytes (default "/").
          schema: { type: string, default: / }
      responses:
        "200":
          description: The file or directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Files" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      tags: [ machines ]
      operationId: writeMachineFile
      summary: Write (upload) a file to a running sandbox.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
        - {}
      description: >-
        Streams the raw request body into the file at `path` of a running sandbox, as the sandbox's user (like exec; no sudo). Any bytes, up to 5 GiB (5368709120 bytes; more is 413 `too_large`); there is no exec body or output cap on this route. The body goes to a temporary file in the destination's directory, which is renamed over `path` only once every byte arrived, so a failed or interrupted upload never leaves a partial file. A transfer is cut off after 2 hours (7200 seconds; 408 `bad_request`) however steadily it moves. An existing file keeps its mode unless `mode` is given; a new one gets 0644. A symbolic link at `path` is followed. A missing parent directory is 404 `missing_parent` unless `parents=true`; a directory the user cannot write, or an existing file it cannot write, is 403 `permission_denied`; `path` naming a directory (or a parent that is a file) is 409 `not_a_file`; a full disk is 507 `no_space`. A sandbox paused for idleness is resumed first; other non-running sandboxes return 409 `machine_not_running`. An upload that moves no bytes for 60 seconds is dropped. With `token` (from POST /v1/machines/{id}/files/upload-url) the request needs no other credential, and `mode` and `parents` come from the token. It counts toward the per-user limit of requests at once (free plan 32; Pro 64; Builder, Team and Enterprise 256). API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute path of the file, at most 4096 bytes; not ending in "/".
          schema: { type: string }
        - name: mode
          in: query
          description: Octal permissions, for example 0755 (default an existing file's, else 0644).
          schema: { type: string, pattern: "^0?[0-7]{3}$" }
        - name: parents
          in: query
          description: Create missing parent directories (mkdir -p).
          schema: { type: boolean, default: false }
        - name: token
          in: query
          description: An upload URL's signed token; replaces the credential.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: An existing file was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWritten" }
        "201":
          description: The file was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileWritten" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: The body is over 5 GiB (`too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "507":
          description: The sandbox's disk filled during the write (`no_space`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/machines/{id}/files/content:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: downloadMachineFile
      summary: Download a file's raw bytes from a running sandbox.
      security:
        - bearerAuth: []
