    post:
      tags: [ connections ]
      operationId: createSSHToken
      summary: Issue an SSH token, for a plain `ssh` command without a key.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: |
        Returns a token to use as the SSH user name:
        `command` is `ssh -p <port> <token>@<host>`. The server keeps its
