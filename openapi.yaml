      tags: [ secrets ]
      operationId: updateMachineSecrets
      summary: Replace supplied Secret selections for a sandbox.
      description: |
        Org members with sandbox write access may select existing Secrets.
        API keys require `machines:write`. Each supplied field replaces its
        whole selection; omission keeps it unchanged. Null, unknown names,
        wrong-delivery references and cross-org references reject the request.
