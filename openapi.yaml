                webUrl:
                  type: string
                  format: uri
                  description: >-
                    Optional access origin for pre-cutover validation. Requires an administrator sign-in (API keys cannot use it). Only this response targets that origin; global routing is unchanged.
      responses:
        "200":
          description: Connection admission; reconnects should request a new ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ url, expiresAt ]
                properties:
                  url: { type: string, format: uri }
                  watchUrl: { type: string, format: uri }
                  token: { type: string }
                  protocol: { type: string }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/terminal:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: openMachineTerminal
      summary: Open a terminal on a running sandbox, over a WebSocket.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Upgrades to a WebSocket (RFC 6455; send Connection: Upgrade, Upgrade: websocket) carrying a PTY (xterm-256color) of a login shell as the dev user on a running sandbox you own. Binary messages are the terminal's bytes in both directions. Text messages are JSON controls: {"type":"resize","cols":N,"rows":N} from the client; {"type":"session","session":S,"persistent":B} before the shell's output, then {"type":"exit","code":N} when the shell exits, {"type":"taken"} when the session was opened elsewhere, or {"type":"error","message":"..."} from the server, which then closes. The shell is a persistent session: it keeps running when the connection ends, and the next terminal on the same session gets it back with its recent output replayed (one viewer at a time). The server pings every 30 s and drops a connection silent for 90 s. A browser session must come from the dashboard's origin (Origin header). At most 8 open terminals per user (429 `quota_exceeded`). API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      parameters:
        - name: cols
          in: query
          description: Initial width in columns, 10-1000 (default 80).
          schema: { type: integer }
        - name: rows
          in: query
          description: Initial height in rows, 4-500 (default 24).
          schema: { type: integer }
        - name: session
          in: query
          description: Session name, 1-32 of a-z, 0-9 and - (default main).
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
        - name: wake
          in: query
          description: >-
            0 never wakes an idle-suspended sandbox: one that is not running is 409 (retryable).
          schema: { type: string, enum: [ "0" ] }
        - name: restart
          in: query
          description: >-
            1 ends the session's shell (and every program in it) before attaching, so the terminal opens on a new shell. Other windows on the session see it exit.
          schema: { type: string, enum: [ "1" ] }
      responses:
        "101": { description: Switched to the WebSocket protocol. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/desktop:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ machines ]
      operationId: machineDesktop
      summary: The state of a running machine's desktop; install or start it.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        A graphical desktop in the machine: Xvfb, an Xfce session, Chromium and a VNC server, which GET /v1/machines/{id}/vnc reaches once it runs. Nothing runs until asked for. The agent-browser, android, herdr and orca templates include the packages; universal and t3 do not. `status` (the default) reports the state; `install` starts installing the packages in the background (about half a minute, about 1.4 GiB of the root disk) and returns at once; `start` starts the desktop of an installed machine and waits for its VNC server. `start` never installs: on a machine without the packages it starts nothing and returns the state with `installed` false and a `hint` saying what to send next. There, send `install`, poll `status` until `installed` is true, then `start`. `width` and `height` size the screen of a desktop that `start` starts (default 1280x800, within 800-2560 x 600-1600). The packages stay installed, and snapshots keep them. `takeover` gives the caller control of the desktop (`controller: human`, `yours: true`): the computer-use MCP in the machine refuses input tools until `handback` returns it to the agent. Control is held per sign-in session (or API key): every call the holder makes renews it, and it returns to the agent 30 s after the holder's last call (a closed viewer), while the same session finds it again after a reload. `handback` by anyone else changes nothing; `takeover` by anyone else takes it over. The lock is advisory: tools driving the display directly (xdotool) do not consult it. API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopRequest" }
      responses:
        "200":
          description: The desktop's state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Desktop" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/vnc:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: openMachineVNC
      summary: The desktop of a running machine, over VNC in a WebSocket.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Upgrades to a WebSocket (RFC 6455) carrying the VNC (RFB) stream of the machine's desktop: binary messages in both directions, as noVNC speaks. The VNC server listens on the machine's loopback only and has no password: this endpoint is the way in. When the desktop stops, the server closes with code 1001 and the reason "desktop closed". 409 `desktop_not_running` before POST /v1/machines/{id}/desktop started it. The server pings every 30 s and drops a connection silent for 90 s. A browser session must come from the dashboard's origin (Origin header). Open desktops count toward the 8 open terminals per user (429 `quota_exceeded`). A desktop link (POST /v1/machines/{id}/desktop/stream) connects with the subprotocols `Sec-WebSocket-Protocol: instabox-desktop.v1, instabox-token.<token>` (never the URL; a `token` query parameter is ignored); the server selects `instabox-desktop.v1` only. The token is then the only credential, for that machine only, while the machine and its owner's account exist, until it expires or is revoked (401 otherwise, also without `instabox-desktop.v1` or the token). Expiry stops new connections; revoke ends open sessions (closed with the reason "link revoked"). A view-only link's input (keys, pointer, clipboard, resize) never reaches the desktop. API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      responses:
        "101": { description: Switched to the WebSocket protocol. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/desktop/stream:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ machines ]
      operationId: createMachineDesktopLink
      summary: A short-lived link to watch (or use) the machine's desktop in a browser.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Returns a link to the dashboard's full-screen desktop viewer, which anyone with the link can open, or embed in an iframe, without signing in. Expiry stops new connections; revoke ends open sessions: a session opened before `expiresAt` goes on until the viewer leaves, DELETE on this path revokes the link, or the machine or account is deleted. The token in its fragment is signed by the server and binds this machine, its owner and the link's mode; it is not an API key. View-only (the default): the server drops the viewer's input. The machine and its desktop must be running when the link is opened (GET /v1/machines/{id}/vnc rules), not when it is made: the link comes back at once. Only the machine's creator, signed in or with their personal key, makes and revokes its links: another member of its org, or a workspace API key, gets 403 `permission_denied`, and opens the desktop itself over GET /v1/machines/{id}/vnc (which needs `machines:write`); 404 means the caller cannot reach the machine. A personal key reaches only the machines of its owner's personal workspace. API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopStreamRequest" }
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopStream" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ machines ]
      operationId: revokeMachineDesktopLinks
      summary: Revoke every desktop link of the machine and end their open sessions.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Every link minted for this machine so far stops working, and the sessions open through them end within about 3 seconds (each checks every 3 s, on any server instance), or immediately if the check can't be completed. Links minted afterwards work. Only the machine's creator, signed in or with their personal key, revokes its links: another member of its org, or a workspace API key, gets 403 `permission_denied`, and opens the desktop itself over GET /v1/machines/{id}/vnc (which needs `machines:write`); 404 means the caller cannot reach the machine. A personal key reaches only the machines of its owner's personal workspace. API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/desktop/stream/state:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: getMachineDesktopLinkState
      summary: Whether a desktop link would connect now, and if not why.
      security: []
      description: >-
        Unauthenticated: the link's token goes in the `X-Desktop-Token` header (not the query string). Runs the checks GET /v1/machines/{id}/vnc runs for a new connection and always answers 200 with `state`: `ok`; `expired` (expiry stops new connections); `revoked` (DELETE /v1/machines/{id}/desktop/stream ended it); `invalid` (anything else: not a link for this machine, or its owner's account is gone).
      parameters:
        - { name: X-Desktop-Token, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: The link's state.
          content:
            application/json:
              schema:
                type: object
                required: [ state ]
                properties:
                  state: { type: string, enum: [ ok, expired, revoked, invalid ] }
  /v1/machines/{id}/desktop/watch:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: watchMachineDesktop
      summary: The desktop's status, streamed while the caller's VNC session is open.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Server-sent events (`text/event-stream`) for the caller's open desktop session on the machine (GET /v1/machines/{id}/vnc): while that session is open the server runs the desktop's status every 3 s on a guest connection of the heartbeat's own (never the session's), with the caller as the control's owner (the heartbeat that keeps a control the caller holds, which lapses 30 s after the session closes), and sends each result as a `status` event whose data is a Desktop object (the latest one first); a beat the guest did not answer is a `stale` event whose data is `{"message": "..."}` (the status is stale until the next `status`), and `end` comes when the caller's last desktop session on the machine closes (its sessions, such as two tabs, share one stream of events). A comment line every 15 s keeps the connection alive. 404 `not_found` without an open desktop session of the caller's on the machine: poll POST /v1/machines/{id}/desktop instead. 429 `quota_exceeded` beyond 8 open streams per desktop session. A browser session is checked for the dashboard's origin: an `Origin` header, when the browser sends one (cross-origin), must be the dashboard's; without one (a same-origin `EventSource` carries none) the request is refused only when `Sec-Fetch-Site` or `Referer` says it comes from elsewhere. API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string, description: "`event: status` lines with a Desktop JSON object as data; `event: stale` with `{\"message\"}` when a heartbeat failed; `event: end` when the caller's last session closes." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/snapshots/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SnapshotID"
    get:
      tags: [ snapshots ]
      operationId: getSnapshotFiles
      summary: Read a file or directory of a snapshot's system files.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Reads the snapshot's saved system files directly; no sandbox runs. A directory lists its entries (directories first, then by name, at most 5000); a regular file returns its content as text (at most 256 KiB) unless it is binary. Symbolic links in the path, also the last component, are followed. The saved storage (/data: HOME and your work) is not shown here. After an unclean stop the newest changes may not show. A path that does not exist is 404; a path on /data is 400 `data_disk_not_browsable` (the snapshot may still hold the file, on its data disk); system files that cannot be read (not an ext4 filesystem) are 400. API keys: needs one of the scopes `images:read`.
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: The file or directory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Files" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/images/{id}/files:
    parameters:
      - $ref: "#/components/parameters/SnapshotID"
    get:
      tags: [ snapshots ]
      operationId: getImageFiles
      deprecated: true
      summary: "Deprecated: GET /v1/snapshots/{id}/files."
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "The old name of GET /v1/snapshots/{id}/files. API keys: needs one of the scopes `images:read`."
      parameters:
        - $ref: "#/components/parameters/FilesPath"
      responses:
        "200":
          description: The file or directory.
          headers: { Deprecation: { $ref: "#/components/headers/Deprecation" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Files" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/usage:
    get:
      tags: [ usage ]
      operationId: getUsage
      summary: Your storage use, limits, this month's cost and credit balance.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Your personal org's sandbox and snapshot counts, the stored data they take up, and its limits (free: 1 sandbox, 5 snapshots, 200 GiB of stored data by default); with a workspace's API key, that workspace's; with `org`, that org's. `org` in the answer names the org it describes. `cost` is the org's cost this calendar month (UTC) in USD and its credit balance, from the hourly rating (the same as `usage` on `GET /v1/orgs/{id}`). Stored data is as of `computedAt`, usually under an hour old. API keys: needs one of the scopes `machines:read`, `images:read`."
      parameters:
        - name: org
          in: query
          required: false
          schema: { type: string }
          description: "An org you belong to (org_...), personal or workspace, to report instead of the default. A workspace API key may name only its own workspace. An org you are not a member of, or that does not exist, answers `404 not_found`, as `GET /v1/orgs/{id}` does."
      responses:
        "200":
          description: Usage as of `computedAt`, and the limits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/usage/machines:
    get:
      tags: [ usage ]
      operationId: listMachineUsage
      summary: Compute use and price by sandbox over a window, deleted sandboxes included.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "The compute (vCPU and memory) each of the org's sandboxes used in `[from, to)`, as the hourly rating counts it: every live sandbox, and every deleted one that ran in the window (`deletedAt` set). The org is chosen as in `GET /v1/usage`. `computeUSD` is the vCPU and memory at list prices, before the plan's included allowance (applied to the org, not per sandbox); 0 for a free sandbox. Disk and egress are not in it. The window defaults to this calendar month (UTC) up to now and may be at most 366 days, as for `GET /v1/machines/{id}/usage`. API keys: needs the scope `machines:read`."
      parameters:
        - name: org
          in: query
          required: false
          schema: { type: string }
          description: As in `GET /v1/usage`.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Start of the window (RFC 3339). Default the start of this month (UTC).
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: End of the window (RFC 3339), after `from`. Default now.
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [ computeUSD, vcpuSeconds, memGiBSeconds ], default: computeUSD }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [ asc, desc ], default: desc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of the sandboxes, and how many there are.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMachineUsageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs:
    get:
      tags: [ orgs ]
      operationId: listOrgs
      summary: The orgs you belong to, your personal org first.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Every account has one personal org, made when it signed up, on any tier but never shared; the others are workspaces, also on any tier (docs/orgs.md). Each lists the sizes you may create in it (`allowedSpecs`). API keys: any scope."
      responses:
        "200":
          description: Your orgs, with your role in each.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [ orgs ]
      operationId: createOrg
      summary: Buy a workspace through Stripe Checkout. Signed-in sessions only.
      description: >-
        Starts a Checkout Session for a workspace named `name` on `tier`, `pro` or `team` (a new workspace is never on `free`: `400`): it pays the plan, billed on the 1st of each month (UTC), the first charge prorated (docs/pricing.md). Nothing is made until it completes: the workspace then exists with you as its owner (`GET /v1/orgs`), and `org.create` is written to the audit log. A newer purchase expires an earlier open one. `429 quota_exceeded` when you are in as many workspaces as your account allows (made or joined). Without server.json `stripe`, `503`. An account the invite gate holds back may call it too (docs/invites.md, "Paying instead of a code"): once the plan takes effect the account is activated, with `user.activate` in the audit log. From a region the server blocks, such an account gets `403 permission_denied`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgRequest" }
      responses:
        "201":
          description: The Checkout URL to send the user to (no `org`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: getOrg
      summary: An org you belong to, with its limits and this month's usage.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "`usage` is the org's usage this calendar month (UTC) as the hourly rating priced it at the server's prices: running time by sandbox size, the allocated disk of each paid sandbox and egress beyond the plan's free egress, up to `usage.ratedUntil`; `usage.costUSD` is the month's cost in USD, `usage.creditsUSD` the credit balance. `GET /v1/usage` reports the same as `cost`. API keys: any scope."
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [ orgs ]
      operationId: updateOrg
      summary: Rename an org. The owner and admins.
      description: "Writes `org.rename` to the audit log. The workspace's own API key: `workspace:admin`."
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgRequest" }
      responses:
        "200":
          description: The org.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ orgs ]
      operationId: deleteOrg
      summary: Delete a workspace. The owner, naming it; signed-in sessions only.
      description: >-
        What the workspace owes is paid first, with its card on file: its open invoices, then, once its plan has ended at once (the rest of the month is not refunded), the final invoice for its usage beyond the allowance. A charge that does not succeed refuses the deletion (`402 payment_failed`, naming the invoices to pay on the billing portal); if it was the final invoice, the workspace stays disabled (`disabledAt`) until it is paid and deleted again, or its data is deleted 30 days later. Then every member is removed, its SSH grants and secrets revoked, and its sandboxes and snapshots deleted within minutes. Credits left are not refunded. A personal org is not deleted (`400`); an enterprise workspace is deleted by support (`409`). Writes `org.delete` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteOrgRequest" }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/billing:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    patch:
      tags: [ orgs ]
      operationId: updateOrgBilling
      summary: Set a paid org's spend cap. The owner and admins; signed-in sessions only.
      description: >-
        `spendCapUSD` caps this month's usage beyond the org's allowance: once reached, the org's sandboxes are stopped (`trigger: spend_cap`) and cannot run until next month (UTC), a higher cap or no cap (`402 spend_limit_reached`). 0 allows nothing beyond the allowance; -1 clears the cap. A free org has its monthly credit instead (`400`). Writes `org.spend_cap` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgBillingRequest" }
      responses:
        "200":
          description: The org, with its limits and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/billing/checkout:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: checkoutOrg
      summary: Put an org on a paid plan, its credits first and a card for the rest. The owner; signed-in sessions only.
      description: >-
        A free org upgrading to `pro` or `team` (it keeps its sandboxes and members), or an org whose plan ended (`tier` absent: its own). A free workspace with no `tier` saves a card instead: a Checkout Session in setup mode, nothing charged; a free personal org with no `tier` is `400`. A paid personal org still takes no members. The org's credits pay first (docs/pricing.md, "Credits"): when they cover the rest of this month the org is on the plan at once with no card (`url` empty); with a card on file a Stripe subscription starts at once, the credits applied to its first invoice (`url` empty); otherwise a Checkout Session whose first invoice a coupon discounts by the credits (`url` to open). An org on a plan paid from its credits adds a card with no `tier`: a Checkout Session charging nothing now (`400` with another tier). `409` when the org has a card subscription (change its plan instead). Without server.json `stripe`, `503`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: The Checkout URL to send the user to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/billing/portal:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: orgBillingPortal
      summary: Open the Stripe customer portal (invoices, the card). The owner and admins; signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The portal URL to send the user to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/billing/plan:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: changeOrgPlan
      summary: Move a subscribed org between the paid plans. The owner; signed-in sessions only.
      description: >-
        Up (`pro` to `team`): at once, charging the prorated difference for the rest of the month, which also grows the month's allowance; if that charge does not succeed the plan is unchanged (`402 payment_failed`). Down: at the next renewal (`billing.scheduledTier` until then); asking for the current plan again takes a scheduled downgrade back. To leave the paid plans, cancel the subscription.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePlanRequest" }
      responses:
        "200":
          description: The org, with its billing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/billing/credits/subscribe:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: subscribeOrgWithCredits
      summary: Put an org on a paid plan paid from its credits. The owner; signed-in sessions only.
      description: >-
        Credits an admin granted (docs/pricing.md, "Credits") pay the plan: the rest of this month now (prorated to the second, like Stripe), then each month on the 1st, after last month's usage beyond the allowance; when they no longer cover the fee the plan ends (a personal org returns to Free, any other becomes unusable). Needs no Stripe. `402 credit_exhausted` when the credits do not cover the rest of this month; `409` with a subscription already; `402 payment_failed` with an unpaid invoice. Writes `org.credits.subscribe` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeWithCreditsRequest" }
      responses:
        "200":
          description: The org, with its billing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orgs/{id}/billing/subscription:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    delete:
      tags: [ orgs ]
      operationId: cancelOrgSubscription
      summary: End the org's subscription at the end of the current period. The owner; signed-in sessions only.
      description: >-
        The plan stays until `billing.periodEnd`. Then a personal org returns to the free tier (members removed; sandboxes over the free tier's count or size suspended), any other org becomes unusable (`disabledAt`) and its sandboxes and snapshots are deleted 30 days later unless it subscribes again.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The org, with its billing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/billing/subscription/resume:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: resumeOrgSubscription
      summary: Take back a cancellation before the period ends. The owner; signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The org, with its billing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/stripe/webhook:
    post:
      tags: [ orgs ]
      operationId: stripeWebhook
      summary: Stripe's webhook endpoint (not for clients).
      description: >-
        Verified by the `Stripe-Signature` header against server.json `stripe.webhookSecretFile`. Handles `checkout.session.completed`, `invoice.created`, `invoice.paid`, `invoice.payment_failed`, `customer.subscription.updated` and `customer.subscription.deleted` (docs/pricing.md); an event is handled once.
      security: []
      responses:
        "200": { description: "Handled, or handled before." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/github/webhook:
    post:
      tags: [ orgs ]
      operationId: githubWebhook
      summary: The instabox GitHub App's webhook endpoint (not for clients).
      description: >-
        Verified by the `X-Hub-Signature-256` header against server.json `githubApp.webhookSecretFile`. `installation` and `installation_target` events record the App's installs (created, renamed, suspended, deleted). A `workflow_job` event whose labels include `instabox-small`, `instabox-medium`, `instabox-large`, `instabox-xlarge` or `instabox-2xlarge` (any other `instabox` or `instabox-*` label is refused, and so is a size the org's plan does not offer; `SIZE-snapshot-<snapshot>` as the whole runs-on, e.g. `instabox-medium-snapshot-acme-warm`, starts the box from that snapshot instead, one of a `ci` machine in the linked org, only in a private repository that runs no workflows of pull requests from forks), from a repository whose owner's install is linked to an org (by the App's OAuth callback, `/auth/github-app/callback`, docs/ci-runner.md): `queued` records the job once per job ID and, in the background, creates a CI box for it (template `ci`, the label's size, deleted after 6 hours at most) with a just-in-time runner that takes that job only; `completed` deletes the box. A start over the plan's limits waits and is retried. Each job's state and reason: `GET /v1/orgs/{id}/github/jobs`.
      security: []
      responses:
        "204": { description: "Recorded, or not a job for instabox, or another event." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/orgs/{id}/github/jobs:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: listGitHubJobs
      summary: The org's GitHub Actions jobs run in CI boxes, with why a job waits or did not start.
      description: >-
        Newest first, a page at a time (by default the latest 50 of every state); `hasMore` says more of the `state` group asked for follow, and `counts` has every group's total. A job's `state`: `waiting` (over the plan's limits or retrying; `reason` says why), `starting`, `started`, `completed`, `refused` (more than one size label, a size the plan does not offer, personal accounts off on the site) or `failed` (`reason`). Any member of the org.
      parameters:
        - name: state
          in: query
          description: >-
            The jobs of one state group: `running` (`starting` or `started`), `waiting`, `succeeded` (`completed` with conclusion `success`) or `failed` (`completed` with conclusion `failure` or `timed_out`, `refused` or `failed`; `cancelled` and `skipped` are not failures).
          schema: { type: string, enum: [ all, running, waiting, succeeded, failed ], default: all }
        - { name: limit, in: query, description: Page size., schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: from, in: query, description: "Only the jobs queued at or after this time (RFC 3339); `counts` follow it.", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Only the jobs queued before this time (RFC 3339), after `from`; `counts` follow it.", schema: { type: string, format: date-time } }
        - { name: offset, in: query, description: Jobs of the group to skip., schema: { type: integer, minimum: 0, maximum: 1073741824, default: 0 } }
      responses:
        "200":
          description: The jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubJobList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/github/jobs/{job}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: job, in: path, required: true, description: "GitHub's job ID.", schema: { type: integer, format: int64 } }
    get:
      tags: [ orgs ]
      operationId: getGitHubJob
      summary: One of the org's GitHub Actions jobs, with where its wait went and its branch, commit and failed step.
      description: >-
        The job, when its own CI box was created and started running, the machine of its size, and from GitHub its run's branch and commit and the first step that failed (left out when GitHub does not answer). The log stays on GitHub. Any member of the org.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubJobDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/github/stats:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: getGitHubJobStats
      summary: The org's GitHub Actions jobs of the last 7 days, today included, or of a time range, for the CI page.
      description: >-
        How many jobs were queued, ran to their end on a CI box and passed; how long they waited from queued to a runner taking them (median and p90, and the median of each part of the wait); each day's jobs, or with step each step's; each size's jobs and waits. With from or to (and step, which they need), only the jobs queued in that range, as for the jobs list. Any member of the org.
      parameters:
        - { name: tz, in: query, description: "The IANA time zone days are counted in, such as America/Los_Angeles.", schema: { type: string, default: UTC } }
        - { name: from, in: query, description: "Only jobs queued at or after this time (RFC 3339); needs step.", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Only jobs queued before this time (RFC 3339); after from, and needs step.", schema: { type: string, format: date-time } }
        - { name: step, in: query, description: "Count the jobs in buckets of this many seconds from from (needed) to to or now, at most 1000 buckets; perDay is then empty. A day (86400) counts the days of tz from from's midnight, each a day also when the clocks change. Needed with from or to: without it the days are the last 7.", schema: { type: integer, minimum: 60 } }
      responses:
        "200":
          description: The stats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubJobStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/github/installations:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: listGitHubInstallations
      summary: The instabox GitHub App installs linked to an org. The owner and admins; signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The linked installs, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/github/installations/{installationId}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: installationId, in: path, required: true, description: "GitHub's installation ID (the `id` of an install in the list above).", schema: { type: integer, format: int64 } }
    delete:
      tags: [ orgs ]
      operationId: unlinkGitHubInstallation
      summary: Unlink an install of the GitHub App from an org; its jobs then start no boxes. The App stays installed on GitHub, so Connect GitHub can link it again, here or in another workspace. The owner and admins; signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "204": { description: Unlinked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/members:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: listOrgMembers
      summary: The members of an org you belong to, the owner first.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Every member uses the org's sandboxes; the owner and admins manage members and invites; the owner never changes. API keys: any scope."
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMemberList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/members/{userId}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: userId, in: path, required: true, description: The member's user ID., schema: { type: integer, format: int64 } }
    patch:
      tags: [ orgs ]
      operationId: updateOrgMember
      summary: Change a member's role. The owner and admins.
      description: >-
        Between `admin` and `member`. An org's owner never changes: changing the owner's role is `409 operation_conflict`. Writes `org.member.role` to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgMemberRequest" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [ orgs ]
      operationId: removeOrgMember
      summary: Remove a member, or leave (your own user ID).
      description: >-
        The owner and admins remove members; any member but the owner may leave. The owner cannot leave or be removed (`409 operation_conflict`). The SSH certificates and tokens the member made for the org's sandboxes are revoked, and their open SSH sessions, terminals, desktops and Orca tunnels there closed. Writes `org.member.remove` to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orgs/{id}/invites:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: listOrgInvites
      summary: An org's invites, newest first. The owner and admins.
      description: "The workspace's own API key: `workspace:admin`."
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The invites; their codes are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInviteList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ orgs ]
      operationId: createOrgInvite
      summary: Email an invite to join the org. The owner and admins.
      description: >-
        Emails `email` a link that joins the org (`/dashboard/invitations/accept`); only an account with that email can redeem it, and it expires in 7 days. A personal org takes no members (`400 bad_request`). A member with that email, or an open invite for it, is `409 operation_conflict` (resend that invite). One account emails at most 100 invites a day (`429 quota_exceeded`). The server without email configured is `503`; an email that could not be sent is `502`, and no invite is left behind. Writes `org.invite.create` to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrgInviteRequest" }
      responses:
        "201":
          description: The invite, emailed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "502": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Internal" }
  /v1/orgs/{id}/invite-code:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ orgs ]
      operationId: getOrgInviteCode
      summary: A paid org's invite code for people outside it. The owner and admins.
      description: >-
        A user invite code (docs/invites.md, "A paid workspace's code") that lets people past the invite gate into accounts of their own: they do not join the workspace. It is made on the first call while the workspace is on a paid plan, with no expiry. With the workspace's earlier codes it lets in the plan's server.json `plans.<tier>.inviteCodeUses` people (pro 5, builder 5, team 20), shown as `maxUses` beside `useCount`. A move to a larger plan raises them, never lowers them, and the code stays valid once the plan ends. A code an admin revoked is shown as `revoked`; after an admin deleted the current code, the next call makes a fresh one sized for the plan the workspace is on then, less what earlier codes let in (`409 operation_conflict` when nothing is left). `redeemers` covers every code the workspace had. A paid personal org has one too, though it takes no members. An org that has no code and no paid plan gets `402 subscription_required`. Making it writes `invite.create` (with `org_id`) to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The workspace's code and who joined with it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInviteCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orgs/{id}/invite-code/regenerate:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: regenerateOrgInviteCode
      summary: Replace a paid workspace's invite code. The owner and admins.
      description: >-
        For a leaked code: the live code is revoked at once and a new one gets the uses it had left, so the workspace's total stays the same (docs/invites.md, "A paid workspace's code"). `409 operation_conflict` when the workspace has no code yet, an admin revoked it, or it is used up. Writes `invite.revoke` (`replacedBy`) and `invite.create` (`replaces`) to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The new code, and who joined with any of the workspace's codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInviteCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orgs/{id}/invites/{inviteId}/resend:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: inviteId, in: path, required: true, description: Invite ID (oi_...)., schema: { type: string } }
    post:
      tags: [ orgs ]
      operationId: resendOrgInvite
      summary: Email an open invite again. The owner and admins.
      description: >-
        Revokes the invite and emails a new one, valid for 7 days, to the same address from the caller; the old link stops working only once the new email is out. An invite that is not open, or has no email (a legacy code), is `404 not_found`. Writes `org.invite.create` to the audit log. The workspace's own API key: `workspace:admin`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The new invite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "502": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Internal" }
  /v1/orgs/{id}/invites/{inviteId}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: inviteId, in: path, required: true, description: Invite ID (oi_...)., schema: { type: string } }
    delete:
      tags: [ orgs ]
      operationId: revokeOrgInvite
      summary: Revoke an unredeemed invite. The owner and admins.
      description: "The workspace's own API key: `workspace:admin`."
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
          description: The revoked invite.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/keys:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
    get:
      tags: [ keys ]
      operationId: listWorkspaceAPIKeys
      summary: An org's API keys (expired ones included, revoked ones not). The owner and admins (a personal org's owner); signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Keys, newest first, each with the member who made it. Secrets are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ keys ]
      operationId: createWorkspaceAPIKey
      summary: Create an API key of an org. The owner and admins (a personal org's owner); signed-in sessions only.
      description: |
        Every API key belongs to one org and reaches no other. A workspace's key
        acts as an admin of the workspace: with `scopes` absent or `workspace:admin`
        it manages it, with `APIKeyScope`s it is limited to them. A personal org's
        key (`key_...`) acts as its owner and needs `APIKeyScope`s.
        The reply holds the secret (`key`), shown only here. At most 20 active keys
        per org (`429 quota_exceeded`). Writes `org.key.create` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceAPIKeyRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/orgs/{id}/keys/{keyId}:
    parameters:
      - { name: id, in: path, required: true, description: Org ID (org_...)., schema: { type: string } }
      - { name: keyId, in: path, required: true, schema: { type: string, pattern: "^w?key_[a-z2-7]{26}$" } }
    delete:
      tags: [ keys ]
      operationId: revokeWorkspaceAPIKey
      summary: Revoke an org's API key. The owner and admins (a personal org's owner); signed-in sessions only.
      description: Requests with the key then fail with `401 revoked_key`; SSH certificates the key issued are revoked too. Repeating it returns 404. Writes `org.key.revoke` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/org-invites/redeem:
    post:
      tags: [ orgs ]
      operationId: redeemOrgInvite
      summary: Join an org with an invite code. Signed-in sessions only.
      description: >-
        An unknown, used, revoked or expired code is `400 bad_request`; an invite emailed to another address than the account's is `403 invite_email_mismatch`; already being a member is `409 operation_conflict` (the code stays unused). Open to an account the invite gate holds: an emailed invite activates it (within the per-network activation limit, `429 quota_exceeded`, and the region block, `403 permission_denied`), while a code with no recipient needs the account activated (`403 invite_required`). Writes `org.invite.redeem` to the audit log.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemOrgInviteRequest" }
      responses:
        "200":
          description: The org joined, with your role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/machines/{id}/metrics:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ usage ]
      operationId: getMachineMetrics
      summary: The sandbox's recent CPU, memory, network and disk I/O, one sample per 30 seconds.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Samples from `since` (default: 5 minutes ago, at most 24 hours ago) to now, oldest first. One sample per 30 seconds for the times the sandbox was running in that window; none for the times it was paused or stopped, so a sandbox that did not run in the window gets an empty list. API keys: needs the scope `machines:read`."
      parameters:
        - name: since
          in: query
          required: false
          description: RFC 3339 time, in the last 24 hours.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The samples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineMetrics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/MetricsUnavailable" }
  /v1/machines/{id}/disk:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: getMachineDisk
      summary: How full the running sandbox's disks are (/data and /), with a near-full warning.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Read inside the sandbox now (`df` as its user, over the same path as exec): used, available and size in bytes and the inode use of `/data` (the disk, what `PATCH /v1/machines/{id}` with `persistentDiskGiB` grows) and `/` (the root filesystem). Each filesystem has a level: `ok` below 80%, `high` from 80%, `critical` from 90%, `full` at 100% or with no inodes left; `warning` is set from 90%. It never wakes a paused sandbox and does not count as activity: a sandbox that is not running is a 409 `machine_not_running`. API keys: needs the scope `machines:read`."
      responses:
        "200":
          description: The filesystems.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineDisk" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/oom/claim:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ connections ]
      operationId: claimOOMKill
      summary: The OOM kill of a background job's processes (instabox jobs wait).
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Reads the running sandbox's kernel OOM kills now and returns, as `oomKill`, the newest one whose victim was in `cgroup` (a background job's cgroup: the session scope of the exec that started it, `/user.slice/user-<uid>.slice/session-<n>.scope`), claimed for that cgroup: no exec or other job reports it, and the same cgroup gets it again. `oomKill` is absent when the sandbox names no such kill (none, its record left the kernel log, or a guest agent that predates victims' cgroups). Only kills of `bootId`, the boot the job ran in, are returned (scope names repeat after a restart). A cgroup that is not a session scope, or no `bootId`, is a 400; a sandbox that is not running is a 409 `machine_not_running`. A claim counts toward the concurrent exec limit: a 429 `quota_exceeded` (retryable) when the user's execs are all in use. API keys: needs one of the scopes `machines:write`, `machines:exec`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OOMClaimRequest" }
      responses:
        "200":
          description: The kill, if any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OOMClaim" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/machines/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ machines ]
      operationId: getMachineLogs
      summary: The sandbox's console log and recent operations, to see why it did not boot or is unreachable.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        `console` is the end of the sandbox's serial console: kernel and systemd boot messages, anything written to /dev/console, and errors from the VM monitor. It is kept on the sandbox's host across stops, pauses and restarts, to the last 8 MiB. `operations` are its last 20 operations (create, start, stop, pause, resume and delete, with their errors), oldest first. Reading the log never wakes the sandbox, and it works in every state. When the console cannot be read (the sandbox's disks are in storage, or its host is not answering), the response is still 200 with `consoleUnavailable` and the operations. To follow the log, pass the response's `cursor` as `after` on the next request: you get only the output written since (`instabox logs --follow`). Commands' own output is not here: it is kept with each background job, and the guest's full journal is `journalctl -b` over exec. API keys: needs the scope `machines:read`, so a read-only key can read the console output (the kernel command line and console carry no credentials; Secrets go through the secret proxy).
      parameters:
        - name: tail
          in: query
          required: false
          description: "Lines of console output to return (default 200, at most 5000), fewer when the lines are long (see `consoleTruncated`). Ignored with `after`."
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: after
          in: query
          required: false
          description: "A `cursor` from a previous response: return only the console output written since (up to 1 MiB)."
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: The log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineLogs" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ usage ]
      operationId: getMachineUsage
      summary: What the sandbox used over a window, for billing.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "Running time (not paused or stopped) and its vCPU and memory seconds, and disk GiB-seconds over the time the sandbox existed. Default window: the start of the current calendar month (UTC) to now; at most 366 days. Running time is recorded from the release that added this route on. A deleted sandbox's usage is still readable by ID, by the account that created it (not after the account is deleted and signed up again). API keys: needs the scope `machines:read`."
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Operation ID (`op_…`).
        schema: { type: string }
    get:
      tags: [ operations ]
      operationId: getOperation
      summary: Get an operation (the progress of a sandbox change).
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        API keys: needs one of the scopes `machines:read`, `images:read`.


        With `wait`, a long poll: the response comes as soon as the operation is `succeeded` or `failed`, or its `state` or `phase` differs from what it was when the request arrived, or when the wait ends, whichever is first; it is always the operation as it is then. Loop on it instead of polling at an interval. A done operation answers at once.
      parameters:
        - name: wait
          in: query
          required: false
          description: >-
            Long-poll for up to this long: a duration such as `25s` or `500ms`, or whole seconds (`25`). Capped at 30s; absent or `0` answers at once.
          schema: { type: string, example: 25s }
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/connection-info:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      tags: [ connections ]
      operationId: getConnectionInfo
      summary: How to reach the sandbox over SSH. No side effects.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "API keys: needs one of the scopes `machines:read`, `machines:ssh`."
      responses:
        "200":
          description: Connection info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/connections:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ connections ]
      operationId: createConnection
      summary: Issue a short-lived SSH user certificate for the sandbox.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: "The sandbox must be `running`, else `409 machine_not_running`. The certificate's principal is the sandbox ID and its key ID is the connection ID. API keys: needs one of the scopes `machines:write`, `machines:ssh` (legacy)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConnectionRequest" }
      responses:
        "201":
          description: Certificate issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/ports:
    get:
      operationId: listAllPublicPorts
      summary: List the public ports of all your sandboxes.
      description: API keys require `machines:read`. Deleted sandboxes' ports are not listed.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "200":
          description: Public ports, by sandbox (oldest first) and port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPortList" }
  /v1/machines/{id}/ports:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    get:
      operationId: listPublicPorts
      summary: List a sandbox's public ports.
      description: API keys require `machines:read`. Also accepts the sandbox-local port credential.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] }, { portAgent: [] } ]
      responses:
        "200":
          description: Public ports and server availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPortList" }
    post:
      operationId: publishPort
      summary: Give one HTTP port of a sandbox an HTTPS URL, public or private.
      description: |
        API keys require `machines:write`. Also accepts the sandbox-local port credential.
        With `access` omitted or `public`, anyone with the returned URL can reach the whole
        service on that port. With `access: private` the URL answers only requests that carry
        the port's token: the `tokenUrl` of this response (the URL with `?_token=`, which a
        browser opens once; the proxy redirects it to the URL without the token and sets the
        `__Host-instabox_port_auth` cookie), that cookie, or `Authorization: Bearer <token>`.
        Other requests get 401 (403 for a wrong `_token`) without waking the sandbox. The
        token is returned only by the publish that created or rotated it; the server keeps
        its hash. The URL stays until the port is unpublished and answers only while the
        sandbox runs; stopped or paused, it returns 503. Publishing a published port again
        keeps its URL and sets its name when given; `access` changes who can reach it and
        `rotateToken` (private ports) replaces the token, both closing the connections that
        used the old access, like an unpublish. Publishing does not start a server on the
        port. At most 16 ports per sandbox.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] }, { portAgent: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishPortRequest" }
      responses:
        "200":
          description: The port was already published; its name, access or token is updated when asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPort" }
        "201":
          description: Port published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPort" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { description: The sandbox already has 16 published ports. }
        "503":
          description: |
            Public ports are not configured; or `private_ports_unavailable` (retryable): a
            public-port proxy still runs a release without private ports, so a private
            publication, a switch to private or a rotation waits for the rollout to complete.
  /v1/machines/{id}/ports/{port}:
    parameters:
      - $ref: "#/components/parameters/MachineID"
      - name: port
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: unpublishPort
      summary: Remove a port's public URL and close its active connections.
      description: API keys require `machines:write`. Also accepts the sandbox-local port credential.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] }, { portAgent: [] } ]
      responses:
        "204": { description: Port unpublished. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/port-agent:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      operationId: installPortAgent
      summary: Install instabox-port in a running sandbox and rotate its credential.
      description: API keys require `machines:write`. The installed credential manages only this sandbox's public ports.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "204": { description: Command and sandbox-local credential installed. }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Public ports are not configured. }
  /v1/orgs/{id}/secrets:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Organization ID. The caller must be a member.
    get:
      tags: [ secrets ]
      operationId: listSecrets
      summary: List an org's Secret metadata, never values.
      description: API keys require `machines:read`. All org members can list metadata. 404 if Secrets are unavailable.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "200":
          description: Secrets ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/secrets/{name}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Organization ID.
      - name: name
        in: path
        required: true
        schema: { $ref: "#/components/schemas/SecretName" }
    put:
      tags: [ secrets ]
      operationId: putSecret
      summary: Create or replace an org Secret.
      description: |
        The org's owner or admin only; of API keys, only the workspace's own key
        can manage values or modes (`workspace:admin`), never a personal org's key.
        Send the value and explicit delivery mode on every replacement. The ID
        stays stable and the version increases. Proxy delivery without hosts
        allows every public HTTPS destination (`["*"]`); env delivery accepts no
        host restriction. A mode change removes
        incompatible grants and never converts proxy access into env access.
        Names omitted from a request remain unchanged. No Idempotency-Key is
        required. Quotas apply to the total items and raw value bytes per org.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutSecretRequest" }
      responses:
        "200":
          description: Replaced; reconciliation is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "201":
          description: Created; reconciliation is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
    delete:
      tags: [ secrets ]
      operationId: deleteSecret
      summary: Delete an org Secret and its explicit sandbox grants.
      description: |
        The org's owner or admin only; of API keys, only the workspace's own key
        (`workspace:admin`), never a personal org's key. No Idempotency-Key required. Proxy
        revocation is pending until acknowledgement or lease expiry (at most
        60 seconds); already admitted requests may finish. Env copies in
        processes, files, or snapshots cannot be erased by this operation.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "204": { description: Deleted; runtime reconciliation is pending. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orgs/{id}/secrets/import:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Organization ID.
    post:
      tags: [ secrets ]
      operationId: importSecrets
      summary: Atomically create or replace a batch of org Secrets.
      description: |
        The org's owner or admin only; of API keys, only the workspace's own key
        (`workspace:admin`), never a personal org's key. All entries use the explicit delivery
        mode and host scope. Validation or quota failure changes nothing. Final
        quotas include unchanged Secrets. Replacements retain IDs; incompatible
        grants are removed on mode changes. This does not select env Secrets
        for any sandbox. No Idempotency-Key required. Values are never returned.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportSecretsRequest" }
      responses:
        "200":
          description: Metadata of the imported Secrets, ordered by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/orgs/{id}/exports:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Organization ID. The caller must be a member.
    get:
      tags: [ exports ]
      operationId: listExports
      summary: List what you can export from a workspace.
      description: >-
        API keys: `machines:write` (or the legacy `machines:exec`), a key of this org (a workspace key is its admin). The owner and admins see every sandbox with a saved disk and every snapshot that saved `/data`; a member sees the ones they own. Each comes with its newest export that has not expired.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "200":
          description: The sources, sandboxes first, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ exports ]
      operationId: createExport
      summary: Export a sandbox's or a snapshot's /data.
      description: |
        API keys: `machines:write` (or the legacy `machines:exec`), a key of this org (a workspace key is its admin).
        Only while the workspace is paused for a failed payment or disabled (its subscription ended), until its data is deleted (`Org.purgeAt`);
        an active workspace answers `409 operation_conflict`. The owner and admins export any sandbox or snapshot of
        the workspace, a member the ones they own. The server builds a `.tar.gz` of the disk from its saved copy,
        with no sandbox started. A source with a queued, building or ready export returns that export (200);
        otherwise a new one is queued (202). Poll `GET /v1/exports/{id}` until it is `ready`.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportRequest" }
      responses:
        "200":
          description: The source's open export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "202":
          description: A new export, queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/exports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ exports ]
      operationId: getExport
      summary: Get an export.
      description: >-
        API keys: `machines:write` (or the legacy `machines:exec`). The workspace's owner and admins, or the member who owns its source; 404 for anyone else.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/exports/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ exports ]
      operationId: downloadExport
      summary: Download a ready export.
      description: >-
        API keys: `machines:write` (or the legacy `machines:exec`). The same people as `GET /v1/exports/{id}`. Streams the `.tar.gz` (`Content-Disposition` names it). `Range: bytes=N-` resumes a download (206), and `If-Range` takes the ETag, the archive's SHA-256. A queued, building, failed or expired export answers `409 operation_conflict`.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
      responses:
        "200":
          description: The whole archive.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "206":
          description: The archive from the requested range on.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orgs/{id}/webhooks:
