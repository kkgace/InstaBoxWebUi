        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ webhooks ]
      operationId: createWebhook
      summary: Register a webhook endpoint.
      description: |
        API keys: `machines:write`, a key of this org (a workspace key is its admin).
        The org's owner or admin only. The URL must be https and public
