        API keys: `machines:write`, a key of this org (a workspace key is its admin). Absent fields are kept; `events` replaces the event types. Enabling an endpoint the server disabled (`disabledReason` failing) also clears its failure streak.
      security: [ { bearerAuth: [] }, { apiKey: [] }, { sessionCookie: [] } ]
