      description: A token's login is returned only as `SSHTokenInfo.host` describes. History is kept for 30 days after the token's original expiry. Effective expiry includes the issuing API key's expiry. API keys require `machines:read`.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      responses:
        "200":
