      description: >-
        Streams the file at `path` of a running sandbox as `application/octet-stream` with its exact `Content-Length`, any size, read as root when the sandbox's sudo allows it, as its user otherwise (like the listing). The resolved path and octal mode are in the `X-Instabox-File-Path` (percent-encoded) and `X-Instabox-File-Mode` headers. A missing file is 404 `not_found`, a directory 409 `not_a_file`, an unreadable file 403 `permission_denied`; non-running sandboxes return 409 `machine_not_running`. A download that moves no bytes for 60 seconds is dropped, and any download is cut off after 2 hours. It counts toward the per-user limit of requests at once (free plan 32; Pro 64; Builder, Team and Enterprise 256). API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
