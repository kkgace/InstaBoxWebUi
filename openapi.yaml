    post:
      tags: [ machines ]
      operationId: forkMachine
      summary: Create a copy of a sandbox on its host, without a snapshot.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: >-
        Creates a new sandbox with copies of a running or stopped sandbox's system files and storage (`/data`, HOME included). The node-agent clones the disks copy-on-write on the source's host (a running source's files are frozen for a moment, as for a live snapshot) and cold boots the copy: no snapshot is saved, uploaded or downloaded, and none counts toward the snapshot limit. Memory and running programs are not copied. `{id}` is the source's ID or name. The answer is the create operation (`machineId` is the new sandbox); the fork is a create for every limit (starts a minute, concurrency, storage). It carries metadata `instabox-fork-of` = the source's ID. It keeps the source's idle auto-suspend, max run, metadata and delete deadline (the same instant) unless the request sets `autoSuspendAfterSeconds`, `maxRunMinutes`, `metadata` or `deleteAfterSeconds`; inherited values are checked against the plan exactly as a create's, and a refusal of one says it came from the source. It takes the source's org Secrets selection (proxy and direct references, by name; values are resolved again for the fork) unless the request names its own `secrets`, `envSecrets` or `directSecrets`. `409 fork_unavailable` (nothing created): the source is suspended or has no host, or its host cannot fork; save a snapshot and create from it instead. A fork is made only on its source's host: when that host is under maintenance or full, the request (or the operation) is `409 fork_unavailable`, retryable with Retry-After, `reason` `source_host_unavailable` or `source_host_full`; stop and start the source to move it, or save a snapshot and create from it. A source stopped moments ago may still be uploading its disks in the background: the request waits for that upload (as snapshot save does); one still running after that is `409 operation_conflict`, retryable, with Retry-After (nothing created). The same conflict fails the operation when the source's host is still busy with it when the fork is copied; that fork is then deleted. API keys: needs one of the scopes `machines:write`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkMachineRequest" }
      responses:
