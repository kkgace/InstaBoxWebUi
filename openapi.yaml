      description: >-
        Replaces the sandbox's root disk and `/data` with snapshot `snapshotId`'s (absent: the snapshot the sandbox was created from, else `400`). The sandbox keeps its ID, name, hostname, public port URLs and SSH configuration; everything on its disks since the snapshot is gone, including running programs. Its SSH host keys are new afterwards. The reply is a `restore` operation: a running sandbox is stopped first, the snapshot's disks are put on its host, and it boots them unless `desiredState` is `stopped`. Works on a running, stopped, paused or failed sandbox; `409 operation_conflict` while another operation runs, while a stopped sandbox's last changes are still uploading (retry). A snapshot in another host pool is refused (`409 spec_not_allowed`), as is one saved root-only, or whose `/data` is larger than the sandbox's disk (`400`, `409 spec_not_allowed`: grow the disk first). Booting the restored sandbox counts as a start for the plan's start limit and needs what a start needs (`402`, `429`). A server whose operator has not turned restores on yet answers `400 feature_disabled`; a sandbox whose host runs a node-agent that cannot restore in place `409 restore_unavailable` (nothing changed). API keys: needs one of the scopes `machines:write`.
      parameters:
