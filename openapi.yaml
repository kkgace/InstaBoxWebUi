        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/exec:
    parameters:
      - $ref: "#/components/parameters/MachineRef"
    post:
      tags: [ connections ]
      operationId: execCommand
      summary: Run a command in the sandbox and return its output.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: |
        Runs `cmd` with `bash -lc` as the sandbox's login user (`dev`, HOME
        `/data/home`, the user SSH sessions get), after exporting `envs` and
        changing to `cwd` (default HOME, even if the profile changes directory;
        a `cwd` that does not exist makes the command fail with exit code 1). `stdin` is fed to the command, then EOF:
        UTF-8 text of at most 1 MiB (1048576 bytes, not characters); bytes that
        are not UTF-8 become U+FFFD, so base64-encode binary input or write it
        with `PUT /v1/machines/{id}/files` first (see `ExecRequest.stdin`).

        Instead of `cmd`, send `argv` (a program and its arguments) to run
        it with no shell: `{"argv": ["printf", "%s|", "a b", "$X"]}` prints
        `a b|$X|`. The login profile, `envs` and `cwd` apply the same way;
        only the parsing of the command differs. Set exactly one of `cmd`
        and `argv`.

        The request blocks until the command exits or `timeoutSeconds` passes.
        On timeout the command's process group is killed (SIGKILL) and the
        result has `timedOut: true` and `exitCode: 124` (also when the sandbox
        did not start the command in time). A command killed by a signal has
        `signal` set and `exitCode` 128+N for standard signal N, otherwise
        255. A non-zero exit code is a `200` result,
        not an error. The request returns when the command exits, even if
        a process it started in the background keeps its stdout or stderr
        open: that process keeps running, output it writes later than about
        a second after the exit is not returned, and its later writes to
        that output fail with a broken pipe, so redirect a server's stdout
        and stderr to a file (`nohup server >log 2>&1 &`). stdout and stderr
        keep their first 1 MiB each (`truncated: true` when either was cut);
        invalid UTF-8 is replaced with U+FFFD (`invalidUtf8: true`), so binary
        output is not byte-exact: read files with
        `GET /v1/machines/{id}/files/content`.

        The sandbox must be `running` (`409 machine_not_running`). At most 32
        requests run at once per user on the free plan, per workspace for a
        workspace's API keys (Pro 64; Builder, Team
        and Enterprise 256), across all your sandboxes. Commands,
        file reads, desktop, port-forward and Secret refresh calls share this
        limit. A background command counts only while it starts. More get a
        retryable `429 quota_exceeded` (server config `limits.maxExecsPerUser`,
        `plans.<tier>.maxExecs` and `limits.maxExecsPerOrg`,
        not reported by `GET /v1/usage`). If the sandbox cannot be reached,
        `503 host_unavailable`; when the connection is lost after the command
        started it is not `retryable`, since the command may have run (it is
        killed, not left running). An API server that restarts mid-command
        kills it and answers a `retryable` `503 host_unavailable` ("the API
        server restarted before the command finished").
        Not idempotent: no Idempotency-Key, and a retry runs the command again.
        API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).

        Streaming: send `Accept: text/event-stream` to get the output as the
        command writes it, as server-sent events: a `stdout` or `stderr`
        event (data: `ExecOutput`) for each chunk, a `: ping` comment every
        15 s while the command is quiet, then one `exit` event (data: the
        `ExecResult`, with empty `stdout` and `stderr` and never
        `truncated`: streamed output is not capped) or `error` event (data:
        an `ErrorBody`, e.g. `host_unavailable` when the connection to the
        sandbox was lost). Errors found before the command starts (`400`,
        `404`, `409`, `429`, a `503` dial failure) are plain JSON responses.
        Closing the stream kills the command. Timeouts are the same as
        without streaming; for a command longer than 10 minutes start it
        in the background (`instabox exec --background`) and follow its log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: The command ran (whatever its exit code).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResult" }
            text/event-stream:
              schema:
                type: string
                description: "Server-sent events: `stdout`/`stderr` (`ExecOutput`), then `exit` (`ExecResult`) or `error` (`ErrorBody`)."
                example: "event: stdout

                  data: {\"data\":\"line 1\\n\"}


                  event: exit

                  data: {\"stdout\":\"\",\"stderr\":\"\",\"exitCode\":0,\"timedOut\":false,\"truncated\":false}

                  \n"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/machines/{id}/history:
    parameters:
      - $ref: "#/components/parameters/MachineRef"
    get:
      tags: [ connections ]
      operationId: listExecHistory
      summary: The commands run in the sandbox through exec, newest first.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: |
        Every `POST /v1/machines/{id}/exec` that reached the sandbox (by any
        account or tool; `noHistory` requests excepted) is recorded with
        its exit code and the first 64 KiB of each output stream, so the
        history answers while the sandbox runs, after it stopped or paused,
        and across restarts; it is deleted with the sandbox. The server
        keeps the newest 200 commands per sandbox. `limit` (default 50, at
        most 200) and `cursor` (a previous page's `nextCursor`) page
        through them. The output itself is in
        `GET /v1/machines/{id}/history/{execId}`.
        API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 }, description: Default 50. }
        - { name: cursor, in: query, schema: { type: string }, description: The previous page's nextCursor. }
      responses:
        "200":
          description: A page of commands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/history/{execId}:
    parameters:
      - $ref: "#/components/parameters/MachineRef"
      - name: execId
        in: path
        required: true
        description: "A command ID (`ex_…`) from the history, or `latest` for the newest command."
        schema: { type: string }
    get:
      tags: [ connections ]
      operationId: getExecHistoryEntry
      summary: One past command with its stored output.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: |
        The command's record with `stdout` and `stderr` as stored: the first
        64 KiB of each (`outputTruncated` when cut), invalid UTF-8 replaced
        with U+FFFD as in the exec's result. Works whatever the sandbox's
        state. `404 not_found` when the sandbox has no such command (or, for
        `latest`, no commands).
        API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      responses:
        "200":
          description: The command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/MachineRef"
    get:
      tags: [ connections ]
      operationId: listProcesses
      summary: The sandbox's processes, live or as last seen.
      security:
        - bearerAuth: []
        - apiKey: []
        - sessionCookie: []
      description: |
        On a running sandbox (or one that paused itself, which wakes as for
        exec) the server runs `ps -e -ww -o pid=,ppid=,user:64=,pcpu=,pmem=,etimes=,args=`
        through exec, stores the list and returns it with `live: true`. The
        listing counts as an exec (the concurrency limit, the activity
        lease) but is not in the history. On a stopped or paused sandbox it
        returns the list stored last (`live: false`, `capturedAt`,
        `trigger`): the server reads the processes just before it stops or
        pauses a running sandbox (best effort: 5 seconds for the listing,
        then its write, before the stop goes on), so the list is from the
        moment of the stop and is there once the sandbox is stopped, and
        `404 not_found` when none was ever read. Without `all=true`, kernel threads and the
        listing's own processes (its shell, `ps`, `head` and the sshd
        sessions exec runs it in) are left out. `truncated` says the
        listing was cut at its last whole line (about 900 KB).
        `503 host_unavailable` when a running sandbox cannot be reached;
        `502 host_unavailable` when `ps` itself failed in it.
        API keys: needs one of the scopes `machines:write`, `machines:exec` (legacy).
      parameters:
        - { name: all, in: query, schema: { type: boolean }, description: Also list kernel threads and the listing's own processes. }
      responses:
        "200":
          description: The process list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
        "502": { description: "`host_unavailable`: the `ps` listing itself failed or timed out in the sandbox.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/machines/{id}/orca-connections:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ orca ]
      operationId: createOrcaConnection
      summary: Authorize one WebSocket to the sandbox's Orca runtime.
      description: |
        Returns a single-use tunnel endpoint (valid 60 s), an assertion the
        runtime verifies against its trust file (valid 5 min, `aud` =
        `orca:<machineId>`), and the runtime's E2EE public key. Every call
        mints a new ticket, so it takes no `Idempotency-Key`; clients call it
        once per socket. The first call after each sandbox change writes the
        trust file into the sandbox. Never starts a sandbox: `409
        machine_not_running`; a template without the `orca` capability: `409
        orca_unsupported`; a runtime that is not up yet: `409
        runtime_not_ready` (retryable).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrcaConnectionRequest" }
      responses:
        "201":
          description: Connection authorized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrcaConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/orca/keys:
    get:
      tags: [ orca ]
      operationId: getOrcaKeys
      summary: Keys that sign Orca runtime assertions. No authentication.
      security: []
      responses:
        "200":
          description: Issuer and keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrcaKeys" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tunnels/{ticket}:
    parameters:
      - name: ticket
        in: path
        required: true
        description: "`ibt_…` from an OrcaConnection endpoint; single use. Never logged."
        schema: { type: string }
    get:
      tags: [ orca ]
      operationId: openOrcaTunnel
      summary: WebSocket upgrade proxied to the sandbox's Orca runtime.
      description: |
        The ticket is the credential (WebSocket clients cannot set headers).
        HTTP/1.1 upgrade only. The tunnel closes when the sandbox stops,
        pauses or is deleted, and when the session that requested it is
        revoked.
      security: []
      responses:
        "101": { description: Switching Protocols; frames are relayed unchanged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/sessions:
    get:
      tags: [ sessions ]
      operationId: listSessions
      summary: List your active sign-ins (CLI and browser sessions).
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/sessions/{id}:
    delete:
      tags: [ sessions ]
      operationId: revokeSession
      summary: Sign out one of your sessions (revokes all its tokens).
      description: Revoking the current browser session also clears its cookie. No Idempotency-Key is needed; repeating it returns 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^ss_[0-9a-f]{24}$" }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/keys:
    get:
      tags: [ keys ]
      operationId: listAPIKeys
      summary: List your personal org's API keys (expired ones included, revoked ones not), as `GET /v1/orgs/{id}/keys` for it. Signed-in sessions only.
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: Keys, newest first. Secrets are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    post:
      tags: [ keys ]
      operationId: createAPIKey
      summary: Create an API key. Signed-in sessions only; an API key gets 403 permission_denied.
      description: |
        The reply holds the secret (`key`), shown only here. No Idempotency-Key is used:
        the secret is never stored, so a reply cannot be replayed.
        The key is your personal org's (`POST /v1/orgs/{id}/keys` for it) and reaches
        no other org. At most 20 active keys per org (`429 quota_exceeded`).
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPIKeyRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /v1/keys/{id}:
    delete:
      tags: [ keys ]
      operationId: revokeAPIKey
      summary: Revoke one of your personal org's API keys. Signed-in sessions only.
      description: Requests with the key then fail with `401 revoked_key`; SSH certificates the key issued are revoked too (they stop working and their open sessions close). Repeating it returns 404.
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^key_[a-z2-7]{26}$" }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/providers:
    get:
      tags: [ auth ]
      operationId: authProviders
      summary: List configured sign-in providers.
      security: []
      responses:
        "200":
          description: >-
            The sign-in buttons: the enabled providers, or `workos` alone when WorkOS is the default sign-in (docs/workos.md), whose button opens `/auth/workos/login`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { type: string, enum: [ github, google, workos ] }
  /auth/google/login:
    get:
      tags: [ auth ]
      operationId: googleLogin
      summary: Start Google sign-in through Better Auth, or open WorkOS's sign-in page when WorkOS is the default (docs/workos.md).
      security: []
      parameters:
        - name: cli_request
          in: query
          schema: { type: string }
          description: Optional signed request from `/auth/cli/start`; after sign-in return to dashboard CLI account confirmation.
        - name: origin
          in: query
          schema: { type: string }
          description: The dashboard origin the sign-in started from; a dashboard sign-in returns there only when it is one of the server's `stagingUrls`.
      responses:
        "302": { description: Redirect to Google. }
        "400": { description: Invalid or expired CLI return request. }
        "503": { description: Google sign-in is not configured. }
  /auth/google/callback:
    get:
      tags: [ auth ]
      operationId: googleCallback
      summary: Google OAuth callback.
      security: []
      responses:
        "302": { description: Redirect to sign-in completion. }
  /auth/google/complete:
    get:
      tags: [ auth ]
      operationId: googleComplete
      summary: Exchange the verified identity for an Instabox session or CLI code.
      security: []
      responses:
        "302": { description: Signed in. }
        "400": { description: Invalid state or cancelled sign-in. }
        "403": { description: Disabled user. }
        "503": { description: Identity service unavailable or identity rejected. }
  /auth/workos/login:
    get:
      tags: [ auth ]
      operationId: workosLogin
      summary: Open WorkOS's hosted sign-in page, where the person picks GitHub or Google (docs/workos.md).
      description: |
        The dashboard's one sign-in button when WorkOS is the default (`GET
        /auth/providers` lists `workos`), and the one way in while it is
        dark-launched beside Better Auth (`workos.default` false). It takes the
        query of `/auth/github/login`, which (like `/auth/google/login` and
        `/auth/cli/start?provider=`) opens the same page when WorkOS is the default.
      security: []
      parameters:
        - { name: admin, in: query, schema: { type: string } }
        - { name: cli_request, in: query, schema: { type: string } }
        - { name: origin, in: query, schema: { type: string } }
        - { name: invite, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        "302": { description: Redirect to WorkOS's sign-in page. }
        "400": { description: Invalid or expired CLI return request. }
        "503": { description: WorkOS is not configured. }
  /auth/workos/callback:
    get:
      tags: [ auth ]
      operationId: workosCallback
      summary: WorkOS callback; sets the `instabox_session` cookie, or for a native client sign-in redirects to its loopback URI.
      description: |
        Only with server.json `workos` (docs/workos.md); 404 otherwise. The state
        must match the `instabox_oauth` cookie the sign-in started with. The code is
        exchanged with WorkOS, the GitHub or Google identity is resolved to its
        account as with the identity service, and the WorkOS session is revoked.
        Any other sign-in method is refused.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Signed in, or redirected to the native client's loopback URI." }
        "400": { description: "State mismatch, expired or cancelled sign-in (HTML page)." }
        "403": { description: "A disabled user, a sign-in method other than GitHub or Google, an email WorkOS has not verified, or an identity instabox does not take (HTML page)." }
        "404": { description: WorkOS is not configured. }
        "502": { description: The WorkOS sign-in failed (HTML page). }
  /auth/github/login:
    get:
      tags: [ auth ]
      operationId: webLogin
      summary: Browser sign-in; redirects to GitHub (web flow with state and PKCE S256), through Better Auth, or to WorkOS's sign-in page when WorkOS is the default.
      security: []
      parameters:
        - name: cli_request
          in: query
          schema: { type: string }
          description: Optional signed request from `/auth/cli/start`; after sign-in return to dashboard CLI account confirmation.
        - name: origin
          in: query
          schema: { type: string }
          description: The dashboard origin the sign-in started from; a dashboard sign-in returns there only when it is one of the server's `stagingUrls`.
      responses:
        "302": { description: Redirect to GitHub. }
        "400": { description: Invalid or expired CLI return request. }
        "503": { description: "Browser sign-in is not configured (`github.clientSecretFile`)." }
  /auth/github/callback:
    get:
      tags: [ auth ]
      operationId: webCallback
      summary: GitHub web flow callback; sets the `instabox_session` cookie and redirects to `/`, or for a native client sign-in redirects to its loopback URI.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302":
          description: >-
            Signed in, or redirected through Better Auth completion.
        "400": { description: "State mismatch, expired sign-in or GitHub error (HTML page)." }
        "403": { description: The user was disabled by an admin (HTML page). }
  /auth/cli/start:
    get:
      tags: [ auth ]
      operationId: cliLogin
      summary: Native client (loopback) sign-in; open in the user's browser.
      description: |
        RFC 8252 loopback flow for CLIs and desktop apps. The client listens on
        a loopback port, opens this URL in the browser and waits for one request
        to its redirect URI. Invalid parameters get an HTML error page (no
        redirect). Without `provider`, redirects to the dashboard's
        `/dashboard/cli-authorize?request=...` with a signed request valid for
        10 minutes. The browser confirms its existing Instabox account, or
        signs in with GitHub or Google before confirming. Approval is an
        explicit, CSRF-protected POST to `/v1/auth/cli/authorize`.
        An explicit `provider` starts that provider's OAuth flow directly (on a server
        whose default sign-in is WorkOS, its sign-in page, where the person picks).
        On completion the browser returns to
        `redirect_uri?code=<ibc_...>&state=<state>`, or on failure to
        `redirect_uri?error=<error>&error_description=...&state=<state>` where
        `error` is `access_denied` (cancelled or disabled), `server_error`, or, with
        the invite gate on, `invite_required` (the account is not activated and no
        `invite` was sent) or `invite_invalid` (the code cannot be redeemed; checked
        before the provider opens, by the identity service's invites plugin when
        Better Auth is configured), or `quota_exceeded` (too many invalid invite codes
        from this client address in the past hour, as for `POST /v1/invites/redeem`;
        the code is not checked). A redeemable `invite` is redeemed as the sign-in
        completes. The client must check `state`, then call `POST /v1/auth/cli/token`
        within 60 seconds.
      security: []
      parameters:
        - name: invite
          in: query
          description: "An invite code (`K7R2QX`; older `482913` and `ibi_...` codes work too) for an account that is not activated yet (`instabox login --invite-code`)."
          schema: { type: string, maxLength: 64 }
        - name: provider
          in: query
          description: Optional explicit provider; omitted means confirm an account in the dashboard. `workos` signs in through WorkOS's page whenever WorkOS is configured, also while it is dark-launched (docs/workos.md).
          schema: { type: string, enum: [ github, google, workos ] }
        - name: redirect_uri
          in: query
          required: true
          description: Exactly `http://127.0.0.1:<port>/callback` or `http://[::1]:<port>/callback`, port 1024-65535 (no `localhost`, query or fragment).
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: Client CSRF value, 16-256 printable ASCII characters (no space), echoed to the redirect URI.
          schema: { type: string, minLength: 16, maxLength: 256 }
        - name: code_challenge
          in: query
          required: true
          description: PKCE challenge, base64url(sha256(verifier)) without padding (43-128 characters).
          schema: { type: string, minLength: 43, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [ S256 ] }
      responses:
        "302": { description: Redirect to dashboard account confirmation or the explicitly selected provider. }
        "400": { description: Invalid parameters (HTML page). }
        "503": { description: "Browser sign-in is not configured (`github.clientSecretFile`)." }

components:
  headers:
    Deprecation:
      description: >-
        RFC 9745: the route or a field of the request is deprecated (since the date given, `@<unix seconds>`). Routes also send `Link: <successor>; rel="successor-version"`.
      schema: { type: string, examples: [ "@1791331200" ] }
  securitySchemes:
    portAgent:
      type: apiKey
      in: header
      name: Authorization
      description: "Port ibpv_...; accepted only on this sandbox's port list, publish and unpublish routes, while it runs."
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque instabox access token (1 hour). Refresh with `/v1/auth/refresh` (refresh token valid 30 days, rotates on use).
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key (`ibk_...`) with scopes; also accepted as `Authorization: Bearer ibk_...`.
        Accepted on sandbox, snapshot, operation, template and usage routes per scope
        (see API keys), never on key management, sessions, logout or admin routes.
    sessionCookie:
      type: apiKey
      in: cookie
      name: instabox_session
      description: |
        Dashboard browser session from `/auth/github/login` (7 days idle, 30 days at
        most). Used only when no Authorization header is sent. Requests other than
        GET and HEAD must send `X-Instabox-CSRF` (from `GET /v1/me`) and an `Origin`
        equal to the server's `publicUrl`; otherwise `403 permission_denied`.

  parameters:
    SnapshotID:
      name: id
      in: path
      required: true
      description: Snapshot ID (`sn_`, or `im_` for older snapshots, + 26 lowercase base32 characters).
      schema: { type: string }
    FilesPath:
      name: path
      in: query
      description: Absolute path, at most 4096 bytes (default "/").
      schema: { type: string, default: / }
    MachineID:
      name: id
      in: path
      required: true
      description: Sandbox ID (`m_` + 26 lowercase base32 characters).
      schema: { type: string, pattern: "^m_[a-z2-7]{26}$" }
    MachineRef:
      name: id
      in: path
      required: true
      description: >-
        Sandbox ID (`m_` + 26 lowercase base32 characters) or the sandbox's name (unique among your sandboxes; names never contain `_`, so the two never collide). Older servers take only the ID and answer `404` for a name.
      schema: { type: string, pattern: "^(m_[a-z2-7]{26}|[a-z0-9][a-z0-9-]{0,62})$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key, 1-200 printable ASCII characters, scoped to the
        user. Same key and same method+path+body returns the original response;
        same key with a different request returns `409 idempotency_conflict`.
        Records are kept for 7 days.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: "^[\\x21-\\x7e]+$" }
    ConfirmDelete:
      name: X-Confirm-Delete
      in: header
      required: false
      description: |
        Guard against deleting the wrong resource: the ID or the exact name of
        the sandbox or snapshot being deleted. When sent, any other value
        (empty, another resource's name or ID, or the header twice) is
        `409 delete_confirmation_required` and nothing is deleted; the
        Idempotency-Key can then be reused. A sandbox delete with an API key
        created on or after the server's `confirmDeleteKeysFrom` cutover must
        send it (without it: the same 409, naming the ID to send); otherwise,
        without the header, the delete proceeds as before (an API key's
        response then carries a `Warning` header). The instabox CLI, the SDKs,
        the hosted MCP server and the dashboard send it.
      schema: { type: string }

  responses:
    OperationAccepted:
      description: The mutation was accepted (or replayed for the same idempotency key). Poll the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Operation" }
    BadRequest:
      description: >-
        `bad_request`: invalid input or missing Idempotency-Key. `unknown_field`: a body key that is no field of the request's schema (create, fork, restore, start, stop, suspend, resume, wake and `PATCH` of a sandbox); the message names it and the closest known field (`did you mean "templateId"?`) and lists the known ones. Nothing is changed. `spec_not_allowed`: sandbox sizes are fixed (4 vCPUs, 8 GiB memory by default; `limits.machineSpec`) and the request names another size (create, create from a snapshot), or someone other than an admin tries to grow the disk of a free sandbox or of a sandbox whose owner may not resize disks. On `PATCH /v1/machines/{id}` it is also a `vcpus`/`memMiB` size the workspace's plan does not offer (the message lists the plan's sizes) or any new size for a free sandbox, whose size is fixed. The message gives the size the sandbox gets; leaving the size fields out always works. `invalid_guest_user`: a create's `guestUser` is not a valid Linux user name or is reserved (`root`, `instabox`, the Debian base system's users and groups such as `sudo`, `systemd-*`). `vault_unavailable` (503): a Vault item was sealed under a master key this server does not have (docs/vault.md).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    PaymentRequired:
      description: >-
        `credit_exhausted`: the account's free sandbox used its hours for the month (when the server enforces a cap); it can run again next month (UTC). `spend_limit_reached`: the sandbox's paid org reached its spend cap for the month. `subscription_required`: the org's subscription ended. `payment_failed`: the charge a plan change needed did not succeed; the plan is unchanged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthenticated:
      description: "A credential 401 has its own code: `missing_key`, `malformed_key`, `invalid_key`, `expired_key`, `revoked_key` or `session_expired`, with `hint` and `docs` (older servers sent `unauthenticated`, `api_key_expired` or `api_key_revoked`). Other 401s (refresh tokens, tickets) are `unauthenticated`. For a missing or bad API key or access token the message ends with how to get a key (session and refresh-token 401s say to sign in again instead), e.g. `create an API key at https://dashboard.instabox.sh/dashboard/api-keys and send it as \"Authorization: Bearer <key>\" or \"X-API-Key: <key>\"`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    PermissionDenied:
      description: "`permission_denied`: the user is not allowed (not on the allowlist, or not the owner), or an API key was used where only a sign-in session is; `missing_scope`: the API key lacks the route's scope (`requiredScopes` names it; older servers sent `insufficient_scope`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: "`not_found`: no such resource (also for deleted sandboxes)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Conflict:
      description: |
        `operation_conflict` (another operation is active; `operationId` names it,
        or the transition is not allowed), `idempotency_conflict` (key reused for
        a different request), `delete_confirmation_required` (a delete's
        `X-Confirm-Delete` header is not the sandbox's or snapshot's ID or name,
        or a key that must send it left it out),
        `machine_not_running` (the sandbox is not running), `desktop_not_running` (the
        VNC endpoint before the desktop started), or for Orca connections
        `orca_unsupported` and `runtime_not_ready` (retryable).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    QuotaExceeded:
      description: >-
        `quota_exceeded`: one of your limits was reached: the number of sandboxes (on the free plan 1, in any state, stopped and paused included; Pro 500; Builder 1000), stored data (on the free plan 200 GiB), snapshots (on the free plan 5), API keys, execs or terminals. The message says which, e.g. "sandbox limit reached (1 of 1) in org alice (free plan): delete a sandbox first". Delete a sandbox or snapshot, upgrade the plan, or ask an admin to raise your limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Internal:
      description: "`internal`: unexpected server error."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    MetricsUnavailable:
      description: >-
        `metrics_unavailable`: the metrics store is turned off (`metrics.storeUrl` "off"), not running or failing. Retryable when it is down.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unavailable:
      description: >-
        `no_capacity` (there is no room for the sandbox right now; the message says what could not run and when to retry) or `host_unavailable` (the sandbox cannot be reached right now). Usually `retryable`; try again shortly. `no_capacity` is `retryable`: retry with exponential backoff (for example after 15 s, 30 s, 60 s, then every few minutes), or try another size or template. A create whose operation failed with it replays that failed operation for the same `Idempotency-Key`, so retry it with a new key. With `--fail-fast` the CLI's `create` and `run` exit 75 on it (otherwise 1). A retryable `no_capacity` has `retryAfterSeconds` and the same `Retry-After` header: wait at least that long before the first retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; the body's `retryAfterSeconds`.
          schema: { type: integer, minimum: 1, examples: [ 60 ] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    ActivityLease:
      type: object
      required: [ id, machineId, expiresAt ]
      properties:
        id: { type: string }
        machineId: { type: string }
        expiresAt: { type: string, format: date-time }
    PublicPort:
      type: object
      required: [ id, machineId, port, name, url, access, createdAt ]
      properties:
        id: { type: string, description: "The publication's ID; a new one after an unpublish, an access change or a token rotation. The URL does not change." }
        machineId: { type: string }
        port: { type: integer }
        name: { type: string }
        protocol:
          type: string
          enum: [ http, tcp ]
          description: "`http`: an HTTPS URL. `tcp`: a raw TCP service behind TLS at `address`, routed by SNI, always public (docs/public-ports.md, \"Raw TCP ports\")."
        url: { type: string, format: uri, description: "`https://<port>-<sandbox>.<domain>` for `http`, `tls://<address>` for `tcp`. Empty when public ports (or raw TCP ports) are not configured." }
        address: { type: string, description: "`tcp` only: the TLS endpoint `host:port`; the client must send the host as SNI. psql: `host=<host> port=<port> sslmode=require`." }
        access:
          type: string
          enum: [ public, private ]
          description: "`public`: anyone with the URL. `private`: only requests that carry the port's token (`_token` query parameter once, the cookie it sets, or `Authorization: Bearer`)."
        token: { type: string, description: "A private port's token (`ibp_...`), only in the publish response that created or rotated it." }
        tokenUrl: { type: string, format: uri, description: "`url` with `?_token=<token>`: the link to share. Present with `token`." }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: "null"
          deprecated: true
          description: Always null (public ports do not expire); kept for older in-guest instabox-port agents.
    PublicPortList:
      type: object
      required: [ enabled, ports ]
      properties:
        enabled: { type: boolean, description: Whether the server has public ports configured. }
        ports: { type: array, items: { $ref: "#/components/schemas/PublicPort" } }
    PublishPortRequest:
      type: object
      required: [ port ]
      properties:
        port: { type: integer, minimum: 1024, maximum: 65535, description: "Desktop port 5901 and Orca port 6768 (plus the configured Orca port) are reserved." }
        name: { type: string, maxLength: 100, description: "Omitted: the current name, or \"Port N\" for a new port." }
        protocol:
          type: string
          enum: [ http, tcp ]
          description: >-
            Omitted: the current protocol, or `http` for a new port. `tcp` publishes a raw TCP service behind TLS when the server enables it (403 otherwise; admins only while in preview); paid plans only, at most 5 per org by default (429). A port already published with the other protocol answers 409 until it is unpublished. A `tcp` port cannot be private (400).
        access: { type: string, enum: [ public, private ], description: "Omitted: the current access, or public for a new port. Changing it ends the old publication's connections. `private` is for `http` ports only." }
        rotateToken: { type: boolean, description: "With a private port: a new token, returned in the response; connections that used the old one close. 400 for a public port." }
    ErrorBody:
      type: object
      required: [ error ]
      properties:
        error: { $ref: "#/components/schemas/Error" }
    Org:
      type: object
      description: An org (docs/orgs.md). Sandboxes are created in one and count against its plan.
      required: [ id, name, tier, kind, personal, createdAt ]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string, enum: [ free, pro, builder, team, enterprise ] }
        kind:
          type: string
          enum: [ personal, workspace ]
          description: >-
            `personal`: the account's own org, made when it signed up, on any tier but with no other members: it takes no invites. `workspace`: an org to share, on any tier; on the free tier it needs a card on file and has up to `limits.maxMembers` members.
        personal:
          type: boolean
          description: "`kind` is `personal`."
        role:
          type: string
          enum: [ owner, admin, member ]
          description: Your role in the org.
        createdAt: { type: string, format: date-time }
        disabledAt:
          type: string
          format: date-time
          description: >-
            Set while the workspace cannot be used: its plan ended (cancelled, unpaid, or its credits ran out). Its sandboxes answer `402 subscription_required`; they and its snapshots are deleted 30 days later unless it subscribes again.
        purgeAt:
          type: string
          format: date-time
          description: >-
            Set on a disabled workspace: when its sandboxes and snapshots are deleted. Until then its people can download their `/data` (`POST /v1/orgs/{id}/exports`).
        cardMissingAt:
          type: string
          format: date-time
          description: >-
            Set while a workspace has no card on file. On the free tier its sandboxes then answer `402 payment_method_required` and running ones are paused (`trigger: payment_method`); they run again once one is added (`POST /v1/orgs/{id}/billing/checkout` with no tier, or the portal).
        allowedSpecs:
          type: array
          items: { $ref: "#/components/schemas/MachineSpec" }
          description: The sizes that may be created in the org, the default first (its plan's, then any an admin granted the org).
        limits: { $ref: "#/components/schemas/OrgLimits" }
        usage: { $ref: "#/components/schemas/OrgUsage" }
        billing: { $ref: "#/components/schemas/OrgBilling" }
    OrgBilling:
      type: object
      description: The org's Stripe subscription (docs/pricing.md); absent when it never had one.
      required: [ status, tier, subscribed, cancelAtPeriodEnd ]
      properties:
        status:
          type: string
          enum: [ incomplete, active, past_due, canceled ]
          description: "`incomplete`: Checkout not completed; `past_due`: a charge failed, the plan stays until the next billing pass ends it (`graceUntil`)."
        tier: { type: string, enum: [ pro, builder, team, enterprise ], description: The subscribed tier. }
        scheduledTier: { type: string, enum: [ pro, builder, team ], description: A lower tier that applies at the next renewal. }
        subscribed: { type: boolean, description: A Stripe subscription exists. }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean, description: The subscription ends at periodEnd. }
        pastDueSince: { type: string, format: date-time }
        graceUntil: { type: string, format: date-time, description: When an unpaid subscription ends (the failed charge's time; the next billing pass ends it). }
        funding:
          type: string
          enum: [ stripe, credits ]
          description: "What pays the plan: a Stripe subscription, or the org's credits (renewed by the server on the 1st)."
        unpaidInvoiceIds:
          type: array
          items: { type: string }
          description: Stripe invoices whose charge failed and are still open; until they are paid (the billing portal) the org cannot subscribe again, and a subscription it completed meanwhile does not take effect.
    CreateOrgRequest:
      type: object
      required: [ name, tier ]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        tier: { type: string, enum: [ pro, builder, team ] }
    CheckoutRequest:
      type: object
      properties:
        tier: { type: string, enum: [ pro, builder, team ], description: "The tier to subscribe to; absent: a disabled workspace's own, or on a free workspace a card to save." }
    CheckoutResponse:
      type: object
      required: [ url ]
      properties:
        org: { $ref: "#/components/schemas/Org", description: The org; absent when the Checkout buys a new workspace. }
        url: { type: string, description: "The Stripe Checkout URL to send the user to; empty when the org is on the plan already (its credits covered the rest of the month, or the card on file paid)." }
    PortalResponse:
      type: object
      required: [ url ]
      properties:
        url: { type: string, description: The Stripe customer portal URL to send the user to. }
    ChangePlanRequest:
      type: object
      required: [ tier ]
      properties:
        tier: { type: string, enum: [ pro, builder, team ] }
    SubscribeWithCreditsRequest:
      type: object
      required: [ tier ]
      properties:
        tier: { type: string, enum: [ pro, builder, team ] }
    OrgLimits:
      type: object
      required: [ maxMachines, maxRunning, freeSandboxes, maxMembers, freeSandboxHours, maxSnapshots, maxStoredGiB, monthlyCreditUSD, maxVCPUs, startsPerMinute, alwaysOn, spendCapUSD ]
      properties:
        maxMachines: { type: integer, description: "Sandboxes the org may have, in any state: on the free tier its allowance (`freeSandboxes`, never billed), on a paid plan the plan's count, every one billed; 0: no limit. An org over it keeps what it has but creates nothing more." }
        maxRunning: { type: integer, description: "Paid sandboxes that may run at once; 0: no limit." }
        freeSandboxes: { type: integer, description: "The free tier's sandbox allowance (never billed): limits.maxMachinesPerUser, or an admin's override on the org." }
        earlyAllowanceEnded: { type: boolean, description: "True when the org's early free-sandbox allowance (five, until 2026-12-01 00:00 UTC) has ended and it has more free sandboxes than `freeSandboxes`: only that many may run, the others are paused and a start of one is refused (`402 early_allowance_ended`). Absent otherwise." }
        maxMembers: { type: integer, description: "Members the org may have, its owner and pending invites included; 0: no limit (a personal org: 1)." }
        freeSandboxHours: { type: number, description: "The free sandboxes' running time a month when the server caps it; 0: no cap." }
        maxSnapshots: { type: integer, description: "Live snapshots the org may have; 0: no limit." }
        maxStoredGiB:
          type: integer
          description: >-
            Cap on the disk (`/data`) allocated to the org's live sandboxes, in GiB: new sandboxes and snapshots in the org are refused (`429 quota_exceeded`) while it is over. 0: no limit.
        monthlyCreditUSD:
          type: number
          description: Always 0 (kept for older clients); the free sandbox has hours, not a credit.
        maxVCPUs: { type: integer, description: "The largest sandbox size the plan offers, by vCPUs." }
        maxDiskGiB: { type: integer, description: "How far its owner may grow a sandbox's disk (`/data`), in GiB (free 20, fixed: it neither grows nor shrinks; pro 200; builder 500; team and enterprise 1024); a disk already past it is kept. 0: no limit." }
        startsPerMinute: { type: integer, description: "Sandbox starts (create, start, resume, wake) the org may make a minute; 0: no limit." }
        alwaysOn: { type: boolean, description: Whether the plan's sandboxes may turn idle auto-suspend off. }
        spendCapUSD:
          type: [ number, "null" ]
          description: A paid org's cap on this month's usage beyond its allowance (`PATCH /v1/orgs/{id}/billing`); null when none, 0 when nothing beyond the allowance is allowed.
        usageAlertPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: "A paid org's usage alert: its owner and admins are emailed once a month when usage reaches this share of what the month includes (the allowance plus the credits); 0: off. Absent where no email would go out: the free tier, billing off, no active or past-due subscription, or a plan without a monthly fee (enterprise) and no credits."
        overageAlert:
          type: boolean
          description: Whether a paid org's owner and admins are emailed once a month when usage goes beyond what the month includes (pay as you go).
        thresholdBillingUSD:
          type: number
          description: "Usage beyond what the month includes is charged to the card each time what is not charged yet reaches this, rather than all at the month's end; absent when only at the end, and for an org that is not charged so (credits-funded, no subscription, or a plan without a monthly fee)."
    OrgUsage:
      type: object
      required: [ periodStart, periodEnd, machines, freeMachines, freeSandboxHours, running, snapshots, vcpuHours, memGiBHours, storageGiBHours, egressGiB, runtimeUSD, vcpuUSD, memUSD, storageUSD, egressUSD, costUSD, allowanceUSD, creditRemainingUSD, overageUSD, remainingUSD, ratedUntil, billableDiskGiB, allocatedDiskGiB, storedBytes, storageComputedAt, creditsUSD, creditsUsedUSD ]
      description: >-
        The org's usage this calendar month (UTC) as the hourly rating job priced it: running time by sandbox size, the allocated disk (`/data`) of the paid sandboxes beyond the plan's included disk, and egress beyond the plan's free egress a month, up to `ratedUntil`. Snapshots and the system disk are not billed.
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        machines: { type: integer, description: Live sandboxes now. }
        freeMachines: { type: integer, description: "Of them, the free sandboxes (never billed)." }
        freeSandboxHours: { type: number, description: The free sandboxes' running time this month. }
        running: { type: integer, description: "The paid sandboxes running or starting now: what `limits.maxRunning` is checked against when a sandbox is created, started or resumed." }
        snapshots: { type: integer, description: Live snapshots now. }
        billableDiskGiB: { type: number, description: "The disk being billed now: the sum over the org's paid sandboxes of their allocated `/data` (less `freeDiskGiBPerSandbox` each, 0 by default), less `includedDiskGiB`; 0 while the org is past due or disabled (nothing is rated then), and without sandboxes of an earlier account life." }
        allocatedDiskGiB: { type: integer, description: "The `/data` of all the org's live sandboxes, free ones included, in GiB: what `limits.maxStoredGiB` is checked against." }
        freeDiskGiBPerSandbox: { type: number, description: "The `/data` of each paid sandbox that is not billed, in GiB: 0 by default (every allocated GiB is billed); an operator may configure more. Absent from older servers, which did not bill the first 20 GiB." }
        includedDiskGiB: { type: number, description: "The disk the org's plan includes, all its paid sandboxes' `/data` together, in GiB (Pro 200, Builder 1024, Team and Enterprise 5120): each hour that much is not billed. Absent from older servers, which included none." }
        storedBytes:
          type: [ integer, "null" ]
          format: int64
          deprecated: true
          description: "Deprecated: always null. Storage is billed on allocated disk, not stored bytes; use `billableDiskGiB`."
        storageComputedAt: { type: [ string, "null" ], format: date-time, deprecated: true, description: "Deprecated: always null." }
        creditsUSD: { type: number, description: "What the org's unexpired credits have left: they pay a plan's fee and usage beyond the allowance (docs/pricing.md, Credits)." }
        creditsExpireAt: { type: string, format: date-time, description: When the earliest of the credits expires. }
        creditsUsedUSD: { type: number, description: What credits paid this month. }
        chargedUSD: { type: number, description: "Usage beyond the allowance already charged this month (threshold billing); the month's end bills overageUSD less it." }
        vcpuHours: { type: number }
        memGiBHours: { type: number }
        storageGiBHours: { type: number, description: "Allocated disk (`/data`) of the paid sandboxes (less `freeDiskGiBPerSandbox` each, 0 by default) beyond the plan's `includedDiskGiB` each hour, in GiB-hours." }
        egressGiB: { type: number, description: "Egress to the public internet beyond the plan's free egress this month (metered per machine, rated hourly)." }
        runtimeUSD: { type: number, description: "Compute: `vcpuUSD` plus `memUSD`." }
        vcpuUSD: { type: number, description: The vCPU part of compute. }
        memUSD: { type: number, description: The memory part of compute. }
        storageUSD: { type: number }
        egressUSD: { type: number }
        costUSD: { type: number, description: "This month's usage so far, at the prices in force when rated." }
        allowanceUSD: { type: number, description: "Usage the month includes: the free credit, or what the subscription paid for." }
        creditRemainingUSD: { type: number, description: The allowance left. }
        overageUSD: { type: number, description: Usage beyond the allowance (billed at month end on a paid tier). }
        remainingUSD: { type: number, description: "What may still be used before the org is stopped; 0 when there is no limit or nothing is left (see `limits`)." }
        ratedUntil: { type: string, format: date-time, description: The rating job's cursor. }
    OrgMember:
      type: object
      required: [ userId, login, role, createdAt ]
      properties:
        userId: { type: integer, format: int64 }
        login: { type: string }
        email: { type: string, format: email, description: "Verified email, when available." }
        role: { type: string, enum: [ owner, admin, member ] }
        createdAt: { type: string, format: date-time, description: When they joined. }
    GitHubJob:
      type: object
      required: [ id, repo, labels, state, createdAt ]
      properties:
        id: { type: integer, format: int64, description: "The GitHub workflow job ID." }
        repo: { type: string, description: "owner/name" }
        workflow: { type: string }
        job: { type: string }
        labels: { type: array, items: { type: string }, description: "The job's runs-on labels." }
        size: { type: string, enum: [ instabox-small, instabox-medium, instabox-large, instabox-xlarge, instabox-2xlarge ], description: "The size label among them." }
        snapshot: { type: string, description: "The snapshot (name or ID, lower-case) its `SIZE-snapshot-<snapshot>` label (e.g. `instabox-medium-snapshot-acme-warm`) starts its box from instead of the stock `ci` template: a ready snapshot of a `ci` machine in the org the App install is linked to, else the job is refused, as is one of a public repository or of one that runs workflows of pull requests from forks. Absent: none." }
        state: { type: string, enum: [ waiting, starting, started, completed, refused, failed ] }
        reason: { type: string, description: "Why the job waits, was refused or failed." }
        machineId: { type: string, description: "The CI box the job holds: its own, or one handed to it while it waited. Omitted once it ran on another runner than that box's (ranOn)." }
        ranOn: { type: string, description: "The runner GitHub ran the job on." }
        conclusion: { type: string, description: "GitHub's conclusion once completed: success, failure, cancelled..." }
        branch: { type: string, description: "Its run's head branch; left out for a job recorded before it was." }
        commit: { type: string, description: "Its run's head commit SHA; left out for a job recorded before it was." }
        actor: { type: string, description: "The GitHub login that triggered its run; left out for a job recorded before it was." }
        createdAt: { type: string, format: date-time, description: "When GitHub queued it." }
        startedAt: { type: string, format: date-time, description: "When a runner took it; the wait is from createdAt." }
        completedAt: { type: string, format: date-time }
        completionSource:
          type: string
          enum: [ webhook, runner_gone, runner_gone_timeout, github_api, access_lost ]
          description: "How instabox learned the job completed: webhook (GitHub's completed event), runner_gone (GitHub removed its runner and answered the job ended), runner_gone_timeout (GitHub removed its runner but still had the job running after instabox waited 5 minutes; the box was deleted anyway), github_api (GitHub's job API answered the job ended: a runner-pool job, or one whose completed event never came because its box is gone or GitHub refuses instabox its runner) or access_lost (GitHub refused instabox the job for 5 minutes, as after its repository is removed from the instabox GitHub App or the App is suspended or uninstalled; instabox ended it without GitHub's result and deleted its box). Left out before it completes and for jobs completed before it was recorded."
    GitHubJobList:
      type: object
      required: [ jobs, hasMore, counts, unlinked, linked, setup ]
      properties:
        jobs: { type: array, items: { $ref: "#/components/schemas/GitHubJob" } }
        hasMore: { type: boolean, description: "More jobs of the state group asked for follow this page (next: offset + limit)." }
        counts: { $ref: "#/components/schemas/GitHubJobCounts" }
        unlinked:
          type: array
          description: Installs unlinked from the org when the member who linked them left it; their jobs start nothing until an owner or admin links them again.
          items: { $ref: "#/components/schemas/GitHubUnlinkedInstallation" }
        linked: { type: boolean, description: An install of the GitHub App is linked to the org. }
        setup: { $ref: "#/components/schemas/GitHubJobSetup" }
        installUrl: { type: string, description: "Where an owner or admin installs the App and links it to the org, in a browser signed in to instabox." }
    GitHubJobCounts:
      type: object
      description: The org's jobs in each state group that `state` takes.
      required: [ all, running, waiting, succeeded, failed ]
      properties:
        all: { type: integer }
        running: { type: integer, description: "`starting` or `started`." }
        waiting: { type: integer }
        succeeded: { type: integer, description: "`completed` with conclusion `success`." }
        failed: { type: integer, description: "`completed` with conclusion `failure` or `timed_out`, `refused` or `failed`." }
    GitHubJobSetup:
      type: object
      description: "What the CI page's setup steps count: only the jobs of the installs linked to the org now. An App uninstalled and installed again is a new install, so the setup starts over while the old jobs stay listed and in `counts`."
      required: [ queued, ran, running, waiting ]
      properties:
        queued: { type: boolean, description: A job came in. }
        ran: { type: boolean, description: "A job ran to its end on a CI box, whatever its conclusion." }
        running: { type: integer, description: "`starting` or `started`." }
        waiting: { type: integer }
    GitHubJobDetail:
      type: object
      required: [ job ]
      properties:
        job: { $ref: "#/components/schemas/GitHubJob" }
        boxCreatedAt: { type: string, format: date-time, description: "When its own CI box was created. Absent: no box yet, or GitHub ran the job on another job's box." }
        boxRunningAt: { type: string, format: date-time, description: "When that box first ran." }
        vcpus: { type: integer, description: "The machine of its size." }
        memMiB: { type: integer }
        branch: { type: string, description: "Its run's branch, from GitHub." }
        commit: { type: string, description: "Its run's commit SHA, from GitHub." }
        failedStep: { type: string, description: "The first step that failed, from GitHub." }
    GitHubJobStats:
      type: object
      required: [ days, jobs, ran, passed, perDay, bySize ]
      properties:
        days: { type: integer, description: "How many days, today included." }
        jobs: { type: integer, description: Jobs queued. }
        ran: { type: integer, description: "Jobs that ran to their end on a CI box, whatever their conclusion." }
        passed: { type: integer, description: "Of those, jobs with conclusion `success`." }
        wait: { $ref: "#/components/schemas/GitHubJobWait" }
        run: { $ref: "#/components/schemas/GitHubJobRun" }
        perDay: { type: array, items: { $ref: "#/components/schemas/GitHubJobDay" }, description: "Every day, oldest first." }
        bySize: { type: array, items: { $ref: "#/components/schemas/GitHubSizeWait" }, description: "Each size with jobs, small to large." }
        step: { type: integer, description: "The step asked for, in seconds." }
        buckets: { type: array, items: { $ref: "#/components/schemas/GitHubJobBucket" }, description: "With step: every step from from, oldest first." }
    GitHubJobWait:
      type: object
      description: "Seconds from queued to a runner taking the job. Absent when no job was taken."
      required: [ p50, p90 ]
      properties:
        p50: { type: number }
        p90: { type: number }
        slot: { type: number, description: "Median until the CI box was created (plan limits, capacity), over jobs that ran on their own box." }
        boot: { type: number, description: "Median until the box ran." }
        handover: { type: number, description: "Median until GitHub gave the box's runner the job." }
    GitHubJobRun:
      type: object
      description: "Seconds from a runner taking the job to its end. Absent when no job ended."
      required: [ p50, p90 ]
      properties:
        p50: { type: number }
        p90: { type: number }
    GitHubJobDay:
      type: object
      required: [ date, passed, failed, other ]
      properties:
        date: { type: string, format: date }
        passed: { type: integer }
        failed: { type: integer, description: "Ran to its end on a CI box with conclusion `failure` or `timed_out`." }
        other: { type: integer, description: "Did not run (refused, failed to start, cancelled first), ended otherwise (`cancelled`, `skipped`) or not done yet." }
    GitHubJobBucket:
      type: object
      required: [ start, passed, failed, other ]
      properties:
