          description: The file's bytes.
          headers:
            X-Instabox-File-Path: { schema: { type: string }, description: "The resolved path, percent-encoded." }
            X-Instabox-File-Mode: { schema: { type: string }, description: "Octal permissions, for example 0644." }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
