        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/machines/{id}/access:
    parameters:
      - $ref: "#/components/parameters/MachineID"
    post:
      tags: [ machines ]
      operationId: createMachineAccessTicket
      security:
        - bearerAuth: []
        - sessionCookie: []
        - apiKey: []
      summary: Get a Terminal or VNC connection URL and short-lived admission ticket.
      description: >-
        Browser sessions require CSRF as for other mutations. The response URL may use a separate access origin; API cookies stay on the API host. Offer the returned protocol and `instabox-access-token.<token>` as WebSocket subprotocols. Never put the ticket in a URL. Tickets expire after 60 seconds, are bound to the machine, purpose and browser Origin, and are checked against current permissions. Expiry only controls admission; established sessions are checked for revocation separately. A VNC ticket also authorizes watchUrl with an Authorization Bearer header. Combined deployments may return no token and use existing auth. To reconnect only a watch, retain the established VNC connection's URLs and request requireTicket to refresh authorization even after routing rolls back. Do not move the watch to a different process. API keys need `machines:write` or `machines:exec`. No Idempotency-Key.
      requestBody:
