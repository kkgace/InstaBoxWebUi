server {
    # InstaBox WebUI 控制台（云主机版）：https://console.example.com:8005
    # 后端 = 127.0.0.1:3010 上的 node（只绑回环，只有 nginx 能触达 → 客户端无法伪造 XFF 绕过 IP 门）
    # 证书复用 console.example.com（CN/SAN=console.example.com，至 2027-01-23）
    # 端口 8005：8000-8009 区间里空闲的一个（8004/8007/8009 被 xray 入站占用）
    listen 8005 ssl http2;
    listen [::]:8005 ssl http2;
    server_name console.example.com;

    ssl_certificate     /etc/ssl/private/console.example.com_bundle.crt;
    ssl_certificate_key /etc/ssl/private/console.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CONSOLE8009:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling off;

    server_tokens off;

    # 沙箱大文件上传/下载
    client_max_body_size 1024m;
    client_body_timeout 300s;

    access_log /var/log/nginx/instabox-console-8005.access.log;
    error_log  /var/log/nginx/instabox-console-8005.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # 终端/桌面走 WebSocket（控制台 /ws 代理到沙箱 access ticket）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;

        # 末位 = 真实客户端 IP（控制台取 XFF 末段做 ALLOW_IPS 判定；客户端伪造的前段无效）
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Port    $server_port;

        # SSE / 流式 / 长轮询（沙箱 exec wait=25s）必须不缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 15s;
    }
}
